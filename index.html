<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人脈リスト A/B/C</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  background: #f7f7f5; color: #1f1f1f; line-height: 1.5;
  padding: 16px; max-width: 900px; margin: 0 auto;
}
header { margin-bottom: 16px; }
h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.sub { font-size: 13px; color: #787774; }
.src-link { display: inline-block; margin-top: 7px; margin-right: 6px; font-size: 12px; font-weight: 600; color: #1a7f4b; background: #e6f4ec; border: 1px solid #bfe3cf; padding: 4px 11px; border-radius: 6px; text-decoration: none; }
.src-link:hover { background: #d6ecdf; }
.toolbar { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; align-items: center; }
#search {
  flex: 1; min-width: 160px; padding: 9px 12px; font-size: 14px;
  border: 1px solid #e0e0dc; border-radius: 8px; background: #fff;
}
#search:focus { outline: none; border-color: #a5a5a0; }
.btn {
  padding: 8px 12px; font-size: 13px; border: 1px solid #e0e0dc;
  background: #fff; border-radius: 8px; cursor: pointer; color: #37352f;
}
.btn:hover { background: #f0f0ee; }
.cat { margin-bottom: 12px; border: 1px solid #ececea; border-radius: 12px; overflow: hidden; background: #fff; }
.cat-head {
  display: flex; align-items: center; gap: 10px; padding: 14px 16px;
  cursor: pointer; user-select: none; background: #fff;
}
.cat-head:hover { background: #fafafa; }
.chev { transition: transform .18s; font-size: 12px; color: #9b9a97; width: 12px; transform: rotate(90deg); }
.cat.collapsed .chev { transform: rotate(0deg); }
.cat.collapsed .cat-body { display: none; }
.badge-cat { font-weight: 700; font-size: 15px; width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: #fff; }
.A .badge-cat { background: #e0574a; }
.B .badge-cat { background: #e0803a; }
.C .badge-cat { background: #d9a628; }
.cat-title { font-weight: 600; font-size: 15px; }
.cat-count { font-size: 12px; color: #908f8c; background: #f1f1ef; padding: 2px 8px; border-radius: 20px; margin-left: auto; }
.cat-body { padding: 6px 12px 14px; }
.card {
  border: 1px solid #efefed; border-radius: 10px; padding: 12px 14px; margin: 8px 0;
  background: #fcfcfb;
}
.card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.name { font-weight: 700; font-size: 15px; }
.catfilter { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; flex-wrap: wrap; }
.cf-label { font-size: 12px; color: #787774; margin-right: 2px; }
.cf { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; padding: 5px 11px; border: 1px solid #e0e0dc; border-radius: 20px; cursor: pointer; user-select: none; background: #fff; }
.cf input { accent-color: #6a51b3; cursor: pointer; }
.cf-A { color: #b23a2e; } .cf-B { color: #b25f1e; } .cf-C { color: #9a7414; } .cf-D { color: #2f5bbf; }
.cbadge { font-weight: 700; font-size: 11px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: #fff; }
.cbadge.A { background: #e0574a; } .cbadge.B { background: #e0803a; } .cbadge.C { background: #d9a628; } .cbadge.D { background: #4a7fe0; }
.empty { text-align: center; color: #9b9a97; padding: 30px; font-size: 14px; }
.pill { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
.p-status { background: #eae6f5; color: #6a51b3; }
.p-sex-m { background: #e3eefc; color: #3a72c9; }
.p-sex-f { background: #fce3ef; color: #c94b8a; }
.nb { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; color: #fff; letter-spacing: .02em; }
.nb0 { background: #d63a2f; box-shadow: 0 0 0 2px rgba(214,58,47,.18); }
.nb1 { background: #e0662a; }
.nb3 { background: #e0913a; }
.nb7 { background: #c9a227; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px 16px; margin-top: 6px; }
.f { font-size: 12.5px; color: #4a4945; }
.f .k { color: #98968f; margin-right: 5px; }
.memo { font-size: 12.5px; color: #4a4945; margin-top: 8px; padding: 8px 10px; background: #f4f3f0; border-radius: 8px; border-left: 3px solid #d9c8a0; white-space: pre-wrap; }
.hl { display: flex; align-items: center; gap: 8px; padding: 8px 11px; border-radius: 9px; margin-top: 7px; font-size: 13px; flex-wrap: wrap; }
.hl-action { background: #eaf2fe; border-left: 4px solid #3a72c9; }
.hl-next { background: #fff1e6; border-left: 4px solid #e0803a; }
.hl-label { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 5px; color: #fff; letter-spacing: .02em; }
.hl-action .hl-label { background: #3a72c9; }
.hl-next .hl-label { background: #e0803a; }
.hl-date { font-weight: 800; font-size: 15px; color: #1a1a1a; }
.hl-what { color: #45443f; font-weight: 600; }
.det { margin-top: 9px; }
.det summary { cursor: pointer; font-size: 12px; color: #787774; list-style: none; padding: 4px 2px; user-select: none; }
.det summary::-webkit-details-marker { display: none; }
.det summary::before { content: "\25B8 "; color: #9b9a97; }
.det[open] summary::before { content: "\25BE "; }
.det-body { padding-top: 6px; }
.f.wide { grid-column: 1 / -1; }
.f.miss { background: #fff4f4; border: 1px solid #f3cfca; border-radius: 6px; padding: 3px 8px; }
.f.miss .k { color: #c0392b; }
.blank { background: #f6d5d0; color: #b0281c; font-weight: 700; font-size: 11px; padding: 1px 7px; border-radius: 5px; }
.miss-badge { font-size: 11px; color: #c0392b; font-weight: 600; margin-left: 4px; }
.events-box { margin-bottom: 14px; border: 1px solid #e6e2d9; border-radius: 12px; overflow: hidden; background: #fffdf7; }
.events-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; cursor: pointer; user-select: none; }
.events-head:hover { background: #fdf9ee; }
.events-title { font-weight: 700; font-size: 15px; }
.events-count { font-size: 12px; color: #9a8a5c; background: #f3ecd8; padding: 2px 8px; border-radius: 20px; margin-left: auto; }
.events-box.collapsed .events-body { display: none; }
.events-box.collapsed .chev { transform: rotate(0deg); }
.ev { display: flex; gap: 12px; padding: 10px 14px; border-top: 1px solid #f0ebdd; }
.ev-date { flex: 0 0 auto; width: 50px; text-align: center; }
.ev-d { font-weight: 800; font-size: 16px; color: #b8860b; line-height: 1.1; }
.ev-dow { font-size: 11px; color: #9a8a5c; }
.ev-body { flex: 1; min-width: 0; }
.ev-title { font-weight: 700; font-size: 14px; }
.ev-theme { font-size: 11px; color: #6a51b3; background: #eae6f5; padding: 1px 7px; border-radius: 20px; margin-left: 6px; white-space: nowrap; }
.ev-meta { font-size: 12.5px; color: #4a4945; margin-top: 2px; }
.ev-link { font-size: 12px; color: #2f6bcc; text-decoration: none; margin-top: 3px; display: inline-block; word-break: break-all; }
.ev-link:hover { text-decoration: underline; }
.ev-sheet { display: inline-block; margin-top: 5px; font-size: 12px; color: #1a7f4b; background: #e6f4ec; border: 1px solid #bfe3cf; padding: 3px 10px; border-radius: 6px; text-decoration: none; font-weight: 600; }
.ev-sheet:hover { background: #d6ecdf; }
.ev { align-items: flex-start; }
.evchk { margin-top: 4px; width: 16px; height: 16px; accent-color: #b8860b; cursor: pointer; flex: 0 0 auto; }
.ev-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 14px 4px; border-top: 1px solid #f0ebdd; }
.btn-primary { background: #b8860b; color: #fff; border-color: #b8860b; }
.btn-primary:hover { background: #a5790a; }
.ev-status { font-size: 12px; color: #9a8a5c; }
.ev-text { display: block; width: calc(100% - 28px); margin: 4px 14px 14px; min-height: 130px; font-size: 12.5px; font-family: inherit; line-height: 1.5; border: 1px solid #e6e2d9; border-radius: 8px; padding: 10px 12px; background: #fff; color: #333; resize: vertical; box-sizing: border-box; }
footer { margin-top: 18px; font-size: 11px; color: #b0afab; text-align: center; }

/* ===== 人脈ガーデン ===== */
.tabs { display: flex; gap: 6px; margin: 0 0 14px; border-bottom: 1px solid #e6e6e2; }
.tab { padding: 9px 18px; font-size: 14px; font-weight: 600; border: 0; background: none; cursor: pointer; color: #8b8a86; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: #4a7c40; }
.tab.active { color: #2f6b28; border-bottom-color: #4c9a3f; }
body.view-garden #listwrap { display: none; }
body.view-list #gardenwrap { display: none; }
#calwrap { display: none; }
body.view-calendar #calwrap { display: block; }
body.view-calendar #gardenwrap, body.view-calendar #listwrap, body.view-calendar .toolbar,
body.view-calendar #catfilter, body.view-calendar #events { display: none; }
/* 高さを24時間ぶん（約48px/時×24＋ヘッダー等）確保して、埋め込み内のスクロールを無くす。
   もし下側に少しスクロールが残る/余白が大きすぎる場合は、この height の数値を調整する。 */
.cal-frame { width: 100%; height: 1400px; border: 1px solid #d7e6cf; border-radius: 12px; background: #fff; }
.cal-note { font-size: 12px; color: #6b7a63; margin: 8px 4px 0; }
#slots { margin-top: 16px; }
.slots-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.slots-title { font-size: 15px; font-weight: 700; color: #2f6b3a; }
.slots-copy { font-size: 12px; font-weight: 600; color: #1a7f4b; background: #e6f4ec; border: 1px solid #bfe3cf; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-family: inherit; }
.slots-copy:hover { background: #d6ecdf; }
.slots-note { font-size: 11.5px; color: #6b7a63; margin: 4px 0 10px; }
.slots-empty { font-size: 13px; color: #8b8a86; padding: 10px 0; }
.slot-day { display: flex; gap: 10px; align-items: flex-start; padding: 7px 2px; border-top: 1px solid #eef3ea; }
.slot-date { min-width: 66px; font-size: 13px; font-weight: 700; color: #3a4a34; padding-top: 2px; }
.slot-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.slot-chip { font-size: 12px; background: #f1f8ee; border: 1px solid #cfe6c4; border-radius: 6px; padding: 3px 9px; color: #2c4a2a; }

.gd-sky { background: linear-gradient(180deg,#eaf6e4 0%, #f4faf0 100%); border: 1px solid #dbead3; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.gd-stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.gd-stat { background: #fff; border: 1px solid #dbead3; border-radius: 10px; padding: 8px 13px; font-size: 12px; color: #557050; }
.gd-stat b { display: block; font-size: 19px; font-weight: 800; color: #2f6b28; line-height: 1.2; }
.gd-stat.warn b { color: #c0392b; }
.gd-stat.thirsty b { color: #b8860b; }
.gd-stat.nut b { color: #8a6d3b; }
.gd-stat.last { border-color: #e8cf8a; background: #fffaef; }
.gd-stat.last b { color: #b8860b; }
.plant-last { position: absolute; top: 4px; right: 2px; font-size: 8.5px; font-weight: 800; color: #7a5a12; background: #ffd970; border-radius: 20px; padding: 1px 4px; white-space: nowrap; pointer-events: none; box-shadow: 0 0 0 2px rgba(255,217,112,.3); }
/* 詳細パネルの栄養バー */
.gd-nut { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 0; padding: 8px 11px; background: #faf7f0; border: 1px solid #e8e2d6; border-radius: 8px; font-size: 12px; color: #6b5a3a; }
.gd-nut.almost { background: #fffaef; border-color: #e8cf8a; }
.gd-nut-t { font-weight: 700; flex: 0 0 auto; }
.gd-nut-bar { flex: 1 1 90px; height: 6px; border-radius: 4px; background: #e8e2d6; overflow: hidden; }
.gd-nut-bar i { display: block; height: 6px; border-radius: 4px; background: #b08a4a; }
.gd-nut-p { flex: 0 0 auto; font-weight: 700; }
.gd-nut-badge { flex: 0 0 auto; font-size: 11px; font-weight: 800; color: #7a5a12; background: #ffd970; border-radius: 20px; padding: 2px 9px; white-space: nowrap; }
.gd-nut-hint { flex: 1 1 100%; font-size: 11px; color: #9a8a6a; }
/* 予定編集・プロフィール編集ボタンの並び */
.gd-editrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.gd-editrow > .gd-editbtn { margin-top: 0; }
.gd-editrow > .gd-edit, .gd-editrow > .gd-prof { flex: 1 1 100%; }
/* プロフィール編集フォーム（13項目まとめて、保存は1ボタン） */
.gd-prof { padding: 12px; border: 1px solid #d7e6cf; border-radius: 9px; background: #f6fbf3; }
.gd-prof-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 12px; }
.gd-prof-grid label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; font-weight: 600; color: #5a6b52; }
.gd-prof-grid label.pe-empty > span::after { content: " ・空欄"; color: #c0392b; font-weight: 700; }
.gd-prof-grid input { padding: 6px 8px; font-size: 13px; border: 1px solid #cdddc5; border-radius: 6px; background: #fff; font-family: inherit; font-weight: 400; color: #1f1f1f; }
.gd-prof-tools { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

.gd-call { background: #fff8e6; border: 1px solid #f0dfae; border-left: 4px solid #e0a93a; border-radius: 10px; padding: 11px 14px; margin-bottom: 12px; }
.gd-call-t { font-size: 13px; font-weight: 700; color: #8a6318; margin-bottom: 6px; }
.gd-call-list { display: flex; gap: 6px; flex-wrap: wrap; }
.gd-chip { background: #fff; border: 1px solid #ecd9a4; border-radius: 20px; padding: 3px 11px; font-size: 12px; color: #6b5310; cursor: pointer; font-weight: 600; }
.gd-chip:hover { background: #fdf3dc; }
.gd-none { font-size: 13px; color: #557050; }

.garden { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
/* 背景色は充実度に応じて inline style で入る（明るいほど情報が埋まっている） */
.plant { position: relative; border: 0; background: none; padding: 8px 2px 6px; cursor: pointer; border-radius: 10px; text-align: center; font-family: inherit; transition: box-shadow .15s; }
.plant:hover { box-shadow: 0 0 0 2px rgba(76,154,63,.35); }
.plant.sel { box-shadow: 0 0 0 2px #4c9a3f; }
.plant-emoji { font-size: 30px; line-height: 1.15; display: block; transition: transform .2s; }
.plant-name { display: block; max-width: 100%; font-size: 11px; color: #3f5c3a; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.plant-soil { display: block; height: 4px; border-radius: 3px; background: #dfe6db; margin: 4px 6px 0; overflow: hidden; }
.plant-soil i { display: block; height: 4px; border-radius: 3px; }
.st-fresh .plant-soil i { background: #4c9a3f; }
.st-ok .plant-soil i { background: #8bbf5c; }
.st-thirsty .plant-soil i { background: #e0a93a; }
.st-wilting .plant-soil i { background: #d97a2a; }
.st-dying .plant-soil i { background: #c0392b; }
.st-thirsty .plant-emoji { transform: rotate(-6deg); }
.st-wilting .plant-emoji { transform: rotate(-14deg); filter: saturate(.55); opacity: .85; }
.st-dying .plant-emoji { transform: rotate(-24deg); filter: saturate(.2) brightness(.9); opacity: .6; }
.plant-drop { position: absolute; top: 4px; left: 50%; margin-left: 11px; font-size: 12px; animation: bob 1.4s ease-in-out infinite; pointer-events: none; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.plant-meet { display: inline-block; margin-top: 4px; font-size: 9.5px; font-weight: 800; padding: 1px 5px; border-radius: 20px; color: #fff; letter-spacing: .01em; white-space: nowrap; }
.plant-meet.nb0 { background: #d63a2f; box-shadow: 0 0 0 2px rgba(214,58,47,.18); }
.plant-meet.nb1 { background: #e0662a; }
.plant-meet.nb3 { background: #e0913a; }
.plant-meet.nb7 { background: #c9a227; }

.gd-meet { background: #eef4fd; border: 1px solid #cfe0f5; border-left: 4px solid #3a72c9; border-radius: 10px; padding: 11px 14px; margin-bottom: 12px; }
.gd-meet-t { font-size: 13px; font-weight: 700; color: #24548f; margin-bottom: 7px; }
.gd-meet-list { display: flex; gap: 6px; flex-wrap: wrap; }
.gd-mchip { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #cfe0f5; border-radius: 20px; padding: 4px 11px 4px 4px; font-size: 12px; color: #24548f; cursor: pointer; font-weight: 600; font-family: inherit; }
.gd-mchip:hover { background: #f2f7fe; }
.gd-mday { flex: 0 0 auto; white-space: nowrap; font-size: 10px; font-weight: 800; color: #fff; padding: 2px 7px; border-radius: 20px; background: #9b9a97; }
.nb0 > .gd-mday { background: #d63a2f; }
.nb1 > .gd-mday { background: #e0662a; }
.nb3 > .gd-mday { background: #e0913a; }
.nb7 > .gd-mday { background: #c9a227; }
.gd-mdate { font-size: 11px; color: #7d93b0; font-weight: 700; }
.gd-mwhat { font-size: 11px; color: #5a6b7d; font-weight: 500; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.gd-cat-legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: 11px; color: #6b8265; }
.gd-cat-legend span { white-space: nowrap; }

.gd-panel { background: #fff; border: 1px solid #dbead3; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
.gd-panel-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 4px; }
.gd-big { font-size: 32px; }
.gd-panel-name { font-weight: 800; font-size: 17px; }
.gd-kind { font-size: 11px; background: #eaf3e5; color: #3f7a33; padding: 2px 9px; border-radius: 20px; font-weight: 700; }
.gd-state { font-size: 12.5px; font-weight: 700; margin-left: auto; }
.gd-state.st-fresh, .gd-state.st-ok { color: #2f6b28; }
.gd-state.st-thirsty { color: #b8860b; }
.gd-state.st-wilting { color: #c9691f; }
.gd-state.st-dying { color: #c0392b; }
.gd-meetline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; font-weight: 600; color: #24548f; background: #eef4fd; border: 1px solid #cfe0f5; border-radius: 8px; padding: 8px 11px; margin-top: 8px; }
.gd-msg { font-size: 13px; color: #4a5947; background: #f4f9f1; border-radius: 8px; padding: 8px 11px; margin: 8px 0; }
.gd-water { background: #2f8fd6; color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
.gd-water:hover { background: #2578b5; }
.gd-water.done { background: #7fae72; }
.gd-undo { background: none; border: 0; color: #8b8a86; font-size: 12px; cursor: pointer; text-decoration: underline; margin-left: 8px; font-family: inherit; }
.gd-log { font-size: 11.5px; color: #8b8a86; margin-top: 6px; }
.gd-editbtn { display: block; margin-top: 10px; background: #fff; border: 1px solid #d7ddd3; border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 600; color: #4a5947; cursor: pointer; font-family: inherit; }
.gd-editbtn:hover { background: #f4f9f1; }
.gd-edit { margin-top: 10px; padding: 12px; border: 1px solid #d9e2f2; border-radius: 9px; background: #f5f9ff; }
.gd-edit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 12px; }
.gd-edit-grid label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; font-weight: 600; color: #6b7a90; }
.gd-edit-grid input, .gd-edit-grid select { padding: 6px 8px; font-size: 13px; border: 1px solid #cfd9e8; border-radius: 6px; background: #fff; font-family: inherit; font-weight: 400; color: #1f1f1f; }
.gd-edit-note { font-size: 11.5px; color: #6b7a90; margin-top: 9px; padding: 6px 9px; background: #e9f1fd; border-radius: 6px; }
.gd-edit-tools { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.gd-save { background: #2f8fd6; color: #fff; border: 0; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }

(function(){
  function b64d(s){var bin=atob(s);var u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
  async function unlock(){
    var pass=document.getElementById("lockpass").value;
    try{
      var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
      var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(ENC.salt),iterations:ENC.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
      var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(ENC.iv)},key,b64d(ENC.ct));
      DATA=JSON.parse(new TextDecoder().decode(pt));
      document.getElementById("lockgate").style.display="none";
      renderEvents(); setView("garden");
    }catch(e){ document.getElementById("lockerr").textContent="パスフレーズが違います"; }
  }
  document.getElementById("lockbtn").addEventListener("click",unlock);
  document.getElementById("lockpass").addEventListener("keydown",function(e){if(e.key==="Enter")unlock();});
})();

function buildInviteText(){
  var blocks = [];
  document.querySelectorAll(".evchk").forEach(function(chk){
    if(!chk.checked) return;
    var e = EVENTS[+chk.dataset.i];
    var head = "■" + e.title + (e.theme ? "（" + e.theme + "）" : "");
    var when = e.d + "(" + e.dow + ") " + e.t + (e.place ? " @" + e.place : "");
    blocks.push(head + "\n" + when + (e.url ? "\n" + e.url : ""));
  });
  return blocks.join("\n\n");
}

function updateInvite(){
  document.getElementById("evText").value = buildInviteText();
  var n = document.querySelectorAll(".evchk:checked").length;
  document.getElementById("evStatus").textContent = n + " 件選択中";
}

function copyInvite(){
  var ta = document.getElementById("evText");
  if(!ta.value){ document.getElementById("evStatus").textContent = "イベントが選択されていません"; return; }
  function done(){ document.getElementById("evStatus").textContent = "コピーしました ✓"; }
  function fallback(){
    ta.removeAttribute("readonly"); ta.focus(); ta.select();
    try { document.execCommand("copy"); done(); } catch(err){ document.getElementById("evStatus").textContent = "コピーできませんでした。テキストを手動で選択してください"; }
    ta.setAttribute("readonly","readonly");
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(done, fallback);
  } else { fallback(); }
}

/* イベントの開催日。EVENTS の d は "M/D"（年なし・"9/22、23" のような複合もある）なので
   先頭の M/D だけ見る。今日より半年以上前になる場合は年をまたいだ翌年の予定とみなす
   （例：12月に見ている 1/5 は来年）。 */
function eventDate(e){
  var m = /^(\d{1,2})\/(\d{1,2})/.exec(String(e.d || ""));
  if(!m) return null;
  var today = new Date(); today.setHours(0,0,0,0);
  var dt = new Date(today.getFullYear(), +m[1]-1, +m[2]);
  dt.setHours(0,0,0,0);
  if((today - dt)/86400000 > 182) dt.setFullYear(dt.getFullYear()+1);
  return dt;
}

/* 過去の開催日は出さない。日付が読めないものは残す（消して気づけないより安全）。 */
function isUpcomingEvent(e){
  var dt = eventDate(e);
  if(!dt) return true;
  var today = new Date(); today.setHours(0,0,0,0);
  return dt >= today;
}

function renderEvents(){
  /* data-i は EVENTS の元インデックス（お誘い用コピーが EVENTS[i] を引くため）。
     絞り込み後の添字を使うと別のイベントをコピーしてしまうので元の i を保持する。 */
  var upcoming = EVENTS.map(function(e, i){ return { e: e, i: i }; })
                       .filter(function(x){ return isUpcomingEvent(x.e); });
  var rows = upcoming.map(function(x){
    var e = x.e, i = x.i;
    var theme = e.theme ? '<span class="ev-theme">' + esc(e.theme) + '</span>' : "";
    var link = e.url ? '<a class="ev-link" href="' + esc(e.url) + '" target="_blank" rel="noopener">' + esc(e.url) + '</a>' : "";
    var sheet = e.sheet ? '<div><a class="ev-sheet" href="' + esc(e.sheet) + '" target="_blank" rel="noopener">📊 集計シートを開く</a></div>' : "";
    return '<div class="ev">'
      + '<input type="checkbox" class="evchk" data-i="' + i + '" checked>'
      + '<div class="ev-date"><div class="ev-d">' + esc(e.d) + '</div><div class="ev-dow">(' + esc(e.dow) + ')</div></div>'
      + '<div class="ev-body">'
      + '<div class="ev-title">' + esc(e.title) + theme + '</div>'
      + '<div class="ev-meta">' + esc(e.t) + (e.place ? ' ・ ' + esc(e.place) : '') + '</div>'
      + link + sheet
      + '</div></div>';
  }).join("");
  document.getElementById("events").innerHTML =
    '<div class="events-box collapsed">'
    + '<div class="events-head"><span class="chev">▶</span><span class="events-title">📅 今後のイベント</span><span class="events-count">' + upcoming.length + ' 件</span></div>'
    + '<div class="events-body">' + rows
    + '<div class="ev-tools">'
    + '<button class="btn" id="evAll">全選択</button>'
    + '<button class="btn" id="evNone">全解除</button>'
    + '<button class="btn btn-primary" id="evCopy">お誘い用をコピー</button>'
    + '<span class="ev-status" id="evStatus"></span>'
    + '</div>'
    + '<textarea class="ev-text" id="evText" readonly></textarea>'
    + '</div></div>';
  document.querySelector(".events-head").addEventListener("click", function(){
    this.parentElement.classList.toggle("collapsed");
  });
  document.querySelectorAll(".evchk").forEach(function(chk){ chk.addEventListener("change", updateInvite); });
  document.getElementById("evAll").addEventListener("click", function(){ document.querySelectorAll(".evchk").forEach(function(c){ c.checked = true; }); updateInvite(); });
  document.getElementById("evNone").addEventListener("click", function(){ document.querySelectorAll(".evchk").forEach(function(c){ c.checked = false; }); updateInvite(); });
  document.getElementById("evCopy").addEventListener("click", copyInvite);
  updateInvite();
}

function hasVal(o, key){ var v = o[key]; return v != null && String(v).trim() !== ""; }

function nutritionOf(o){
  var filled = 0, missing = [];
  NUTRIENT_FIELDS.forEach(function(f){
    if(hasVal(o, f[0])) filled++; else missing.push(f[0]);
  });
  var total = NUTRIENT_FIELDS.length;
  return { filled: filled, total: total, missing: missing, pct: total ? Math.round(filled/total*100) : 100 };
}

function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function parseDate(str){
  if(!str) return null;
  var s = String(str).trim().replace(/[.\-]/g,"/");
  var m = s.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
  if(m){ return new Date(+m[1], +m[2]-1, +m[3]); }
  m = s.match(/(\d{1,2})\/(\d{1,2})/);
  if(m){
    var now = new Date();
    return new Date(now.getFullYear(), +m[1]-1, +m[2]);
  }
  return null;
}

function daysUntil(str){
  var d = parseDate(str);
  if(!d) return null;
  var today = new Date();
  today.setHours(0,0,0,0);
  d.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}

/* 次会う日までの残り日数（当日〜7日前のみ） */
function meetInfo(str){
  var n = daysUntil(str);
  if(n===null || n<0 || n>7) return null;
  var label = (n===0) ? "今日会う" : (n===1 ? "明日" : "あと"+n+"日");
  var cls = (n===0) ? "nb0" : (n===1 ? "nb1" : (n<=3 ? "nb3" : "nb7"));
  return { n:n, label:label, cls:cls };
}

function nextBadge(str){
  var mi = meetInfo(str);
  if(!mi) return "";
  return '<span class="nb '+mi.cls+'">'+mi.label+'</span>';
}

  return '<div class="card">'+top+action+next+memo+detailHTML(o)+'</div>';
}

function checkedCats(){
  var s = {};
  document.querySelectorAll("#catfilter input:checked").forEach(function(c){ s[c.value]=true; });
  return s;
}

function sortByDate(list, key){
  return list.slice().sort(function(a,b){
    var da=daysUntil(a[key]), db=daysUntil(b[key]);
    var va = (da===null)?Infinity:da;
    var vb = (db===null)?Infinity:db;
    return va-vb;
  });
}

function render(){
  renderList();
  if(VIEW === "garden") renderGarden();
}

function renderList(){
  var app = document.getElementById("app");
  var cats = checkedCats();
  var list = DATA.filter(function(o){ return cats[o["カテゴリー"]] && matchSearch(o); });

  if(list.length===0){
    app.innerHTML = '<div class="empty">該当する人がいません</div>';
    updateFoot(0);
    return;
  }

  if(SORT==="action" || SORT==="next"){
    var key = SORT==="action" ? "アクション日" : "次会う日";
    var sorted = sortByDate(list, key);
    app.innerHTML = '<div class="cat"><div class="cat-body">'
      + sorted.map(cardHTML).join("") + '</div></div>';

    var html = "";

      if(!cats[c]) return;
      var group = list.filter(function(o){ return o["カテゴリー"]===c; });
      if(group.length===0) return;

      html += '<div class="cat '+c+'">'
        + '<div class="cat-head">'
        + '<span class="chev">▶</span>'

        + '<span class="cat-title">'+esc(meta.desc||("カテゴリ "+c))+'</span>'

        + '<div class="cat-body">'+group.map(cardHTML).join("")+'</div>'

    });

/* ===================== 人脈ガーデン ===================== */

var PLANT_META = {
  A: { kind:"手のかかる花", cycle:14,  emo:"🌻", wilt:"🥀" },
  B: { kind:"つぼみ",       cycle:30,  emo:"🌷", wilt:"🥀" },
  C: { kind:"季節の花",     cycle:90,  emo:"🌼", wilt:"🥀" },
  D: { kind:"野草",         cycle:120, emo:"🌿", wilt:"🍂" }
};
var VIEW = "garden";
var SELECTED = null;

/* 日次でデータが再生成されても壊れないキー（並び順に依存しない） */
function plantKey(o){
  return [o["名前(あだ名)"]||"", o["カテゴリー"]||"", o["出会った日"]||""].join("|");
}
function todayISO(){
  var d = new Date();
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
}
function isoToDate(s){
  var m = String(s||"").match(/(\d{4})-(\d{2})-(\d{2})/);
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
function daysBetween(a, b){
  a = new Date(a); b = new Date(b);
  a.setHours(0,0,0,0); b.setHours(0,0,0,0);
  return Math.round((b - a) / 86400000);
}

/* 株の状態を計算。
   期日 = アクション日（次に連絡すべき予定日）。
   overdue = 今日 − 期日（プラスなら水切れ＝要連絡） */
function plantState(o){
  var cat = o["カテゴリー"] || "D";
  var meta = PLANT_META[cat] || PLANT_META.D;
  var today = new Date(); today.setHours(0,0,0,0);
  var due = parseDate(o["アクション日"]);
  var basis = "action";
  var overdue = due ? daysBetween(due, today) : 0;
  var grace = Math.ceil(meta.cycle / 3);
  var r = overdue / grace;
  var st, label, msg;
  if(overdue < 0){ st="st-fresh"; label="元気"; msg="いきいきしています。次の水やりは "+fmtDate(due)+" ごろ。"; }
  else if(overdue === 0){ st="st-ok"; label="水やり日"; msg="今日が水やりの日です。"; }
  else if(r <= 1){ st="st-thirsty"; label="のどが渇いた"; msg=overdue+"日 水をもらえていません。そろそろ声をかけて。"; }
  else if(r <= 2){ st="st-wilting"; label="しおれてきた"; msg=overdue+"日 放置ぎみ。葉が垂れてきました。"; }
  else { st="st-dying"; label="枯れかけ"; msg=overdue+"日 も水切れ。今すぐ水やりを。"; }
  /* 土の残り水分（0〜100%） */
  var moist;
  if(overdue < 0) moist = 100;
  else moist = Math.max(0, Math.round(100 - (overdue / (grace*3)) * 100));
  return { cat:cat, meta:meta, st:st, label:label, msg:msg, overdue:overdue, moist:moist,
           due:due, basis:basis, watered:null, thirsty:(overdue > 0) };
}
function fmtDate(d){
  return d ? (d.getMonth()+1)+"/"+d.getDate() : "—";
}
function plantEmoji(s){
  return (s.st==="st-wilting" || s.st==="st-dying") ? s.meta.wilt : s.meta.emo;
}

function gardenList(){
  var cats = checkedCats();
  return DATA.filter(function(o){ return cats[o["カテゴリー"]] && matchSearch(o); });
}

function renderGarden(){
  var list = gardenList();
  var states = list.map(function(o){ return { o:o, s:plantState(o), m:meetInfo(o["次会う日"]), n:nutritionOf(o) }; });

  /* 乾いている株を優先、その中で放置日数が多い順 */
  var thirsty = states.filter(function(x){ return x.s.thirsty; })
                      .sort(function(a,b){ return b.s.overdue - a.s.overdue; });
  var dying = states.filter(function(x){ return x.s.st==="st-dying"; });

  /* 庭の充実度＝各株の栄養%の平均。「あと1項目」の株は埋めに行きやすいので別枠で出す。 */
  var nutPct = states.length
    ? Math.round(states.reduce(function(a, x){ return a + x.n.pct; }, 0) / states.length) : 100;
  var almostList = states.filter(function(x){ return x.n.missing.length === 1; });

  var stats = document.getElementById("gdstats");
  stats.innerHTML =
      '<div class="gd-stat"><b>' + states.length + '</b>庭の株</div>'
    + '<div class="gd-stat"><b>' + (states.length - thirsty.length) + '</b>元気</div>'
    + '<div class="gd-stat thirsty"><b>' + thirsty.length + '</b>水やり待ち</div>'
    + '<div class="gd-stat warn"><b>' + dying.length + '</b>枯れかけ</div>'
    + '<div class="gd-stat nut"><b>' + nutPct + '%</b>庭の充実度</div>'
    + (almostList.length ? '<div class="gd-stat last"><b>' + almostList.length + '</b>あと1項目</div>' : "");

  /* 1週間以内に会う予定（当日〜7日前） */
  var meets = states.filter(function(x){ return x.m; })
                    .sort(function(a,b){ return a.m.n - b.m.n; });
  var meetBox = document.getElementById("gdmeet");
  if(meets.length){
    meetBox.innerHTML = '<div class="gd-meet">'
      + '<div class="gd-meet-t">📅 まもなく会う人（1週間以内 ' + meets.length + '人）</div>'
      + '<div class="gd-meet-list">'
      + meets.map(function(x){
          return '<button class="gd-mchip ' + x.m.cls + '" data-k="' + esc(plantKey(x.o)) + '">'
               + '<span class="gd-mday">' + esc(x.m.label) + '</span>'
               + esc(x.o["名前(あだ名)"]||"(名前なし)")
               + '<span class="gd-mdate">' + esc(x.o["次会う日"]) + '</span>'
               + (x.o["次会う日にする事"] ? '<span class="gd-mwhat">' + esc(x.o["次会う日にする事"]) + '</span>' : "")
               + '</button>';
        }).join("")
      + '</div></div>';
  } else {
    meetBox.innerHTML = "";
  }

  var call = document.getElementById("gdcall");
  if(thirsty.length){
    call.innerHTML = '<div class="gd-call">'
      + '<div class="gd-call-t">💧 「水をちょうだい」と言っています（' + thirsty.length + '株）</div>'
      + '<div class="gd-call-list">'
      + thirsty.slice(0,12).map(function(x){
          return '<button class="gd-chip" data-k="' + esc(plantKey(x.o)) + '">'
               + plantEmoji(x.s) + ' ' + esc(x.o["名前(あだ名)"]||"(名前なし)")
               + ' <span style="opacity:.65">' + x.s.overdue + '日</span></button>';
        }).join("")
      + (thirsty.length > 12 ? '<span class="gd-none">ほか ' + (thirsty.length-12) + '株</span>' : "")
      + '</div></div>';
  } else {
    call.innerHTML = '<div class="gd-call"><div class="gd-none">🎉 いま水やり待ちの株はありません。庭はいい状態です。</div></div>';
  }

  /* 庭の並び：
     1) 水やり待ちを手前に（放置日数の多い順）
     2) 元気な株はカテゴリ順 A→B→C→D、同カテゴリ内は次の期日が近い順 */
  var ordered = states.slice().sort(function(a,b){
    if(a.s.thirsty !== b.s.thirsty) return a.s.thirsty ? -1 : 1;
    if(a.s.thirsty) return b.s.overdue - a.s.overdue;
    var ca = CATS.indexOf(a.s.cat), cb = CATS.indexOf(b.s.cat);
    if(ca !== cb) return ca - cb;
    return b.s.overdue - a.s.overdue;
  });
  document.getElementById("garden").innerHTML = ordered.map(function(x){
    var k = plantKey(x.o);
    /* 充実度が高いほど背景を明るく（＝日の当たる肥えた土）。
       0%は背景なし、100%で白に近づける。彩度は少し残して土の温かみを保つ。 */
    var lum = 0.10 + (x.n.pct / 100) * 0.80;
    return '<button class="plant ' + x.s.st + (SELECTED===k ? ' sel' : '') + '" data-k="' + esc(k) + '" '
      + 'style="background: rgba(255,252,242,' + lum.toFixed(2) + ')" '
      + 'title="' + esc((x.o["名前(あだ名)"]||"") + " / " + x.s.label + " / 充実度 " + x.n.pct + "%") + '">'
      + (x.s.thirsty ? '<span class="plant-drop">💧</span>' : "")
      + '<span class="plant-emoji">' + plantEmoji(x.s) + '</span>'
      + '<span class="plant-name">' + esc(x.o["名前(あだ名)"]||"(名前なし)") + '</span>'
      + '<span class="plant-soil"><i style="width:' + x.s.moist + '%"></i></span>'
      + (x.n.missing.length === 1 ? '<span class="plant-last">あと1</span>' : "")
      + (x.m ? '<span class="plant-meet ' + x.m.cls + '">📅' + esc(x.m.label) + '</span>' : "")
      + '</button>';
  }).join("") || '<div class="gd-none">該当する株がありません</div>';

  document.querySelectorAll(".plant, .gd-chip, .gd-mchip").forEach(function(el){
    el.addEventListener("click", function(){
      SELECTED = this.getAttribute("data-k");
      renderGarden();
      var p = document.getElementById("gdpanel");
      if(p && p.scrollIntoView) p.scrollIntoView({ block:"nearest" });
    });
  });

  renderPanel();
  updateFoot(states.length);
}

/* --- 日付ピッカー用の変換 ---
   シートは "7/20"（年省略）や "2026/05/23" 形式、<input type="date"> は "YYYY-MM-DD" 固定。
   保存時はシートの書式に合わせて戻す（今年なら M/D、他の年は YYYY/M/D）。 */
function toISO(str){
  var d = parseDate(str);
  if(!d) return "";
  var p = function(n){ return (n < 10 ? "0" : "") + n; };
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function fromISO(iso){
  if(!iso) return "";
  var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return String(iso).trim();
  var y = +m[1], mo = +m[2], da = +m[3];
  return (y === new Date().getFullYear()) ? (mo + "/" + da) : (y + "/" + mo + "/" + da);
}
// 日付として読めない値をピッカーに載せると消えてしまうので、その場合だけテキスト入力にする
function dateInputHTML(id, val){
  var iso = toISO(val);
  if(!val || iso) return '<input id="' + id + '" type="date" value="' + esc(iso) + '">';
  return '<input id="' + id + '" type="text" value="' + esc(val) + '">';
}
function readDateInput(id){
  var el = document.getElementById(id);
  if(!el) return "";
  return (el.type === "date") ? fromISO(el.value) : el.value.trim();
}

function panelEditorHTML(o){
  var opts = ACTION_OPTIONS.map(function(x){
    return '<option value="' + esc(x) + '"' + (((o["アクション内容"]||"") === x) ? " selected" : "") + '>' + (x ? esc(x) : "（なし）") + '</option>';
  }).join("");
  var cur = [o["次会う日"]||"", o["次会う日にする事"]||""].filter(Boolean).join(" ") || "なし";
  return '<div class="gd-edit">'
    + '<div class="gd-edit-grid">'
    + '<label>アクション日' + dateInputHTML("ge-ad", o["アクション日"]||"") + '</label>'
    + '<label>アクション内容<select id="ge-ac">' + opts + '</select></label>'
    + '<label>次会う日' + dateInputHTML("ge-nd", o["次会う日"]||"") + '</label>'
    + '<label>次会う日にする事<input id="ge-nw" type="text" value="' + esc(o["次会う日にする事"]||"") + '" placeholder="例: サシ"></label>'
    + '</div>'
    + '<div class="gd-edit-note">※「次会う日」を変えたときだけ、いまの予定（' + esc(cur) + '）が履歴に追記されます（する事だけの修正では追記しません）。</div>'
    + '<div class="gd-edit-tools">'
    + '<button class="gd-save" id="ge-save">保存</button>'
    + '<button class="gd-cancel" id="ge-cancel">キャンセル</button>'
    + '<span class="gd-edit-msg" id="ge-msg"></span>'
    + '</div></div>';
}

function saveEdit(o){
  var msg = document.getElementById("ge-msg");
  var token = getWriteToken() || askWriteToken();
  if(!token){ msg.textContent = "合言葉が必要です"; msg.className = "gd-edit-msg err"; return; }
  var values = {
    "アクション日": readDateInput("ge-ad"),
    "アクション内容": document.getElementById("ge-ac").value,
    "次会う日": readDateInput("ge-nd"),
    "次会う日にする事": document.getElementById("ge-nw").value.trim()
  };
  msg.textContent = "保存中…"; msg.className = "gd-edit-msg";
  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ token: token, row: o._row, name: o["名前(あだ名)"], values: values })
  })
  .then(function(res){ return res.json(); })
  .then(function(j){
    if(!j.ok){
      if(String(j.error||"").indexOf("unauthorized") >= 0){
        setWriteToken(""); // 違う合言葉は覚えさせない
        throw new Error("合言葉が違います。保存をもう一度押して入れ直してください");
      }
      throw new Error(j.message || j.error || "unknown");
    }
    // サーバーが返した更新後の値を反映（履歴への自動追記を含む）
    var applied = j.updated || values;
    Object.keys(applied).forEach(function(k){ if(applied[k]) o[k] = applied[k]; else delete o[k]; });
    PANEL_EDIT = false;
    renderGarden();
  })
  .catch(function(err){
    var m = document.getElementById("ge-msg");
    if(m){ m.textContent = "保存に失敗：" + (err.message || err); m.className = "gd-edit-msg err"; }
  });
}

/* プロフィール編集フォーム（13項目まとめて）。保存ボタンは1つで、変更した項目だけ一括送信する。 */
function profEditorHTML(o){
  var rows = PROFILE_FIELDS.map(function(f, i){
    var key = f[0], label = f[1];
    var cur = o[key] == null ? "" : String(o[key]);
    var input = DATE_FIELDS[key]
      ? dateInputHTML("pe-" + i, cur)
      : '<input id="pe-' + i + '" type="text" value="' + esc(cur) + '">';
    return '<label' + (hasVal(o, key) ? '' : ' class="pe-empty"') + '><span>' + esc(label) + '</span>' + input + '</label>';
  }).join("");
  return '<div class="gd-prof">'
    + '<div class="gd-prof-grid">' + rows + '</div>'
    + '<div class="gd-prof-tools">'
    + '<button class="gd-save" id="pe-save">まとめて保存</button>'
    + '<button class="gd-cancel" id="pe-cancel">キャンセル</button>'
    + '<span class="gd-edit-msg" id="pe-msg"></span>'
    + '</div></div>';
}

function saveProfile(o){
  var msg = document.getElementById("pe-msg");
  function fail(t){ var m = document.getElementById("pe-msg"); if(m){ m.textContent = t; m.className = "gd-edit-msg err"; } }
  var token = getWriteToken() || askWriteToken();
  if(!token){ fail("合言葉が必要です"); return; }

  // 変更のあった項目だけ集める（空にした場合も "" を送ってクリア）
  var values = {};
  PROFILE_FIELDS.forEach(function(f, i){
    var key = f[0];
    var el = document.getElementById("pe-" + i);
    if(!el) return;
    var nv = (el.type === "date") ? fromISO(el.value) : el.value.trim();
    var cv = o[key] == null ? "" : String(o[key]).trim();
    if(nv !== cv) values[key] = nv;
  });
  var changed = Object.keys(values);
  if(!changed.length){ if(msg){ msg.textContent = "変更はありません"; msg.className = "gd-edit-msg"; } return; }

  if(msg){ msg.textContent = "保存中…（" + changed.length + "項目）"; msg.className = "gd-edit-msg"; }
  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ token: token, row: o._row, name: o["名前(あだ名)"], values: values })
  })
  .then(function(r){ return r.json(); })
  .then(function(j){
    if(!j.ok){
      if(String(j.error||"").indexOf("unauthorized") >= 0){ setWriteToken(""); throw new Error("合言葉が違います。保存を押して入れ直してください"); }
      throw new Error(j.message || j.error || "unknown");
    }
    var applied = j.updated || values;
    Object.keys(applied).forEach(function(k){ if(applied[k]) o[k] = applied[k]; else delete o[k]; });
    PROF_EDIT = false;
    renderGarden();
  })
  .catch(function(err){ fail("失敗：" + (err.message || err)); });
}

      })()

          + '<span class="gd-nut-bar"><i style="width:' + n.pct + '%"></i></span>'
          + '<span class="gd-nut-p">' + n.pct + '%</span>'

          + '</div>';
      })()
    + (canEdit(o) ? '<div class="gd-editrow">'
        + (PANEL_EDIT ? panelEditorHTML(o) : '<button class="gd-editbtn" id="ge-open">✏️ 予定を編集</button>')
        + (PROF_EDIT ? profEditorHTML(o) : '<button class="gd-editbtn" id="pe-open">📝 プロフィールを編集</button>')
        + '</div>' : "")
    + cardHTML(o)
    + '</div>';

  var peO = document.getElementById("pe-open");
  if(peO) peO.addEventListener("click", function(){ PROF_EDIT = true; PANEL_EDIT = false; renderGarden(); });
  var peC = document.getElementById("pe-cancel");
  if(peC) peC.addEventListener("click", function(){ PROF_EDIT = false; renderGarden(); });
  var peS = document.getElementById("pe-save");
  if(peS) peS.addEventListener("click", function(){ saveProfile(o); });

  var eo = document.getElementById("ge-open");
  if(eo) eo.addEventListener("click", function(){ PANEL_EDIT = true; PROF_EDIT = false; renderGarden(); });
  var ec = document.getElementById("ge-cancel");
  if(ec) ec.addEventListener("click", function(){ PANEL_EDIT = false; renderGarden(); });
  var es = document.getElementById("ge-save");
  if(es) es.addEventListener("click", function(){ saveEdit(o); });
}

function setView(v){
  VIEW = v;
  document.body.className = "view-" + v;
  document.querySelectorAll(".tab").forEach(function(t){
    t.classList.toggle("active", t.getAttribute("data-view") === v);
  });
  document.getElementById("sort").style.display = (v==="list") ? "" : "none";
  if(v === "calendar") loadCalendar();
  render();
}

/* カレンダーは開いたときに初めて読み込む（遅延ロード） */
function loadCalendar(){
  var f = document.getElementById("calframe");
  if(f && !f.src && CALENDAR_EMBED_URL) f.src = CALENDAR_EMBED_URL;
  renderSlots();
}

/* 空いてる1.5h枠を日付ごとにまとめて描画。 */
function renderSlots(){
  var box = document.getElementById("slots");
  if(!box) return;
  if(!(typeof FREE_SLOTS !== "undefined") || !FREE_SLOTS || !FREE_SLOTS.length){
    box.innerHTML = '<div class="slots-empty">空き枠は毎朝のビルド時にカレンダーから計算されます。</div>';
    return;
  }
  var groups = [], last = null;
  FREE_SLOTS.forEach(function(s){
    if(!last || last.d !== s.d){ last = { d:s.d, dow:s.dow, items:[] }; groups.push(last); }
    last.items.push(s.t);
  });
  var html = '<div class="slots-head">'
    + '<span class="slots-title">🕒 空いてる1.5h枠（1ヶ月先まで）</span>'
    + '<button class="slots-copy" id="slots-copy">📋 一覧をコピー</button>'
    + '</div>'
    + '<div class="slots-note">平日＝昼 12:00-13:30 ／ 夜 18:00以降　土日＝8:00以降　※各1.5時間・毎朝更新</div>';
  html += groups.map(function(g){
    return '<div class="slot-day"><div class="slot-date">' + esc(g.d) + '(' + esc(g.dow) + ')</div>'
      + '<div class="slot-chips">' + g.items.map(function(t){ return '<span class="slot-chip">' + esc(t) + '</span>'; }).join("") + '</div></div>';
  }).join("");
  box.innerHTML = html;
  var cp = document.getElementById("slots-copy");
  if(cp) cp.addEventListener("click", function(){
    var txt = groups.map(function(g){
      return g.d + "(" + g.dow + ")\n" + g.items.map(function(t){ return "・" + t; }).join("\n");
    }).join("\n\n");
    navigator.clipboard.writeText(txt).then(function(){
      cp.textContent = "✅ コピーしました"; setTimeout(function(){ cp.textContent = "📋 一覧をコピー"; }, 1500);
    });
  });
}
/* カレンダーURLが未設定ならタブを隠す */
if(!CALENDAR_EMBED_URL){ var _ct = document.getElementById("tab-cal"); if(_ct) _ct.style.display = "none"; }

document.querySelectorAll(".tab").forEach(function(t){
  t.addEventListener("click", function(){ setView(this.getAttribute("data-view")); });
});

document.getElementById("search").addEventListener("input", function(){
  SEARCH = this.value.trim().toLowerCase(); render();
});
document.getElementById("sort").addEventListener("change", function(){
  SORT = this.value; render();
});
document.querySelectorAll("#catfilter input").forEach(function(c){
  c.addEventListener("change", render);
});

/* 描画は復号後に行う */
</script>
