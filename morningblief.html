<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:0 0 40px;background:#f4f6fa;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;color:#1f2733;line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}
header{background:linear-gradient(135deg,#4b3ba8 0%,#7a3ba8 50%,#c0397a 100%);color:#fff;padding:26px 20px 22px;border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(75,59,168,.28)}
header .date{font-size:13px;opacity:.9;letter-spacing:.08em}
header h1{margin:4px 0 14px;font-size:23px;font-weight:700}
.hpbox{background:rgba(255,255,255,.14);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.hprow{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.hpbar{flex:1;height:14px;background:rgba(0,0,0,.28);border-radius:8px;overflow:hidden}
.hpfill{height:100%;width:0;border-radius:8px;transition:width .4s ease,background .4s ease}
.hpfill.ok{background:linear-gradient(90deg,#37d67a,#0fa958)}
.hpfill.warn{background:linear-gradient(90deg,#ffd24d,#f0a30a)}
.hpfill.bad{background:linear-gradient(90deg,#ff7b7b,#e02424)}
.hpcalc{font-size:11px;opacity:.85;margin-top:6px}
.quote{background:rgba(255,255,255,.16);border-left:4px solid rgba(255,255,255,.75);border-radius:8px;padding:11px 14px;font-size:14px}
.quote .src{display:block;margin-top:6px;font-size:12px;opacity:.85;text-align:right}
.card{background:#fff;border-radius:16px;padding:18px 18px 14px;margin:16px 0;box-shadow:0 2px 10px rgba(31,39,51,.07)}
.card h2{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:7px}
.card.boss{background:#2a0d12;color:#ffd9d9}
.card.self{border-top:5px solid #e02424}
.card.mem{border-top:5px solid #f08a0a}
.card.today{border-top:5px solid #d4b106}
.card.soon{border-top:5px solid #1890ff}
.card.other{border-top:5px solid #8c8c8c}
.card.advice{border-top:5px solid #52c41a}
.card.src{border-top:5px solid #722ed1}
ul.tl{list-style:none;margin:0;padding:0}
ul.tl li{display:flex;align-items:flex-start;gap:6px;padding:8px 0;border-bottom:1px dashed #e6e9f0}
ul.tl li:last-child{border-bottom:none}
label{display:flex;align-items:flex-start;gap:8px;flex:1;cursor:pointer}
label input{margin-top:5px;width:17px;height:17px;flex:none;accent-color:#4b3ba8}
.memo{font-size:24px;width:30px;text-align:center;flex:none;line-height:1.2}
.mtxt{flex:1;font-size:14px}
label.done .mtxt{text-decoration:line-through;opacity:.45}
label.done .memo{filter:grayscale(1);opacity:.35}
.lv{display:inline-block;background:#e02424;color:#fff;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.over{color:#c00;font-weight:700}
.who{font-size:12px;color:#f08a0a;font-weight:700}
.nlink{font-size:12px;color:#4b3ba8;text-decoration:none;white-space:nowrap;padding-top:9px}
.nlink:hover{text-decoration:underline}
.pri{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 7px;margin-right:6px;color:#fff}
.p1{background:#e02424}.p2{background:#e0a800;color:#3a2c00}.p3{background:#52c41a}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid #eceff5;padding:7px 6px;text-align:left;vertical-align:top}
th{background:#f7f8fc;font-size:12px;color:#5a6478}
.sub{font-size:12px;color:#6b7385;margin:10px 0 4px;font-weight:700}
#prog{font-size:13px;color:#4b3ba8;font-weight:700;margin-top:8px}
.bossemo{font-size:30px}
a{color:#4b3ba8}
.card.src li{font-size:13px;padding:4px 0;border:none}

#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#4b3ba8,#c0397a);display:flex;align-items:center;justify-content:center;z-index:99}
#lockgate .box{background:#fff;border-radius:16px;padding:28px 24px;width:88%;max-width:340px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#lockgate h2{margin:0 0 6px;font-size:19px}
#lockgate p{margin:0 0 16px;font-size:13px;color:#6b7385}
#lockgate input{width:100%;padding:11px;font-size:16px;border:1px solid #d3d8e3;border-radius:9px;margin-bottom:12px}
#lockgate button{width:100%;padding:11px;font-size:15px;font-weight:700;border:none;border-radius:9px;background:#4b3ba8;color:#fff;cursor:pointer}
#lockgate button:disabled{opacity:.6}
#err{color:#e02424;font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>

const SKEY='brief-2026-08-23';
function b64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){return {}}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s))}catch(e){}}
function refresh(){
  const boxes=[...document.querySelectorAll('#content input[type=checkbox]')];
  let hp=100,rem=0;
  boxes.forEach(b=>{
    const id=b.dataset.id||'';
    if(!b.checked){
      if(id.startsWith('self-'))hp-=10;
      else if(id.startsWith('mem-'))hp-=5;
      rem++;
    }
  });
  hp=Math.max(0,Math.min(100,hp));
  const f=document.getElementById('hpfill'),v=document.getElementById('hpval');
  if(f){f.style.width=hp+'%';f.className='hpfill '+(hp>=80?'ok':hp>=50?'warn':'bad');}
  if(v)v.textContent=hp;
  const p=document.getElementById('prog');
  if(p)p.textContent=rem===0?'🎉 全部やりきった！':('残り '+rem+' 件');
}
function wire(){
  const st=loadState();
  document.querySelectorAll('#content input[type=checkbox]').forEach(b=>{
    const id=b.dataset.id;
    if(st[id]){b.checked=true;b.closest('label').classList.add('done');}
    b.addEventListener('change',()=>{
      b.closest('label').classList.toggle('done',b.checked);
      const s=loadState();if(b.checked)s[id]=1;else delete s[id];saveState(s);
      refresh();
    });
  });
  refresh();
}
async function open(){
  const btn=document.getElementById('go'),err=document.getElementById('err');
  err.textContent='';btn.disabled=true;btn.textContent='復号中...';
  try{
    const pw=document.getElementById('pw').value;
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},k,b64(ENC.ct));
    document.getElementById('content').innerHTML=new TextDecoder().decode(pt);
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){
    err.textContent='パスフレーズが違います';btn.disabled=false;btn.textContent='開く';
  }
}
document.getElementById('go').addEventListener('click',open);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')open();});
