<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🔒 朝ブリーフ</title><style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#20242c;--sub:#5b6472;--line:#e6e9f0;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.header{background:linear-gradient(135deg,#4f6ef7,#7a4ff7 55%,#b44ff7);color:#fff;border-radius:20px;padding:22px 22px 20px;box-shadow:0 8px 24px rgba(80,70,200,.25)}
.hdate{font-size:14px;opacity:.9}
.header h1{margin:4px 0 14px;font-size:24px}
.hplabel{font-size:12px;opacity:.9;margin-bottom:4px}
#hpbar{height:16px;background:rgba(255,255,255,.3);border-radius:10px;overflow:hidden}
#hpfill{height:100%;width:0;border-radius:10px;transition:width .5s,background .5s}
#hpfill.ok{background:#3ddc84}#hpfill.warn{background:#ffcf3f}#hpfill.bad{background:#ff5a5a}
#hpval{font-size:13px;font-weight:700;margin-top:5px}
.hpnote{font-size:11px;opacity:.85;margin-top:2px}
.quote{margin-top:14px;font-size:15px;background:rgba(255,255,255,.14);padding:10px 12px;border-radius:12px}
.quote .qs{display:block;font-size:12px;opacity:.85;margin-top:4px;text-align:right}
.card{background:var(--card);border-radius:16px;padding:16px 18px;margin:14px 0;box-shadow:0 2px 10px rgba(30,40,80,.06)}
.card h2{margin:0 0 10px;font-size:18px}
.card.alert{border:1px solid #ffd9d9}
.card.boss{background:#2a1015;color:#ffdede;border:1px solid #7a1f28}
.subhead{font-weight:700;font-size:14px;margin:12px 0 6px;padding:5px 10px;border-radius:8px}
.redhead{background:#ffe6e6;color:#c62828}
.orangehead{background:#fff0e0;color:#e0730a}
ul.checklist{list-style:none;margin:0;padding:0}
ul.checklist li{display:flex;align-items:flex-start;gap:6px;padding:7px 0;border-bottom:1px solid var(--line)}
ul.checklist li label{flex:1;display:flex;align-items:flex-start;gap:7px;cursor:pointer}
ul.checklist li label.done .mtxt{text-decoration:line-through;opacity:.5}
ul.checklist li label.done .memo{filter:grayscale(1);opacity:.35}
.memo{font-size:24px;width:30px;text-align:center;line-height:1.1}
.lv{font-size:12px;font-weight:700;background:#333;color:#fff;border-radius:6px;padding:1px 6px;align-self:center;white-space:nowrap}
.mtxt{align-self:center}
.mtxt b{color:#d32f2f}
.nlink{font-size:12px;color:#4f6ef7;text-decoration:none;white-space:nowrap;align-self:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--sub);font-size:12px}
.pri{font-weight:700;white-space:nowrap}
.p1{color:#d32f2f}.p2{color:#e0a80a}.p3{color:#2e9e4f}
.todoli{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.todoli label{flex:1;display:flex;gap:8px;cursor:pointer}
.todoli label.done{text-decoration:line-through;opacity:.5}
.muted{color:var(--sub);font-size:13px}
.tag{display:inline-block;font-size:11px;background:#eef1f8;color:#5b6472;border-radius:6px;padding:1px 6px;margin-left:4px}
#prog{font-weight:700;margin-top:8px;color:#4f6ef7}
a.src{color:#4f6ef7;font-size:13px;display:block;padding:3px 0;word-break:break-all}
.none{color:#2e9e4f;font-size:14px;padding:4px 0}
#lockgate{position:fixed;inset:0;background:#20242c;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:99}
#lockgate .box{background:#fff;padding:26px 24px;border-radius:16px;text-align:center;max-width:320px}
#lockgate h3{margin:0 0 10px}
#lockgate input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px}
#lockgate button{margin-top:10px;width:100%;padding:10px;border:0;border-radius:8px;background:#4f6ef7;color:#fff;font-size:15px;cursor:pointer}
#lockerr{color:#d32f2f;font-size:13px;min-height:16px}
</style></head><body>
<div id="content"></div>

const SKEY='brief-2026-07-31';
function b2a(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0));}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}');}catch(e){return {};}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s));}catch(e){}}
function refresh(){
  let hp=100;const st=loadState();
  document.querySelectorAll('input[data-id]').forEach(i=>{
    const id=i.getAttribute('data-id');
    if(i.checked){const lab=i.closest('label');if(lab)lab.classList.add('done');}
    else{const lab=i.closest('label');if(lab)lab.classList.remove('done');
      if(id.indexOf('self-')===0)hp-=10;else if(id.indexOf('mem-')===0)hp-=5;}
  });
  if(hp<0)hp=0;if(hp>100)hp=100;
  const f=document.getElementById('hpfill');const v=document.getElementById('hpval');
  if(f){f.style.width=hp+'%';f.className=hp>=80?'ok':(hp>=50?'warn':'bad');}
  if(v)v.textContent='HP '+hp+' / 100';
  const total=document.querySelectorAll('.todoli input[data-id],ul.checklist input[data-id]').length;
  let done=0;document.querySelectorAll('.todoli input[data-id],ul.checklist input[data-id]').forEach(i=>{if(i.checked)done++;});
  const p=document.getElementById('prog');
  const rem=total-done;
  if(p)p.textContent=rem===0?'全部やりきった！ 🎉':('残り '+rem+' 件');
}
function wire(){
  const st=loadState();
  document.querySelectorAll('input[data-id]').forEach(i=>{
    const id=i.getAttribute('data-id');
    if(st[id])i.checked=true;
    i.addEventListener('change',()=>{const s=loadState();s[id]=i.checked;saveState(s);refresh();});
  });
  const foot=document.createElement('div');foot.id='prog';
  const last=document.querySelector('.wrap');if(last)last.appendChild(foot);
  refresh();
}
async function unlock(){
  const pw=document.getElementById('pw').value;
  const err=document.getElementById('lockerr');err.textContent='';
  try{
    const enc=new TextEncoder();
    const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(ENC.iv)},key,b2a(ENC.ct));
    const html=new TextDecoder().decode(pt);
    document.getElementById('content').innerHTML=html;
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){err.textContent='パスフレーズが違います';}
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('unlockbtn').addEventListener('click',unlock);
  document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
});
</script>
