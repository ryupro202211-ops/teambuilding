<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
:root{--ok:#22c55e;--warn:#eab308;--bad:#ef4444;}
*{box-sizing:border-box}
body{margin:0;background:#0f172a;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:#1e293b;}
.header{background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);color:#fff;padding:22px 18px 26px;border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(0,0,0,.3);}
.header .date{font-size:13px;opacity:.9;}
.header h1{margin:4px 0 14px;font-size:22px;}
.hpbox{background:rgba(255,255,255,.18);border-radius:14px;padding:12px 14px;}
.hprow{display:flex;align-items:center;gap:10px;}
.hprow .hplabel{font-size:13px;font-weight:700;}
.hpbar{flex:1;height:16px;background:rgba(0,0,0,.25);border-radius:10px;overflow:hidden;}
.hpfill{height:100%;width:70%;border-radius:10px;transition:width .5s,background .5s;}
.hpfill.ok{background:var(--ok)}.hpfill.warn{background:var(--warn)}.hpfill.bad{background:var(--bad)}
#hpval{font-weight:800;font-size:15px;min-width:56px;text-align:right;}
.hpbreak{font-size:11px;opacity:.9;margin-top:6px;}
#prog{font-size:12px;opacity:.95;margin-top:4px;font-weight:700;}
.quote{margin:14px 2px 0;font-size:14px;line-height:1.6;font-style:italic;border-left:3px solid rgba(255,255,255,.6);padding-left:10px;}
.quote .src{display:block;font-style:normal;font-size:12px;opacity:.85;margin-top:4px;}
.wrap{max-width:720px;margin:0 auto;padding:14px 12px 40px;}
.card{background:#fff;border-radius:16px;padding:14px 16px;margin:12px 0;box-shadow:0 3px 10px rgba(0,0,0,.15);}
.card h2{margin:0 0 10px;font-size:16px;}
.alert.self{border-left:6px solid var(--bad);}
.alert.mem{border-left:6px solid #f97316;}
.card.boss{background:#3b0d0d;color:#fff;border-left:6px solid #ef4444;}
ul.tl{list-style:none;margin:0;padding:0;}
ul.tl li{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid #f1f5f9;}
ul.tl li label{flex:1;display:flex;align-items:center;gap:8px;cursor:pointer;}
ul.tl li input{width:18px;height:18px;flex:none;}
.memo{font-size:24px;width:30px;text-align:center;flex:none;}
.lv{font-size:12px;font-weight:800;background:#1e293b;color:#fff;border-radius:8px;padding:2px 6px;flex:none;}
.pri{font-size:16px;flex:none;}
.mtxt{font-size:14px;line-height:1.45;}
.od{color:var(--bad);font-weight:800;}
label.done .mtxt{text-decoration:line-through;opacity:.5;}
label.done .memo{filter:grayscale(1);opacity:.35;}
.nlink{font-size:12px;color:#6366f1;text-decoration:none;font-weight:700;flex:none;white-space:nowrap;}
ul.plain{margin:0;padding-left:18px;}
ul.plain li{padding:4px 0;font-size:14px;line-height:1.5;}
.comment p{font-size:14px;line-height:1.7;margin:0;}
.src li{font-size:12px;color:#475569;word-break:break-all;}
#lockgate{position:fixed;inset:0;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:99;padding:20px;}
#lockgate h2{color:#fff;font-size:20px;margin:0;}
#lockgate input{font-size:16px;padding:10px 14px;border-radius:10px;border:none;width:min(280px,80vw);}
#lockgate button{font-size:16px;padding:10px 26px;border-radius:10px;border:none;background:#8b5cf6;color:#fff;font-weight:700;cursor:pointer;}
#lockerr{color:#fca5a5;font-size:13px;min-height:18px;}
</style>
</head>
<body>
<div id="lockgate">
  <h2>🔒 朝ブリーフ</h2>
  <input id="pw" type="password" placeholder="パスフレーズ" autocomplete="off">
  <button id="openbtn">開く</button>
  <div id="lockerr"></div>
</div>

<div id="page" style="display:none">
  <div class="header">
    <div class="date">2026年8月7日（金）</div>
    <h1>🌅 りゅうちゃんの朝ブリーフ</h1>
    <div class="hpbox">
      <div class="hprow">
        <span class="hplabel">❤️ HP</span>
        <div class="hpbar"><div id="hpfill" class="hpfill warn" style="width:70%"></div></div>
        <span id="hpval">70/100</span>
      </div>
      <div class="hpbreak">自分の期限切れ 1件 ×-10 ／ メンバー切れ 4件 ×-5 ／ 毎朝100にリセット</div>
      <div id="prog">残り 5 件</div>
    </div>
    <div class="quote">できると思えばできる。できないと思えばできない。これは、ゆるぎない絶対的な法則である。
      <span class="src">— 中村天風</span>
    </div>
  </div>
  <div id="content"></div>
</div>

const SKEY='brief-2026-08-07';
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function decrypt(pass){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
  return new TextDecoder().decode(pt);
}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){return {}}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s))}catch(e){}}
function refresh(){
  const boxes=[...document.querySelectorAll('#content input[type=checkbox]')];
  let hp=100,remain=0;
  boxes.forEach(b=>{
    const id=b.dataset.id;
    if(!b.checked){remain++;
      if(id.startsWith('self-'))hp-=10;
      else if(id.startsWith('mem-'))hp-=5;
    }
    const lab=b.closest('label'); if(lab)lab.classList.toggle('done',b.checked);
  });
  if(hp<0)hp=0; if(hp>100)hp=100;
  const f=document.getElementById('hpfill');
  f.style.width=hp+'%';
  f.className='hpfill '+(hp>=80?'ok':hp>=50?'warn':'bad');
  document.getElementById('hpval').textContent=hp+'/100';
  document.getElementById('prog').textContent=remain===0?'全部やりきった！🎉':('残り '+remain+' 件');
}
function wire(){
  const st=loadState();
  document.querySelectorAll('#content input[type=checkbox]').forEach(b=>{
    if(st[b.dataset.id])b.checked=true;
    b.addEventListener('change',()=>{
      const s=loadState(); s[b.dataset.id]=b.checked; saveState(s); refresh();
    });
  });
  refresh();
}
async function openBrief(){
  const pass=document.getElementById('pw').value;
  try{
    const htmlTxt=await decrypt(pass);
    document.getElementById('content').innerHTML=htmlTxt;
    document.getElementById('lockgate').style.display='none';
    document.getElementById('page').style.display='block';
    wire();
  }catch(e){
    document.getElementById('lockerr').textContent='パスフレーズが違います';
  }
}
document.getElementById('openbtn').addEventListener('click',openBrief);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')openBrief();});
</script>
