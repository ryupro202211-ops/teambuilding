<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:0 0 40px;background:#f4f6fa;
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",YuGothic,Meiryo,sans-serif;
  color:#1f2430;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}
header{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 50%,#db2777 100%);
  color:#fff;padding:26px 18px 24px;margin-bottom:18px;border-radius:0 0 22px 22px;
  box-shadow:0 6px 22px rgba(79,70,229,.28)}
header .inner{max-width:820px;margin:0 auto}
.date{font-size:13px;opacity:.9;letter-spacing:.06em}
h1{margin:2px 0 14px;font-size:24px;font-weight:800;letter-spacing:.02em}
.hpbox{background:rgba(255,255,255,.16);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.hprow{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.hplabel{font-size:12px;font-weight:700;letter-spacing:.1em;opacity:.95}
.hpnum{margin-left:auto;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.hpbar{height:14px;border-radius:8px;background:rgba(0,0,0,.22);overflow:hidden}
.hpfill{height:100%;width:0;border-radius:8px;transition:width .45s ease,background .45s ease}
.hpfill.ok{background:linear-gradient(90deg,#34d399,#10b981)}
.hpfill.warn{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.hpfill.bad{background:linear-gradient(90deg,#f87171,#dc2626)}
.hpcalc{font-size:11px;opacity:.88;margin-top:6px;line-height:1.5}
.quote{background:rgba(255,255,255,.14);border-left:4px solid rgba(255,255,255,.75);
  border-radius:0 12px 12px 0;padding:12px 14px}
.quote .qt{font-size:16px;font-weight:700;line-height:1.6}
.quote .qs{font-size:12px;opacity:.9;margin-top:6px}
.card{background:#fff;border-radius:16px;padding:18px 16px;margin-bottom:16px;
  box-shadow:0 2px 10px rgba(24,32,60,.07)}
.card h2{margin:0 0 12px;font-size:17px;font-weight:800;letter-spacing:.02em}
.card.boss{background:linear-gradient(160deg,#3b0d18,#5b1220);color:#ffe4e6;
  border:1px solid #7f1d2e;box-shadow:0 4px 18px rgba(91,18,32,.4)}
.card.boss h2{color:#fecdd3}
.card.alert{border:2px solid #fecaca;background:#fff5f5}
.card.alert h2{color:#b91c1c}
.card.mem{border:2px solid #fed7aa;background:#fffaf3}
.card.mem h2{color:#c2410c}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:flex-start;gap:6px;padding:7px 0;border-bottom:1px dashed #e6e9f0}
ul.list li:last-child{border-bottom:none}
.card.boss ul.list li{border-bottom-color:rgba(255,255,255,.14)}
label{display:flex;align-items:flex-start;gap:8px;flex:1;cursor:pointer;min-width:0}
label input[type=checkbox]{margin-top:5px;width:18px;height:18px;flex:none;accent-color:#4f46e5;cursor:pointer}
.memo{font-size:24px;width:30px;text-align:center;flex:none;line-height:1.2}
.mtxt{flex:1;min-width:0;font-size:14px;word-break:break-word}
.mtxt .ttl{font-weight:700}
.mtxt .sub{display:block;font-size:12px;color:#6b7280;margin-top:2px}
.card.boss .mtxt .sub{color:#fca5b5}
.lv{display:inline-block;font-size:12px;font-weight:800;padding:1px 7px;border-radius:999px;
  background:#7f1d2e;color:#fff;margin-left:6px;vertical-align:1px;font-variant-numeric:tabular-nums}
.lv.s{background:#f59e0b}.lv.m{background:#dc2626}
.over{color:#b91c1c;font-weight:800}
.card.boss .over{color:#fda4af}
label.done .mtxt{text-decoration:line-through;opacity:.45}
label.done .memo{filter:grayscale(1);opacity:.35}
.nlink{flex:none;font-size:11px;color:#4f46e5;text-decoration:none;border:1px solid #c7d2fe;
  background:#eef2ff;border-radius:999px;padding:2px 9px;white-space:nowrap;margin-top:4px}
.nlink:hover{background:#e0e7ff}
.bossemo{font-size:30px;line-height:1}
.bosshead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bosshead .bt{font-size:12px;letter-spacing:.14em;font-weight:800;color:#fda4af}
.bossname{font-size:18px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid #eceff5;vertical-align:top}
th{font-size:11px;color:#6b7280;font-weight:700;letter-spacing:.05em;background:#f8fafc}
td.d{white-space:nowrap;font-variant-numeric:tabular-nums;color:#4b5563}
.pri{font-size:15px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.who{font-weight:700}
.me{color:#4f46e5;font-weight:800}
.prog{font-size:12px;color:#6b7280;margin-top:10px;font-weight:700}
.note{font-size:13px;color:#374151}
.note p{margin:0 0 10px}
.note p:last-child{margin-bottom:0}
.note strong{background:linear-gradient(transparent 62%,#fde68a 62%);font-weight:800}
.src{font-size:12px;color:#4b5563}
.src li{padding:5px 0;border-bottom:1px dashed #eceff5;display:block}
.src a{color:#4f46e5;word-break:break-all}
.warnbox{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;
  font-size:13px;color:#92400e;font-weight:700;margin-top:10px}
/* lock gate */
#lockgate{position:fixed;inset:0;background:linear-gradient(150deg,#312e81,#6d28d9 60%,#9d174d);
  display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
#lockgate .box{background:rgba(255,255,255,.97);border-radius:20px;padding:26px 22px;
  width:100%;max-width:330px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.35)}
#lockgate h2{margin:0 0 4px;font-size:19px;font-weight:800}
#lockdate{font-size:13px;color:#6b7280;margin-bottom:16px;font-weight:700}
#pw{width:100%;padding:11px 12px;font-size:16px;border:2px solid #ddd;border-radius:11px;
  text-align:center;outline:none}
#pw:focus{border-color:#6d28d9}
#go{width:100%;margin-top:10px;padding:11px;font-size:15px;font-weight:800;color:#fff;border:none;
  border-radius:11px;background:linear-gradient(135deg,#6d28d9,#db2777);cursor:pointer}
#go:disabled{opacity:.6;cursor:wait}
#err{color:#dc2626;font-size:13px;margin-top:9px;min-height:18px;font-weight:700}
@media(max-width:520px){h1{font-size:20px}.card{padding:15px 13px}.memo{font-size:22px;width:26px}}
</style>
</head>
<body>
<div id="content"></div>
<div id="lockgate">
  <div class="box">
    <h2>🔒 朝ブリーフ</h2>
    <div id="lockdate">2026年8月26日（水）</div>
    <input type="password" id="pw" placeholder="パスフレーズ" autocomplete="off">
    <button id="go">開く</button>
    <div id="err"></div>
  </div>
</div>

const SKEY="brief-2026-08-26";
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY))||{}}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s))}catch(e){}}
function refresh(){
  const s=loadState();
  let hp=100, left=0;
  document.querySelectorAll('#content input[type=checkbox][data-id]').forEach(function(cb){
    const id=cb.getAttribute('data-id');
    const done=!!s[id];
    cb.checked=done;
    const lab=cb.closest('label');
    if(lab) lab.classList.toggle('done',done);
    if(!done){
      if(id.indexOf('self-')===0) hp-=10;
      else if(id.indexOf('mem-')===0) hp-=5;
      left++;
    }
  });
  hp=Math.max(0,Math.min(100,hp));
  const v=document.getElementById('hpval'); if(v) v.textContent=hp;
  const f=document.getElementById('hpfill');
  if(f){ f.style.width=hp+'%'; f.className='hpfill '+(hp>=80?'ok':(hp>=50?'warn':'bad')); }
  const p=document.getElementById('prog');
  if(p) p.textContent = left>0 ? ('残り '+left+' 件') : '全部やりきった！';
}
function wire(){
  document.querySelectorAll('#content input[type=checkbox][data-id]').forEach(function(cb){
    cb.addEventListener('change',function(){
      const s=loadState();
      if(cb.checked) s[cb.getAttribute('data-id')]=1; else delete s[cb.getAttribute('data-id')];
      saveState(s); refresh();
    });
  });
  refresh();
}
function b64(b){const s=atob(b);const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
async function unlock(){
  const btn=document.getElementById('go'), err=document.getElementById('err');
  const pw=document.getElementById('pw').value;
  err.textContent=''; btn.disabled=true; btn.textContent='復号中…';
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.it,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},k,b64(ENC.ct));
    document.getElementById('content').innerHTML=new TextDecoder().decode(pt);
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){
    err.textContent='パスフレーズが違います';
    btn.disabled=false; btn.textContent='開く';
  }
}
document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('go').addEventListener('click',unlock);
  document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')unlock()});
  document.getElementById('pw').focus();
});
</script>
