<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
:root{--bg1:#1e3a8a;--bg2:#7c3aed;--card:#ffffff;--ink:#1f2937;--mut:#6b7280;}
*{box-sizing:border-box;}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:#f1f5f9;color:var(--ink);}
.wrap{max-width:760px;margin:0 auto;padding:16px;}
.hdr{background:linear-gradient(135deg,var(--bg1),var(--bg2));color:#fff;border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 8px 24px rgba(30,58,138,.25);}
.hdr .date{font-size:14px;opacity:.9;}
.hdr h1{margin:4px 0 14px;font-size:24px;}
.hp{background:rgba(255,255,255,.15);border-radius:14px;padding:12px 14px;margin-bottom:14px;}
.hplabel{font-weight:700;font-size:15px;margin-bottom:6px;}
.hpbar{height:16px;background:rgba(0,0,0,.25);border-radius:10px;overflow:hidden;}
.hpbar>div{height:100%;transition:width .4s;border-radius:10px;}
.hpbar .ok{background:#22c55e;}.hpbar .warn{background:#eab308;}.hpbar .bad{background:#ef4444;}
.hpnote{font-size:11px;opacity:.85;margin-top:6px;}
.prog{font-size:13px;font-weight:700;margin-top:6px;}
.quote{margin-top:6px;font-size:15px;font-style:italic;border-left:3px solid rgba(255,255,255,.6);padding-left:10px;}
.quote .qsrc{display:block;font-size:12px;opacity:.85;font-style:normal;margin-top:2px;}
.card{background:var(--card);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);}
.card h2{margin:0 0 12px;font-size:17px;}
.card.danger{border-left:6px solid #ef4444;}
.card.warn2{border-left:6px solid #f97316;}
.card.sanbo{border-left:6px solid #7c3aed;background:#faf5ff;}
.card.src{background:#f8fafc;}
.list{list-style:none;margin:0;padding:0;}
.list li{display:flex;align-items:flex-start;gap:6px;padding:8px 0;border-bottom:1px dashed #e5e7eb;}
.list li:last-child{border-bottom:none;}
.list label{flex:1;display:flex;align-items:flex-start;gap:8px;cursor:pointer;}
.list input{margin-top:3px;transform:scale(1.2);}
.memo{font-size:24px;width:30px;text-align:center;line-height:1;flex:none;}
.mtxt{flex:1;line-height:1.5;font-size:14px;}
.over{color:#dc2626;font-weight:700;}
.lv{display:inline-block;background:#111827;color:#fff;font-size:12px;padding:1px 6px;border-radius:6px;margin-left:2px;}
.src{display:inline-block;background:#e5e7eb;color:#374151;font-size:11px;padding:1px 6px;border-radius:6px;}
.pri{display:inline-block;font-size:12px;padding:1px 6px;border-radius:6px;margin-right:4px;font-weight:700;}
.p1{background:#fee2e2;color:#b91c1c;}.p2{background:#fef9c3;color:#a16207;}.p3{background:#dcfce7;color:#15803d;}
.nlink{flex:none;font-size:12px;color:#2563eb;text-decoration:none;white-space:nowrap;margin-left:6px;margin-top:3px;}
label.done .mtxt{text-decoration:line-through;opacity:.5;}
label.done .memo{filter:grayscale(1);opacity:.35;}
.plain{margin:0;padding-left:18px;line-height:1.7;font-size:14px;}
.plain li{margin-bottom:3px;}
.mini{font-size:12px;color:var(--mut);margin:8px 0 0;}
.sanbo p{line-height:1.7;font-size:14px;margin:0;}
.ft{text-align:center;font-size:11px;color:var(--mut);padding:10px 0 24px;}
a{color:#2563eb;}
#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#1e3a8a,#7c3aed);display:flex;align-items:center;justify-content:center;z-index:99;}
.lockbox{background:#fff;border-radius:16px;padding:28px 24px;width:300px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);}
.lockbox h3{margin:0 0 14px;font-size:18px;}
.lockbox input{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;margin-bottom:10px;}
.lockbox button{width:100%;padding:10px;border:none;border-radius:8px;background:#7c3aed;color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
.lockerr{color:#dc2626;font-size:13px;margin-top:8px;min-height:18px;}
</style>
</head>
<body>
<div id="content"></div>
<div id="lockgate">
  <div class="lockbox">
    <h3>🔒 朝ブリーフ</h3>
    <input type="password" id="pass" placeholder="パスフレーズ" autofocus>
    <button id="openbtn">開く</button>
    <div class="lockerr" id="lockerr"></div>
  </div>
</div>

const SKEY = "brief-2026-08-11";
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function decrypt(pass){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
  return new TextDecoder().decode(pt);
}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}');}catch(e){return {};}}
function saveState(s){localStorage.setItem(SKEY,JSON.stringify(s));}
function refresh(){
  const boxes=document.querySelectorAll('#content input[type=checkbox]');
  let self=0,mem=0,remain=0;
  boxes.forEach(b=>{
    const id=b.getAttribute('data-id');
    if(b.checked){b.closest('label').classList.add('done');}
    else{b.closest('label').classList.remove('done');remain++;}
    if(!b.checked){if(id&&id.indexOf('self-')===0)self++;if(id&&id.indexOf('mem-')===0)mem++;}
  });
  let hp=100-self*10-mem*5; if(hp<0)hp=0; if(hp>100)hp=100;
  const v=document.getElementById('hpval'); if(v)v.textContent=hp;
  const f=document.getElementById('hpfill'); if(f){f.style.width=hp+'%';f.className=hp>=80?'ok':(hp>=50?'warn':'bad');}
  const p=document.getElementById('prog'); if(p)p.textContent=remain>0?('残り '+remain+' 件'):'全部やりきった！';
}
function wire(){
  const st=loadState();
  document.querySelectorAll('#content input[type=checkbox]').forEach(b=>{
    const id=b.getAttribute('data-id');
    if(st[id])b.checked=true;
    b.addEventListener('change',()=>{const s=loadState();s[id]=b.checked;saveState(s);refresh();});
  });
  refresh();
}
async function open(){
  const pass=document.getElementById('pass').value;
  try{
    const htmlout=await decrypt(pass);
    document.getElementById('content').innerHTML=htmlout;
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){document.getElementById('lockerr').textContent='パスフレーズが違います';}
}
document.getElementById('openbtn').addEventListener('click',open);
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')open();});
</script>
