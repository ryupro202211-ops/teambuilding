<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:0 0 40px;background:#f2f4f8;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;color:#1f2430;line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding:0 14px}
header.hero{background:linear-gradient(135deg,#4a6cf7 0%,#8b5cf6 55%,#ec4899 100%);color:#fff;padding:26px 20px 22px;border-radius:0 0 22px 22px;box-shadow:0 6px 22px rgba(74,108,247,.28)}
.hero .date{font-size:13px;opacity:.9;letter-spacing:.06em}
.hero h1{margin:4px 0 14px;font-size:26px;font-weight:800;letter-spacing:.02em}
.hpbox{background:rgba(255,255,255,.16);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.hprow{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.hpbar{flex:1;height:14px;background:rgba(0,0,0,.22);border-radius:9px;overflow:hidden}
.hpfill{height:100%;width:0;border-radius:9px;transition:width .45s ease}
.hpfill.ok{background:linear-gradient(90deg,#34d399,#10b981)}
.hpfill.warn{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.hpfill.bad{background:linear-gradient(90deg,#f87171,#ef4444)}
.hpnote{font-size:11px;opacity:.85;margin-top:6px}
.quote{background:rgba(255,255,255,.16);border-left:4px solid #fff;border-radius:0 12px 12px 0;padding:11px 14px}
.quote p{margin:0;font-size:15px;font-weight:700}
.quote span{display:block;margin-top:5px;font-size:12px;opacity:.9}
.card{background:#fff;border-radius:16px;padding:16px 18px;margin:16px 0;box-shadow:0 2px 10px rgba(31,36,48,.07)}
.card h2{margin:0 0 12px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:7px}
.card.boss{background:#2b0d12;color:#ffe4e6;border:1px solid #7f1d1d}
.card.boss h2{color:#fecaca}
.card.danger{border-left:5px solid #ef4444}
.card.danger h2{color:#b91c1c}
.card.member{border-left:5px solid #f97316}
.card.member h2{color:#c2410c}
.card.today{border-left:5px solid #eab308}
.card.ahead{border-left:5px solid #0ea5e9}
.card.misc{border-left:5px solid #94a3b8}
.card.advice{border-left:5px solid #8b5cf6}
.card.src{border-left:5px solid #64748b}
ul.tasks{list-style:none;margin:0;padding:0}
ul.tasks li{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px dashed #e4e8f0}
ul.tasks li:last-child{border-bottom:none}
label{flex:1;display:flex;align-items:flex-start;gap:8px;cursor:pointer}
label input{margin-top:5px;width:17px;height:17px;flex:0 0 auto;accent-color:#4a6cf7}
.memo{font-size:24px;width:30px;text-align:center;flex:0 0 30px;line-height:1.2}
.mtxt{flex:1;font-size:14px}
.mtxt b{display:block;font-size:14.5px}
.meta{display:block;font-size:12px;color:#64748b;margin-top:2px}
.card.boss .meta{color:#fca5a5}
.over{color:#dc2626;font-weight:800}
.card.boss .over{color:#fca5a5}
.lv{display:inline-block;background:#111827;color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:1px 9px;margin-left:6px;vertical-align:1px}
.card.boss .lv{background:#fecaca;color:#7f1d1d}
label.done .mtxt{text-decoration:line-through;opacity:.45}
label.done .memo{filter:grayscale(1);opacity:.35}
.nlink{flex:0 0 auto;font-size:11.5px;color:#4a6cf7;text-decoration:none;border:1px solid #c7d2fe;border-radius:999px;padding:3px 9px;white-space:nowrap;align-self:center}
.nlink:hover{background:#eef2ff}
.bossemo{font-size:30px;line-height:1}
.bossname{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;margin-bottom:4px}
.prio{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;margin-right:7px;white-space:nowrap}
.p1{background:#fee2e2;color:#b91c1c}
.p2{background:#fef3c7;color:#a16207}
.p3{background:#dcfce7;color:#15803d}
.prog{font-size:12.5px;color:#475569;margin-top:10px;font-weight:700}
ul.plain{margin:0;padding-left:1.15em;font-size:13.5px}
ul.plain li{margin:5px 0}
.card.advice p{margin:0 0 10px;font-size:14px}
.card.advice p:last-child{margin-bottom:0}
.card.src a{color:#2563eb;word-break:break-all}
.cal{font-size:13.5px}
.cal b{display:inline-block;min-width:112px;color:#334155}
#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#4a6cf7,#8b5cf6,#ec4899);display:flex;align-items:center;justify-content:center;z-index:99}
#lockbox{background:#fff;border-radius:18px;padding:26px 24px;width:min(340px,88vw);box-shadow:0 12px 40px rgba(0,0,0,.3);text-align:center}
#lockbox h2{margin:0 0 4px;font-size:19px}
#lockbox p{margin:0 0 14px;font-size:12.5px;color:#64748b}
#pw{width:100%;padding:11px 12px;font-size:16px;border:1px solid #cbd5e1;border-radius:10px;margin-bottom:10px}
#go{width:100%;padding:11px;font-size:15px;font-weight:800;color:#fff;background:#4a6cf7;border:none;border-radius:10px;cursor:pointer}
#go:disabled{opacity:.6}
#err{color:#dc2626;font-size:12.5px;margin-top:9px;min-height:18px}

</style>
</head>
<body>
<div id="content"></div>
<div id="lockgate">
  <div id="lockbox">
    <h2>🔒 朝ブリーフ</h2>
    <p>パスフレーズを入力してください</p>
    <input type="password" id="pw" autocomplete="off" placeholder="パスフレーズ">
    <button id="go">開く</button>
    <div id="err"></div>
  </div>
</div>

const SKEY='brief-2026-08-20';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s))}catch(e){}}
function refresh(){
  const boxes=[...document.querySelectorAll('#content input[type=checkbox][data-id]')];
  let self=0,mem=0,td=0,tdDone=0;
  boxes.forEach(b=>{const id=b.dataset.id;
    if(id.startsWith('self-')&&!b.checked)self++;
    if(id.startsWith('mem-')&&!b.checked)mem++;
    if(id.startsWith('td-')){td++;if(b.checked)tdDone++;}
    const l=b.closest('label'); if(l)l.classList.toggle('done',b.checked);});
  let hp=100-self*10-mem*5; hp=Math.max(0,Math.min(100,hp));
  const f=document.getElementById('hpfill'),v=document.getElementById('hpval');
  if(f){f.style.width=hp+'%';f.className='hpfill '+(hp>=80?'ok':hp>=50?'warn':'bad');}
  if(v)v.textContent=hp;
  const n=document.querySelector('.hpnote');
  if(n)n.textContent='自分の期限切れ '+self+'件 ×-10 ／ メンバー切れ '+mem+'件 ×-5 ／ 毎朝100にリセット';
  const p=document.getElementById('prog');
  if(p){const rest=td-tdDone; p.textContent=rest===0?'🎉 全部やりきった！':'今日のToDo 残り '+rest+' 件';}
}
function wire(){
  const st=loadState();
  document.querySelectorAll('#content input[type=checkbox][data-id]').forEach(b=>{
    if(st[b.dataset.id])b.checked=true;
    b.addEventListener('change',()=>{const s=loadState();s[b.dataset.id]=b.checked;saveState(s);refresh();});
  });
  refresh();
}
async function unlock(){
  const err=document.getElementById('err'),go=document.getElementById('go');
  err.textContent='';go.disabled=true;go.textContent='復号中…';
  try{
    const pw=document.getElementById('pw').value;
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},k,b64(ENC.ct));
    document.getElementById('content').innerHTML=new TextDecoder().decode(pt);
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){err.textContent='パスフレーズが違います';go.disabled=false;go.textContent='開く';}
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('go').addEventListener('click',unlock);
  document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
  document.getElementById('pw').focus();
});

</script>
