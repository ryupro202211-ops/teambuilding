<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:0 0 40px;background:#f4f6fa;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;color:#1f2937;line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding:0 14px}
header{background:linear-gradient(135deg,#4f46e5 0%,#9333ea 50%,#db2777 100%);color:#fff;padding:26px 20px 22px;border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(79,70,229,.28)}
header .date{font-size:13px;opacity:.9;letter-spacing:.5px}
header h1{margin:4px 0 14px;font-size:23px;font-weight:700}
.hpbox{background:rgba(255,255,255,.16);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.hprow{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.hpbar{flex:1;height:14px;background:rgba(0,0,0,.22);border-radius:8px;overflow:hidden}
.hpfill{height:100%;border-radius:8px;transition:width .4s ease,background .4s ease}
.hpfill.ok{background:linear-gradient(90deg,#34d399,#10b981)}
.hpfill.warn{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.hpfill.bad{background:linear-gradient(90deg,#fb7185,#e11d48)}
.hpnote{font-size:11px;opacity:.85;margin-top:6px}
.quote{background:rgba(255,255,255,.14);border-left:4px solid rgba(255,255,255,.75);border-radius:8px;padding:11px 14px;font-size:14px}
.quote .src{display:block;font-size:12px;opacity:.85;margin-top:5px}
.card{background:#fff;border-radius:14px;padding:16px 18px;margin:16px 0;box-shadow:0 2px 10px rgba(15,23,42,.07)}
.card h2{margin:0 0 12px;font-size:16px;font-weight:700;padding-bottom:8px;border-bottom:2px solid #eef2f7}
.card.self{border-left:5px solid #e11d48;background:#fff5f6}
.card.self h2{color:#be123c;border-bottom-color:#fecdd3}
.card.mem{border-left:5px solid #f97316;background:#fff8f1}
.card.mem h2{color:#c2410c;border-bottom-color:#fed7aa}
.card.boss{background:#2b0d14;border-left:5px solid #dc2626;color:#fee2e2}
.card.boss h2{color:#fca5a5;border-bottom-color:#7f1d1d}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed #e5e7eb}
ul.list li:last-child{border-bottom:none}
label{flex:1;display:flex;align-items:flex-start;gap:8px;cursor:pointer}
label input{margin-top:5px;width:17px;height:17px;flex:none;accent-color:#4f46e5}
.memo{font-size:24px;width:30px;text-align:center;flex:none;line-height:1.2}
.bossemo{font-size:30px}
.mtxt{flex:1;font-size:14px}
.lv{display:inline-block;background:#dc2626;color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.over{color:#be123c;font-weight:700}
.due{color:#b45309;font-weight:700}
label.done .mtxt{text-decoration:line-through;opacity:.45}
label.done .memo{filter:grayscale(1);opacity:.35}
.nlink{flex:none;font-size:12px;color:#4f46e5;text-decoration:none;white-space:nowrap;padding-top:6px}
.nlink:hover{text-decoration:underline}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 9px;border-bottom:1px solid #eef2f7;text-align:left;vertical-align:top}
th{background:#f8fafc;font-size:12px;color:#64748b}
.p1{color:#dc2626;font-weight:700}.p2{color:#d97706;font-weight:700}.p3{color:#059669;font-weight:700}
.sub{font-size:12px;color:#64748b}
#prog{font-size:12.5px;color:#4f46e5;font-weight:700;margin-top:8px}
.srcs a{color:#4f46e5;font-size:13px;word-break:break-all}
.srcs li{margin-bottom:5px}
#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#4f46e5,#9333ea,#db2777);display:flex;align-items:center;justify-content:center;z-index:99}
.gate{background:#fff;border-radius:16px;padding:28px 26px;width:min(340px,88vw);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.gate h3{margin:0 0 6px;font-size:17px}
.gate p{margin:0 0 14px;font-size:12.5px;color:#64748b}
.gate input{width:100%;padding:10px 12px;font-size:15px;border:2px solid #e2e8f0;border-radius:9px;margin-bottom:10px}
.gate button{width:100%;padding:11px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,#4f46e5,#9333ea);border:none;border-radius:9px;cursor:pointer}
#err{color:#dc2626;font-size:12.5px;margin-top:9px;min-height:17px}

</style>
</head>

<div id="lockgate"><div class="gate">

SrVGg==","it":250000};
const SKEY='brief-2026-08-19';
function b2a(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0));}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}');}catch(e){return {};}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s));}catch(e){}}
function refresh(){
  const bx=[...document.querySelectorAll('#content input[type=checkbox]')];
  let self=0,mem=0,rem=0;
  bx.forEach(b=>{
    const id=b.dataset.id||'';
    if(!b.checked){rem++; if(id.startsWith('self-'))self++; if(id.startsWith('mem-'))mem++;}
    const l=b.closest('label'); if(l)l.classList.toggle('done',b.checked);
  });
  let hp=100-self*10-mem*5; hp=Math.max(0,Math.min(100,hp));
  const f=document.getElementById('hpfill'),v=document.getElementById('hpval');
  if(f){f.style.width=hp+'%';f.className='hpfill '+(hp>=80?'ok':hp>=50?'warn':'bad');}
  if(v)v.textContent=hp;
  const n=document.getElementById('hpval');
  const note=document.querySelector('.hpnote');
  if(note)note.textContent='自分の期限切れ '+self+'件 ×-10 ／ メンバー切れ '+mem+'件 ×-5 ／ 毎朝100にリセット';
  const p=document.getElementById('prog');
  if(p)p.textContent=rem===0?'🎉 全部やりきった！':'残り '+rem+' 件';
}
function wire(){
  const st=loadState();
  document.querySelectorAll('#content input[type=checkbox]').forEach(b=>{
    if(st[b.dataset.id])b.checked=true;
    b.addEventListener('change',()=>{const s=loadState();s[b.dataset.id]=b.checked;saveState(s);refresh();});
  });
  refresh();
}
async function unlock(){
  const err=document.getElementById('err');
  err.textContent='復号中…';
  try{
    const enc=new TextEncoder();
    const km=await crypto.subtle.importKey('raw',enc.encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(ENC.iv)},k,b2a(ENC.ct));
    document.getElementById('content').innerHTML=new TextDecoder().decode(pt);
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){err.textContent='パスフレーズが違います';}
}
document.getElementById('go').addEventListener('click',unlock);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
