<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
:root{--bg:#f4f6fb;--card:#ffffff;--ink:#1f2733;--sub:#5b6675;--line:#e6eaf2;
--red:#e23b3b;--redbg:#fdecec;--orange:#e6820a;--orangebg:#fff5e6;
--green:#2fa563;--greenbg:#e9f7ef;--yellow:#e0a800;--blue:#2f6bd6;--blbg:#eaf1fc;--boss:#3a0d12;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.6;}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px;}
header{background:linear-gradient(135deg,#3a63d8,#7b3fe4);color:#fff;border-radius:18px;
padding:20px 20px 22px;box-shadow:0 8px 24px rgba(60,60,120,.18);}
header .date{font-size:13px;opacity:.9;letter-spacing:.05em;}
header h1{margin:2px 0 12px;font-size:22px;font-weight:800;}
.hpwrap{background:rgba(255,255,255,.16);border-radius:12px;padding:11px 13px;}
.hplab{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px;}
.hpbar{height:16px;background:rgba(0,0,0,.18);border-radius:9px;overflow:hidden;}
.hpfill{height:100%;width:40%;border-radius:9px;transition:width .35s ease;}
.hpfill.ok{background:#38d27f}.hpfill.warn{background:#ffd23e}.hpfill.bad{background:#ff5c5c}
.hpnote{font-size:11px;opacity:.9;margin-top:6px;}
.quote{margin-top:13px;background:rgba(255,255,255,.14);border-left:4px solid #ffd23e;
border-radius:8px;padding:10px 12px;font-size:14px;}
.quote .src{display:block;font-size:12px;opacity:.9;margin-top:5px;}
.card{background:var(--card);border-radius:15px;padding:15px 16px;margin-top:15px;
box-shadow:0 3px 12px rgba(40,50,90,.06);border:1px solid var(--line);}
.card h2{margin:0 0 11px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:7px;}
.card.boss{background:var(--boss);color:#ffdada;border:1px solid #66161c;}
.card.boss h2{color:#ff9a9a}
.bossemo{font-size:30px;line-height:1}
.bossname{font-size:19px;font-weight:800;}
.bosssub{font-size:13px;opacity:.85;margin-top:4px}
ul.rows{list-style:none;margin:0;padding:0}
li.row{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);}
li.row:last-child{border-bottom:none}
li.row label{flex:1;display:flex;align-items:flex-start;gap:8px;cursor:pointer;margin:0;}
li.row input{margin-top:4px;width:17px;height:17px;flex:none;}
.lv{flex:none;font-size:12px;font-weight:800;color:#fff;background:#e23b3b;border-radius:6px;
padding:2px 6px;margin-top:2px;white-space:nowrap;}
.card.self .lv{background:#e23b3b}.card.mem .lv{background:#e6820a}
.memo{font-size:24px;width:30px;text-align:center;flex:none;line-height:1.1;}
.mtxt{flex:1;font-size:14px;}
.mtxt .due{color:var(--red);font-weight:800;}
label.done .mtxt{text-decoration:line-through;color:#9aa4b2;}
label.done .memo{filter:grayscale(1);opacity:.35;}
.nlink{flex:none;font-size:12px;color:var(--blue);text-decoration:none;background:var(--blbg);
border-radius:6px;padding:3px 7px;margin-top:2px;white-space:nowrap;}
.self{border-left:5px solid var(--red)}.mem{border-left:5px solid var(--orange)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--sub);background:#f7f9fd}
.pri{font-weight:800;white-space:nowrap}
.p1{color:var(--red)}.p2{color:var(--yellow)}.p3{color:var(--green)}
td.tk label{display:flex;gap:7px;align-items:flex-start;cursor:pointer}
td.tk input{margin-top:3px}
label.done .tkt{text-decoration:line-through;color:#9aa4b2}
.mini{font-size:12px;color:var(--sub)}
.due{color:var(--red);font-weight:800}
.today{color:var(--orange);font-weight:800}
ul.plain{margin:4px 0 0;padding-left:18px;font-size:13.5px}
ul.plain li{margin:3px 0}
.prog{margin-top:10px;font-size:13px;font-weight:800;color:var(--blue);text-align:center;
background:var(--blbg);border-radius:9px;padding:8px;}
.src a{color:var(--blue)}
.comment{font-size:14px;background:#fbfcfe;border-radius:10px;padding:12px;border:1px solid var(--line)}
.sched{font-size:13.5px}

#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#2a3a6e,#4b2a7e);
display:flex;align-items:center;justify-content:center;z-index:99;}
#lockbox{background:#fff;border-radius:16px;padding:26px 24px;width:300px;text-align:center;
box-shadow:0 10px 40px rgba(0,0,0,.3);}
#lockbox h3{margin:0 0 4px;font-size:18px}
#lockbox p{margin:0 0 14px;font-size:12px;color:#5b6675}
#pw{width:100%;padding:10px;border:1px solid #ccd3e0;border-radius:9px;font-size:15px;text-align:center}
#go{margin-top:10px;width:100%;padding:11px;border:0;border-radius:9px;background:#3a63d8;color:#fff;
font-size:15px;font-weight:800;cursor:pointer}
#err{color:#e23b3b;font-size:12px;margin-top:8px;min-height:14px}
</style>
</head>
<body>
<div id="lockgate">
  <div id="lockbox">
    <h3>🔒 朝ブリーフ</h3>
    <p>パスフレーズを入力してください</p>
    <input id="pw" type="password" placeholder="パスフレーズ" autocomplete="off">
    <button id="go">開く</button>
    <div id="err"></div>
  </div>
</div>
<div class="wrap">
  <header>
    <div class="date">2026年8月13日（木）</div>
    <h1>🌅 りゅうちゃん 朝ブリーフ</h1>
    <div class="hpwrap">
      <div class="hplab"><span>❤️ 今日のHP</span><span id="hpval">40 / 100</span></div>
      <div class="hpbar"><div id="hpfill" class="hpfill bad" style="width:40%"></div></div>
      <div class="hpnote">自分の期限切れ 3件 ×-10 ／ メンバー切れ 6件 ×-5 ／ 毎朝100にリセット</div>
    </div>
    <div class="quote">「今日、この一日の区切りで生きよ。」<span class="src">— デール・カーネギー『道は開ける』</span></div>
  </header>
  <div id="content"></div>
  <div class="prog" id="prog"></div>
</div>

const SKEY="brief-2026-08-13";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){return {}}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s))}catch(e){}}
function refresh(){
  const boxes=[...document.querySelectorAll('#content input[type=checkbox]')];
  let cs=0,cm=0,rem=0;
  boxes.forEach(b=>{
    const id=b.dataset.id||'';
    if(b.checked){ if(id.startsWith('self-'))cs++; if(id.startsWith('mem-'))cm++; }
    else rem++;
    const lab=b.closest('label'); if(lab){ b.checked?lab.classList.add('done'):lab.classList.remove('done'); }
  });
  let hp=100-(3-cs)*10-(6-cm)*5; if(hp<0)hp=0; if(hp>100)hp=100;
  const f=document.getElementById('hpfill'), v=document.getElementById('hpval');
  if(f){f.style.width=hp+'%'; f.className='hpfill '+(hp>=80?'ok':(hp>=50?'warn':'bad'));}
  if(v)v.textContent=hp+' / 100';
  const p=document.getElementById('prog');
  if(p)p.textContent=rem===0?'🎉 全部やりきった！':('残り '+rem+' 件');
}
function wire(){
  const st=loadState();
  document.querySelectorAll('#content input[type=checkbox]').forEach(b=>{
    const id=b.dataset.id; if(st[id])b.checked=true;
    b.addEventListener('change',()=>{const s=loadState();s[b.dataset.id]=b.checked;saveState(s);refresh();});
  });
  refresh();
}
async function decrypt(pass){
  const km=await crypto.subtle.importKey('raw',enc_utf8(pass),{name:'PBKDF2'},false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.it,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
  return new TextDecoder().decode(pt);
}
function enc_utf8(s){return new TextEncoder().encode(s);}
async function open(){
  const err=document.getElementById('err');err.textContent='';
  try{
    const html=await decrypt(document.getElementById('pw').value);
    document.getElementById('content').innerHTML=html;
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){err.textContent='パスフレーズが違います';}
}
document.getElementById('go').addEventListener('click',open);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')open();});
</script>
