<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;background:#eef1f6;color:#22262e;line-height:1.6;padding:14px}
.wrap{max-width:760px;margin:0 auto}
.hero{background:linear-gradient(135deg,#4b6cb7,#182848);color:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(24,40,72,.25);margin-bottom:16px}
.hd-date{font-size:13px;opacity:.85}
.hd-title{font-size:22px;font-weight:800;margin:2px 0 14px}
.hp-top{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:4px}
.hpbar{height:16px;background:rgba(255,255,255,.25);border-radius:10px;overflow:hidden}
.hpfill{height:100%;border-radius:10px;transition:width .4s}
.hpfill.ok{background:#3ddc84}.hpfill.warn{background:#ffcf3f}.hpfill.bad{background:#ff5a5a}
.hp-note{font-size:11px;opacity:.8;margin-top:5px}
.quote{margin-top:14px;font-size:15px;font-style:italic;border-left:3px solid rgba(255,255,255,.6);padding-left:10px}
.quote span{display:block;font-size:12px;opacity:.85;font-style:normal;margin-top:3px}
.card{background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card h2{font-size:16px;margin-bottom:10px}
.card.alert-self{border-left:6px solid #ff5a5a}
.card.alert-mem{border-left:6px solid #ff9f43}
.card.boss{background:#2b1414;color:#ffdada;border-left:6px solid #ff2d2d}
.none{color:#2a9d5c;font-weight:600}
.hint{font-size:12px;color:#6b7280;margin-top:8px}
.checklist{list-style:none}
.checklist li{display:flex;align-items:center;padding:7px 0;border-bottom:1px dashed #e5e7eb}
.checklist label{flex:1;display:flex;align-items:center;cursor:pointer;gap:6px}
.checklist input{width:18px;height:18px;flex:none}
.memo{font-size:24px;width:30px;text-align:center;flex:none}
.mtxt{flex:1}
.lv{display:inline-block;background:#374151;color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:4px}
.over{color:#e0322f}
label.done .mtxt{text-decoration:line-through;opacity:.5}
label.done .memo{filter:grayscale(1);opacity:.35}
.pri{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:6px}
.p1{background:#ffe0e0;color:#c0392b}.p2{background:#fff3d6;color:#b8860b}.p3{background:#dcf5e4;color:#1f8a4c}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid #e5e7eb;padding:7px 9px;text-align:left}
th{background:#f3f4f6}
.plain{list-style:none}
.plain li{padding:5px 0;border-bottom:1px dashed #eef0f3;font-size:14px}
.nlink{font-size:12px;color:#4b6cb7;text-decoration:none;margin-left:6px}
.soul p{font-size:14px}
.src a{color:#4b6cb7;font-size:13px}
#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#4b6cb7,#182848);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;color:#fff;gap:12px}
#lockgate h1{font-size:20px}
#lockgate input{padding:10px 14px;border-radius:10px;border:none;font-size:16px;width:220px;text-align:center}
#lockgate button{padding:10px 22px;border-radius:10px;border:none;background:#3ddc84;color:#0b3d1f;font-weight:700;font-size:15px;cursor:pointer}
#lockerr{color:#ffd0d0;font-size:13px;min-height:16px}
</style>
</head>
<body>
<div id="content"></div>
<div id="lockgate">
  <h1>🔒 朝ブリーフ</h1>
  <input id="pass" type="password" placeholder="パスフレーズ" autofocus>
  <button id="openbtn">開く</button>
  <div id="lockerr"></div>
</div>

const SKEY="brief-2026-07-26";
function b2ab(b64){const s=atob(b64);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function decrypt(pass){
  const salt=b2ab(ENC.salt),iv=b2ab(ENC.iv),data=b2ab(ENC.ct);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);
  return new TextDecoder().decode(pt);
}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){return {}}}
function saveState(s){localStorage.setItem(SKEY,JSON.stringify(s))}
function refresh(){
  let hp=100;
  document.querySelectorAll('input[data-id^="self-"]').forEach(c=>{if(!c.checked)hp-=10;});
  document.querySelectorAll('input[data-id^="mem-"]').forEach(c=>{if(!c.checked)hp-=5;});
  if(hp<0)hp=0;if(hp>100)hp=100;
  const f=document.getElementById('hpfill'),v=document.getElementById('hpval');
  if(f){f.style.width=hp+'%';f.className='hpfill '+(hp>=80?'ok':hp>=50?'warn':'bad');}
  if(v)v.textContent=hp;
}
function wire(){
  const st=loadState();
  document.querySelectorAll('.checklist input[type=checkbox]').forEach(c=>{
    const id=c.getAttribute('data-id');
    if(st[id]){c.checked=true;c.closest('label').classList.add('done');}
    c.addEventListener('change',()=>{
      c.closest('label').classList.toggle('done',c.checked);
      const s=loadState();s[id]=c.checked;saveState(s);refresh();
    });
  });
  refresh();
}
async function open(){
  const p=document.getElementById('pass').value;
  try{
    const txt=await decrypt(p);
    document.getElementById('content').innerHTML=txt;
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){document.getElementById('lockerr').textContent='パスフレーズが違います';}
}
document.getElementById('openbtn').addEventListener('click',open);
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')open();});
</script>
