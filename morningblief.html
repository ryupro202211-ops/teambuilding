<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
:root{--bg:#0f1220;--card:#171b2e;--ink:#e8ebf5;--sub:#9aa3c0;--line:#2a3050;}
*{box-sizing:border-box;}
body{margin:0;background:linear-gradient(160deg,#0d1020,#141a33);color:var(--ink);font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;line-height:1.6;}
.hero{padding:26px 18px 22px;background:linear-gradient(135deg,#5b6cff,#8a4bff 60%,#c04bff);color:#fff;}
.hero h1{margin:0 0 2px;font-size:20px;}
.hero .date{font-size:13px;opacity:.9;}
.hpwrap{margin:14px 0 6px;}
.hpbar{height:20px;border-radius:12px;background:rgba(255,255,255,.25);overflow:hidden;}
.hpfill{height:100%;width:70%;transition:width .4s;}
.hpfill.ok{background:#3ddc84;}.hpfill.warn{background:#ffc93c;}.hpfill.bad{background:#ff5a5a;}
.hpmeta{font-size:11px;opacity:.9;margin-top:4px;}
.quote{margin-top:12px;padding:10px 12px;background:rgba(255,255,255,.15);border-radius:10px;font-size:14px;}
.quote b{display:block;font-size:12px;opacity:.85;margin-top:4px;font-weight:normal;}
.wrap{padding:14px 12px 40px;max-width:760px;margin:0 auto;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.25);}
.card h2{margin:0 0 10px;font-size:16px;}
.card .sub{color:var(--sub);font-size:12px;margin:4px 0 8px;}
.alert-self{border-color:#ff5a5a;background:#241322;}
.alert-mem{border-color:#ff9d3c;background:#241c12;}
ul.plain{margin:0;padding-left:18px;}ul.plain li{margin:4px 0;}
ul.checks{list-style:none;margin:0;padding:0;}
ul.checks li{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);}
ul.checks li:last-child{border-bottom:none;}
ul.checks label{flex:1;display:flex;align-items:flex-start;gap:8px;cursor:pointer;}
ul.checks input{margin-top:4px;transform:scale(1.2);}
.lv{flex:none;font-size:12px;background:#3a2140;color:#ffb0e6;border-radius:6px;padding:1px 6px;margin-top:2px;}
.memo{font-size:24px;width:30px;text-align:center;flex:none;}
.mtxt{flex:1;}
.over{color:#ff6b6b;font-weight:bold;}
.pri{flex:none;font-size:12px;border-radius:6px;padding:1px 7px;margin-top:2px;}
.pri.red{background:#3a1620;color:#ff8a8a;}.pri.yellow{background:#3a3216;color:#ffe08a;}.pri.green{background:#16351f;color:#8affb0;}
label.done .mtxt{text-decoration:line-through;opacity:.45;}
label.done .memo{filter:grayscale(1);opacity:.35;}
.nlink{flex:none;font-size:12px;color:#8ab4ff;text-decoration:none;margin-top:2px;white-space:nowrap;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;}
th{background:#1e2440;color:var(--sub);}
a{color:#8ab4ff;}
#lockgate{position:fixed;inset:0;background:#0d1020;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:99;padding:20px;text-align:center;}
#lockgate h1{font-size:20px;margin:0;color:#e8ebf5;}
#lockgate input{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#171b2e;color:#fff;font-size:16px;width:220px;}
#lockgate button{padding:10px 20px;border:none;border-radius:10px;background:#5b6cff;color:#fff;font-size:15px;cursor:pointer;}
#lockerr{color:#ff6b6b;font-size:13px;min-height:16px;}
</style>
</head>
<body>
<div id="lockgate">
  <h1>🔒 朝ブリーフ</h1>
  <input id="pw" type="password" placeholder="パスフレーズ" autofocus>
  <button id="openbtn">開く</button>
  <div id="lockerr"></div>
</div>

<div class="hero">
  <div class="date">2026年7月28日（火）</div>
  <h1>🌅 りゅうちゃん 朝ブリーフ</h1>

    <div class="hpmeta" id="prog">残り 4 件</div>
  </div>
  <div class="quote">今日できることを明日に延ばすな<b>― ベンジャミン・フランクリン</b></div>
</div>

function b2a(b64){return Uint8Array.from(atob(b64),c=>c.charCodeAt(0));}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}');}catch(e){return {};}}
function saveState(s){localStorage.setItem(SKEY,JSON.stringify(s));}
function refresh(){
  let hp=100;
  document.querySelectorAll('input[data-id^="self-"]').forEach(c=>{if(!c.checked)hp-=10;});
  document.querySelectorAll('input[data-id^="mem-"]').forEach(c=>{if(!c.checked)hp-=5;});
  if(hp<0)hp=0;if(hp>100)hp=100;
  const f=document.getElementById('hpfill');
  f.style.width=hp+'%';f.className='hpfill '+(hp>=80?'ok':(hp>=50?'warn':'bad'));
  document.getElementById('hpval').textContent=hp;
  const all=[...document.querySelectorAll('input[data-id]')];
  const left=all.filter(c=>!c.checked).length;
  document.getElementById('prog').textContent=left===0?'全部やりきった！🎉':('残り '+left+' 件');
}
function wire(){
  const st=loadState();
  document.querySelectorAll('input[data-id]').forEach(c=>{
    const id=c.dataset.id;
    if(st[id]){c.checked=true;c.closest('label').classList.add('done');}
    c.addEventListener('change',()=>{
      const s=loadState();s[id]=c.checked;saveState(s);
      c.closest('label').classList.toggle('done',c.checked);
      refresh();
    });
  });
  refresh();
}
async function unlock(){
  const pw=document.getElementById('pw').value;
  const err=document.getElementById('lockerr');
  err.textContent='復号中…';
  try{
    const enc=new TextEncoder();
    const keyMat=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(ENC.salt),iterations:ENC.it,hash:'SHA-256'},keyMat,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(ENC.iv)},key,b2a(ENC.ct));
    document.getElementById('content').innerHTML=new TextDecoder().decode(plain);
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){err.textContent='パスフレーズが違います';}
}
document.getElementById('openbtn').addEventListener('click',unlock);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
</script>
