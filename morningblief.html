<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:#eef1f6;color:#222;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 60px}
header{background:linear-gradient(135deg,#5b6ef5,#8a4fff);color:#fff;padding:22px 20px;border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(80,60,200,.25)}
header h1{margin:0 0 2px;font-size:20px}
.date{font-size:13px;opacity:.9}
.hpbox{margin-top:14px;background:rgba(255,255,255,.16);border-radius:14px;padding:12px 14px}
.hprow{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px}
.hpbar{height:16px;background:rgba(0,0,0,.18);border-radius:9px;overflow:hidden}
.hpfill{height:100%;transition:width .4s;border-radius:9px}
.hpfill.ok{background:#33d17a}.hpfill.warn{background:#f5c518}.hpfill.bad{background:#ff5a5a}
.hpnote{font-size:11px;opacity:.9;margin-top:6px}
.quote{margin-top:12px;background:rgba(255,255,255,.14);border-left:4px solid #ffd76a;padding:10px 12px;border-radius:8px;font-size:13.5px}
.quote .src{display:block;font-size:11.5px;opacity:.85;margin-top:4px}
.card{background:#fff;border-radius:16px;padding:16px 18px;margin-top:16px;box-shadow:0 3px 10px rgba(0,0,0,.06)}
.card h2{margin:0 0 10px;font-size:16px}
.card.boss{background:#3a1116;color:#ffdada;border:1px solid #7a2230}
.card.boss h2{color:#ff8a8a}
.card.self{border-left:5px solid #ff5a5a}
.card.mem{border-left:5px solid #ff9d3a}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid #f0f0f0}
li:last-child{border-bottom:none}
label{flex:1;display:flex;align-items:flex-start;gap:8px;cursor:pointer}
label.done .mtxt{text-decoration:line-through;opacity:.5}
label.done .memo{filter:grayscale(1);opacity:.35}
input[type=checkbox]{margin-top:3px;width:17px;height:17px;flex:none}
.memo{font-size:24px;width:30px;text-align:center;flex:none;line-height:1}
.bossemo{font-size:30px}
.lv{display:inline-block;background:#ff5a5a;color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:4px}
.card.boss .lv{background:#ff8a8a;color:#3a1116}
.mtxt{flex:1;font-size:14px}
.sub{color:#888;font-size:12px}
.od{color:#e02020;font-weight:700}
.nlink{font-size:12px;color:#5b6ef5;text-decoration:none;white-space:nowrap;margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid #eee;vertical-align:top}
th{color:#666;font-weight:600;font-size:12px}
.pri{font-weight:700;white-space:nowrap}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;color:#fff}
.b-r{background:#ff5a5a}.b-y{background:#f5a300}.b-g{background:#33b06a}
.evt{font-size:13.5px;padding:5px 0;border-bottom:1px dashed #eee}
.evt b{color:#5b6ef5}
a{color:#5b6ef5}
.comment{font-size:14px;background:#f6f8ff;border-radius:10px;padding:12px 14px}
.src-list{font-size:12px;color:#555}
.src-list li{border:none;padding:3px 0}

#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#5b6ef5,#8a4fff);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;color:#fff;font-family:sans-serif}
#lockgate h1{font-size:22px;margin-bottom:4px}
#lockgate p{opacity:.85;font-size:13px;margin:0 0 18px}
#lockgate input{padding:12px 14px;border-radius:10px;border:none;font-size:16px;width:220px;text-align:center}
#lockgate button{margin-top:12px;padding:11px 26px;border:none;border-radius:10px;background:#ffd76a;color:#3a2b00;font-weight:700;font-size:15px;cursor:pointer}
#err{color:#ffd0d0;font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<div id="content"></div>
<div id="lockgate">
  <h1>🔒 朝ブリーフ</h1>
  <p>パスフレーズを入力してください</p>
  <input id="pw" type="password" autofocus>
  <button id="go">開く</button>
  <div id="err"></div>
</div>

const SKEY="brief-2026-08-15";
function b2a(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0));}
async function decrypt(pass){
  const salt=b2a(ENC.salt), iv=b2a(ENC.iv), data=b2a(ENC.ct);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);
  return new TextDecoder().decode(pt);
}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}');}catch(e){return {};}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s));}catch(e){}}
function refresh(){
  const self=[...document.querySelectorAll('input[data-id^="self-"]')];
  const mem=[...document.querySelectorAll('input[data-id^="mem-"]')];
  const all=[...document.querySelectorAll('input[data-id]')];
  const sa=self.filter(b=>!b.checked).length;
  const ma=mem.filter(b=>!b.checked).length;
  let hp=100-sa*10-ma*5; if(hp<0)hp=0; if(hp>100)hp=100;
  const fill=document.getElementById('hpfill');
  if(fill){fill.style.width=hp+'%';fill.className='hpfill '+(hp>=80?'ok':hp>=50?'warn':'bad');}
  const v=document.getElementById('hpval'); if(v)v.textContent=hp;
  const rem=all.filter(b=>!b.checked).length;
  const p=document.getElementById('prog');
  if(p)p.textContent=rem===0?'全部やりきった！🎉':('残り '+rem+' 件');
}
function wire(){
  const st=loadState();
  document.querySelectorAll('input[data-id]').forEach(b=>{
    const id=b.getAttribute('data-id');
    if(st[id]){b.checked=true;const l=b.closest('label');if(l)l.classList.add('done');}
    b.addEventListener('change',()=>{
      const s=loadState();const l=b.closest('label');
      if(b.checked){s[id]=1;if(l)l.classList.add('done');}else{delete s[id];if(l)l.classList.remove('done');}
      saveState(s);refresh();
    });
  });
  refresh();
}
async function open(){
  const pw=document.getElementById('pw').value;
  try{
    const html=await decrypt(pw);
    document.getElementById('content').innerHTML=html;
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){document.getElementById('err').textContent='パスフレーズが違います';}
}
document.getElementById('go').addEventListener('click',open);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')open();});
</script>
