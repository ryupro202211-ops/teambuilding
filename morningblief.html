<head>

<title>🔒 朝ブリーフ</title>
<style>
:root{--bg:#0f1226;--ink:#1a1a2e;}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;background:#eef1f7;color:#1f2333;}
.header{background:linear-gradient(135deg,#5b6cf0 0%,#8a5cf6 55%,#c04bd6 100%);color:#fff;padding:22px 20px 26px;box-shadow:0 4px 18px rgba(80,60,200,.25)}
.header h1{margin:0 0 2px;font-size:20px;letter-spacing:.5px}
.header .date{font-size:13px;opacity:.9;margin-bottom:14px}
.hpwrap{background:rgba(255,255,255,.18);border-radius:12px;padding:12px 14px}
.hplabel{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
.hpbar{height:16px;border-radius:9px;background:rgba(0,0,0,.18);overflow:hidden}
.hpfill{height:100%;border-radius:9px;transition:width .5s}
.hpfill.ok{background:#3ad07a}.hpfill.warn{background:#f5c344}.hpfill.bad{background:# f16060}
.hpfill.bad{background:#f16060}
.hpcalc{font-size:11px;opacity:.9;margin-top:6px}
.quote{margin-top:14px;background:rgba(255,255,255,.14);border-left:4px solid #ffe08a;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.6}
.quote .src{display:block;opacity:.85;font-size:11px;margin-top:4px}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px}
.card{background:#fff;border-radius:14px;padding:16px 16px 14px;margin:14px 0;box-shadow:0 2px 10px rgba(30,30,60,.07)}
.card h2{margin:0 0 12px;font-size:16px}
.boss-none{display:none}
.sec-alert{border-top:4px solid #f16060}
.alertbox{border-radius:10px;padding:10px 12px;margin:8px 0}
.alertbox.self{background:#fdecec;border:1px solid #f7b7b7}
.alertbox.mem{background:#fff3e6;border:1px solid #ffcf99}
.alerthead{font-weight:800;font-size:14px;margin-bottom:8px}
.alertbox.self .alerthead{color:#c0392b}
.alertbox.mem .alerthead{color:#c9720a}
ul.checklist{list-style:none;margin:0;padding:0}
ul.checklist li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #eee}
ul.checklist li:last-child{border-bottom:none}
ul.checklist label{flex:1;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;line-height:1.5}
.memo{font-size:24px;width:30px;text-align:center;flex:none}
.lv{font-size:12px;font-weight:800;background:#333;color:#fff;border-radius:6px;padding:2px 6px;flex:none}
.over{color:#d0021b;font-weight:800}
label.done .mtxt{text-decoration:line-through;opacity:.5}
label.done .memo{filter:grayscale(1);opacity:.35}
.nlink{font-size:12px;color:#5b6cf0;text-decoration:none;white-space:nowrap;flex:none}
.nlink:hover{text-decoration:underline}
.pri{font-size:12px;font-weight:800;border-radius:6px;padding:2px 6px;flex:none}
.p-red{background:#fde2e2;color:#c0392b}.p-yellow{background:#fdf3d6;color:#a97b12}.p-green{background:#e3f6e6;color:#2e7d43}
.note{font-size:12px;color:#777;margin-top:8px}
.warnbox{background:#fff7e0;border:1px solid #f0d68a;border-radius:8px;padding:10px 12px;font-size:13px;color:#8a6d1a}
ul.plain{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7}
ul.plain.small{font-size:12.5px}
.sec-advice p{font-size:13.5px;line-height:1.75;margin:0}
.prog{position:sticky;bottom:0;background:#5b6cf0;color:#fff;text-align:center;padding:10px;font-weight:700;border-radius:10px;margin-top:10px}
a{color:#5b6cf0}
</style>
</head>

const SKEY = 'brief-2026-07-29';

function loadState(){ try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){return {}} }
function saveState(s){ localStorage.setItem(SKEY, JSON.stringify(s)); }
function refresh(){
  let self=0, mem=0;
  document.querySelectorAll('#content input[type=checkbox]').forEach(cb=>{
    const id=cb.dataset.id||'';
    const done=cb.checked;
    cb.closest('label').classList.toggle('done',done);
    if(!done){ if(id.startsWith('self-'))self++; else if(id.startsWith('mem-'))mem++; }
  });
  let hp=100-self*10-mem*5; if(hp<0)hp=0; if(hp>100)hp=100;
  const f=document.getElementById('hpfill'), v=document.getElementById('hpval');
  if(f&&v){ f.style.width=hp+'%'; v.textContent=hp;
    f.className='hpfill '+(hp>=80?'ok':hp>=50?'warn':'bad'); }
  // remaining actionable (self+mem+td unchecked)
  let rem=0,total=0;
  document.querySelectorAll('#content input[type=checkbox]').forEach(cb=>{total++; if(!cb.checked)rem++;});
  const p=document.getElementById('prog');
  if(p) p.textContent = rem===0 ? '🎉 全部やりきった！' : ('残り '+rem+' 件');
}
function wire(){
  const st=loadState();
  document.querySelectorAll('#content input[type=checkbox]').forEach(cb=>{
    const id=cb.dataset.id;
    if(st[id]) cb.checked=true;
    cb.addEventListener('change',()=>{ const s=loadState(); s[cb.dataset.id]=cb.checked; saveState(s); refresh(); });
  });
  // progress bar
  const c=document.getElementById('content');
  if(c && !document.getElementById('prog')){ const d=document.createElement('div'); d.id='prog'; d.className='prog'; c.appendChild(d); }
  refresh();
}
async function decrypt(pass){
  const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const salt=dec(ENC.salt), iv=dec(ENC.iv), ct=dec(ENC.ct);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return new TextDecoder().decode(pt);
}
async function tryOpen(){
  const err=document.getElementById('err'); err.textContent='';
  try{
    const html=await decrypt(document.getElementById('pw').value);
    document.getElementById('content').innerHTML=html;
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){ err.textContent='パスフレーズが違います'; }
}
document.getElementById('openbtn').addEventListener('click',tryOpen);
document.getElementById('pw').addEventListener('keydown',e=>{ if(e.key==='Enter')tryOpen(); });
