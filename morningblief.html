<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:0 0 40px;background:#f4f6fa;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:#1f2937;line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding:0 14px}
header{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 50%,#db2777 100%);color:#fff;padding:26px 20px 22px;border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(79,70,229,.28)}
header .date{font-size:13px;opacity:.9;letter-spacing:.06em}
header h1{margin:4px 0 14px;font-size:23px;font-weight:800}
.hpbox{background:rgba(255,255,255,.16);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.hprow{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.hpbar{flex:1;height:16px;background:rgba(0,0,0,.22);border-radius:9px;overflow:hidden}
.hpfill{height:100%;border-radius:9px;transition:width .35s ease}
.hpfill.ok{background:linear-gradient(90deg,#34d399,#10b981)}
.hpfill.warn{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.hpfill.bad{background:linear-gradient(90deg,#fb7185,#ef4444)}
.hpnote{font-size:11px;opacity:.85;margin-top:6px}
.quote{background:rgba(255,255,255,.16);border-radius:14px;padding:12px 14px;font-size:14px}
.quote .q{font-weight:700}
.quote .s{font-size:12px;opacity:.88;margin-top:5px;text-align:right}
.card{background:#fff;border-radius:16px;padding:16px 18px;margin:16px 0;box-shadow:0 2px 10px rgba(15,23,42,.07)}
.card h2{margin:0 0 12px;font-size:17px;font-weight:800;border-left:5px solid #6366f1;padding-left:10px}
.card.danger{background:#fff1f2;border:1px solid #fecdd3}
.card.danger h2{border-left-color:#e11d48;color:#9f1239}
.card.warnc{background:#fff7ed;border:1px solid #fed7aa}
.card.warnc h2{border-left-color:#ea580c;color:#9a3412}
.card.boss{background:#2b0b12;border:1px solid #7f1d1d;color:#fde2e4}
.card.boss h2{border-left-color:#ef4444;color:#fca5a5}
.card.boss .bossname{font-size:19px;font-weight:800;color:#fecaca;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bossemo{font-size:30px}
.card.boss .bossdesc{font-size:13px;opacity:.9}
ul.tl{list-style:none;margin:0;padding:0}
ul.tl li{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed #e5e7eb}
ul.tl li:last-child{border-bottom:none}
ul.tl label{flex:1;display:flex;align-items:flex-start;gap:8px;cursor:pointer}
ul.tl input[type=checkbox]{margin-top:5px;width:17px;height:17px;flex:none;accent-color:#6366f1}
.memo{font-size:24px;width:30px;text-align:center;flex:none;line-height:1.2}
.mtxt{flex:1;font-size:14px}
label.done .mtxt{text-decoration:line-through;opacity:.45}
label.done .memo{filter:grayscale(1);opacity:.35}
.lv{display:inline-block;background:#e11d48;color:#fff;font-size:12px;font-weight:800;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.over{color:#be123c;font-weight:800}
.nlink{font-size:12px;color:#4f46e5;text-decoration:none;white-space:nowrap;flex:none;margin-top:4px}
.nlink:hover{text-decoration:underline}
.pri{display:inline-block;border-radius:6px;font-size:12px;font-weight:800;padding:2px 8px;margin-right:6px}
.p1{background:#fee2e2;color:#b91c1c}
.p2{background:#fef3c7;color:#92400e}
.p3{background:#dcfce7;color:#166534}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{border:1px solid #e5e7eb;padding:8px 9px;text-align:left;vertical-align:top}
th{background:#f8fafc;font-weight:700;white-space:nowrap}
.sub{font-size:12px;color:#6b7280}
#prog{font-size:13px;font-weight:700;color:#4338ca;margin-top:10px}
.srcs a{color:#4f46e5;font-size:13px;word-break:break-all}
.srcs li{margin-bottom:5px;font-size:13px}
.cal{font-size:13.5px;margin:0;padding-left:18px}
.cal li{margin-bottom:4px}
</style>
<style>
#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#312e81,#6d28d9,#9d174d);display:flex;align-items:center;justify-content:center;z-index:9999}
#lockbox{background:#fff;border-radius:18px;padding:28px 26px;width:min(340px,88vw);box-shadow:0 12px 40px rgba(0,0,0,.35);text-align:center;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
#lockbox h2{margin:0 0 6px;font-size:19px;color:#1f2937}
#lockbox p{margin:0 0 16px;font-size:12.5px;color:#6b7280}
#lockbox input{width:100%;padding:11px 12px;font-size:15px;border:1px solid #d1d5db;border-radius:10px;margin-bottom:12px;box-sizing:border-box}
#lockbox button{width:100%;padding:11px;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:10px;cursor:pointer}
#lockbox button:disabled{opacity:.6;cursor:default}
#lockdate{display:inline-block;margin:0 0 12px;padding:5px 14px;border-radius:999px;background:linear-gradient(135deg,#eef2ff,#faf5ff);color:#4338ca;font-size:13px;font-weight:800;letter-spacing:.02em;border:1px solid #e0e7ff}
#lockerr{color:#dc2626;font-size:12.5px;margin-top:10px;min-height:16px}
</style>
</head>
<body>
<div id="content"></div>
<div id="lockgate">
  <div id="lockbox">
    <h2>🔒 朝ブリーフ</h2>
    <div id="lockdate">2026年8月24日（月）</div>
    <p>パスフレーズを入力してください</p>
    <input type="password" id="lockpw" autocomplete="off" placeholder="パスフレーズ">
    <button id="lockbtn">開く</button>
    <div id="lockerr"></div>
  </div>
</div>

const SKEY='brief-2026-08-24';
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s))}catch(e){}}
function refresh(){
  var boxes=document.querySelectorAll('#content input[type=checkbox][data-id]');
  var self=0,mem=0,todo=0,todoDone=0;
  boxes.forEach(function(b){
    var id=b.getAttribute('data-id');
    if(id.indexOf('self-')===0){if(!b.checked)self++;}
    else if(id.indexOf('mem-')===0){if(!b.checked)mem++;}
    else if(id.indexOf('td-')===0){todo++;if(b.checked)todoDone++;}
  });
  var hp=100-self*10-mem*5;
  if(hp<0)hp=0; if(hp>100)hp=100;
  var f=document.getElementById('hpfill');
  var v=document.getElementById('hpval');
  if(f){f.style.width=hp+'%';f.className='hpfill '+(hp>=80?'ok':(hp>=50?'warn':'bad'));}
  if(v)v.textContent=hp;
  var p=document.getElementById('prog');
  if(p){var rest=todo-todoDone;p.textContent=rest===0?'🎉 全部やりきった！':('残り '+rest+' 件');}
}
function wire(){
  var boxes=document.querySelectorAll('#content input[type=checkbox][data-id]');
  var st=loadState();
  boxes.forEach(function(b){
    var id=b.getAttribute('data-id');
    if(st[id])b.checked=true;
    var lab=b.closest('label');
    if(lab)lab.classList.toggle('done',b.checked);
    b.addEventListener('change',function(){
      var s=loadState();
      if(b.checked)s[id]=1; else delete s[id];
      saveState(s);
      var l=b.closest('label');
      if(l)l.classList.toggle('done',b.checked);
      refresh();
    });
  });
  refresh();
}
function b64(s){var bin=atob(s);var a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
async function unlock(){
  var btn=document.getElementById('lockbtn');
  var inp=document.getElementById('lockpw');
  var err=document.getElementById('lockerr');
  err.textContent='';btn.disabled=true;btn.textContent='復号中…';
  try{
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(inp.value),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
    document.getElementById('content').innerHTML=new TextDecoder().decode(pt);
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){
    err.textContent='パスフレーズが違います';
    btn.disabled=false;btn.textContent='開く';
  }
}
document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('lockbtn').addEventListener('click',unlock);
  document.getElementById('lockpw').addEventListener('keydown',function(e){if(e.key==='Enter')unlock();});
  document.getElementById('lockpw').focus();
});
</script>
