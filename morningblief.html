<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:0 0 40px;background:#eef1f6;color:#1e2430;
 font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;
 font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}
header{background:linear-gradient(135deg,#3b4bd8 0%,#7b3fd4 55%,#c0399a 100%);
 color:#fff;padding:26px 0 30px;margin-bottom:18px;box-shadow:0 4px 18px rgba(40,40,90,.25)}
header .wrap{padding:0 18px}
.d{font-size:13px;opacity:.85;letter-spacing:.08em}
h1{margin:2px 0 16px;font-size:26px;font-weight:800;letter-spacing:.02em}
.hpbox{background:rgba(255,255,255,.14);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.hprow{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.hplabel{font-weight:800;font-size:13px;letter-spacing:.1em}
.hpnum{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.hpbar{height:14px;border-radius:8px;background:rgba(0,0,0,.25);overflow:hidden}
.hpfill{height:100%;border-radius:8px;transition:width .3s ease,background .3s ease}
.hpfill.ok{background:linear-gradient(90deg,#2fd07a,#7ef0b0)}
.hpfill.warn{background:linear-gradient(90deg,#f5c33b,#ffe487)}
.hpfill.bad{background:linear-gradient(90deg,#f0503c,#ff8f7d)}
.hpcalc{font-size:11px;opacity:.85;margin-top:6px}
.quote{background:rgba(255,255,255,.16);border-left:4px solid rgba(255,255,255,.7);
 border-radius:0 10px 10px 0;padding:12px 14px}
.quote .qt{font-size:17px;font-weight:700;line-height:1.6}
.quote .qs{font-size:12px;opacity:.85;margin-top:6px}
.quote .qn{font-size:12px;opacity:.8;margin-top:8px}
.card{background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:14px;
 box-shadow:0 2px 10px rgba(30,40,80,.07)}
.card h2{margin:0 0 12px;font-size:17px;font-weight:800;letter-spacing:.02em}
.card.self{border-left:6px solid #e23a2e}
.card.self h2{color:#c22c22}
.card.mem{border-left:6px solid #ef8a1b}
.card.mem h2{color:#c96b06}
.card.todo{border-left:6px solid #2f6fe0}
.card.todo h2{color:#2359bd}
.card.today{border-left:6px solid #d4a017}
.card.today h2{color:#9d7405}
.card.soon{border-left:6px solid #4aa96c}
.card.soon h2{color:#317a4c}
.card.misc{border-left:6px solid #9aa3b2}
.card.misc h2{color:#68707e}
.card.advice{border-left:6px solid #7b3fd4}
.card.advice h2{color:#6229bd}
.card.src{border-left:6px solid #9aa3b2}
.card.src h2{color:#68707e}
ul.l{list-style:none;margin:0;padding:0}
ul.l li{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-top:1px solid #eef0f4}
ul.l li:first-child{border-top:none}
label{display:flex;align-items:flex-start;gap:8px;flex:1;cursor:pointer;min-width:0}
label input{margin:5px 0 0;width:17px;height:17px;flex:none;accent-color:#2f6fe0}
.memo{font-size:24px;width:30px;text-align:center;flex:none;line-height:1.2}
.mtxt{flex:1;min-width:0}
.nm{font-weight:800}
.sub{display:block;font-size:12px;color:#6d7686;margin-top:2px}
.lv{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:#c22c22;
 border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.lv.s{background:#c96b06}
.over{color:#c22c22;font-weight:800}
.pri{display:inline-block;font-size:12px;font-weight:800;width:24px;text-align:center;flex:none}
.nlink{flex:none;font-size:12px;color:#2359bd;text-decoration:none;white-space:nowrap;
 border:1px solid #cfdcf5;border-radius:7px;padding:2px 8px;background:#f3f7ff;align-self:center}
.nlink:hover{background:#e5eeff}
label.done .mtxt{text-decoration:line-through;color:#9aa3b2}
label.done .memo{filter:grayscale(1);opacity:.35}
label.done .over{color:#9aa3b2}
.prog{font-size:13px;font-weight:700;color:#2359bd;margin-top:10px}
.advice p{margin:0 0 10px}
.advice p:last-child{margin-bottom:0}
.advice strong{background:linear-gradient(transparent 62%,#ffe9a8 62%)}
table.cal{width:100%;border-collapse:collapse;font-size:14px}
table.cal td{padding:5px 6px;border-top:1px solid #eef0f4;vertical-align:top}
table.cal td.t{white-space:nowrap;font-weight:700;color:#2359bd;width:1%}
.srcs{margin:0;padding-left:18px;font-size:13px;color:#4a5262}
.srcs li{margin-bottom:4px}
.srcs a{color:#2359bd}
.note{font-size:12px;color:#6d7686;margin-top:8px}
#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#232a4d,#4a2a63);
 display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
#lockbox{background:#fff;border-radius:16px;padding:28px 24px;max-width:360px;width:100%;
 text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#lockbox h2{margin:0 0 4px;font-size:20px}
#lockdate{font-size:13px;color:#6d7686;margin-bottom:16px}
#lockbox input{width:100%;padding:11px 12px;font-size:16px;border:1px solid #ccd3e0;
 border-radius:9px;margin-bottom:10px}
#lockbox button{width:100%;padding:11px;font-size:16px;font-weight:800;color:#fff;border:none;
 border-radius:9px;background:linear-gradient(135deg,#3b4bd8,#7b3fd4);cursor:pointer}
#lockerr{color:#c22c22;font-size:13px;margin-top:10px;min-height:18px}
@media(max-width:520px){h1{font-size:22px}.card{padding:14px}.memo{font-size:21px;width:26px}}
</style>

var SKEY="brief-2026-08-27";
function b2u(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||"{}");}catch(e){return {};}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s));}catch(e){}}
function refresh(){
  var boxes=document.querySelectorAll('#content input[type=checkbox]');
  var self=0,mem=0,rest=0;
  for(var i=0;i<boxes.length;i++){
    var b=boxes[i],id=b.getAttribute('data-id')||'';
    if(!b.checked){
      rest++;
      if(id.indexOf('self-')===0)self++;
      else if(id.indexOf('mem-')===0)mem++;
    }
  }
  var hp=100-self*10-mem*5; if(hp<0)hp=0; if(hp>100)hp=100;
  var v=document.getElementById('hpval'),f=document.getElementById('hpfill'),c=document.getElementById('hpcalc');
  if(v)v.textContent=hp;
  if(f){f.style.width=hp+'%';f.className='hpfill '+(hp>=80?'ok':(hp>=50?'warn':'bad'));}
  if(c)c.textContent='自分の期限切れ '+self+'件 ×-10 ／ メンバー切れ '+mem+'件 ×-5 ／ 毎朝100にリセット';
  var p=document.getElementById('prog');
  if(p)p.textContent=rest>0?('残り '+rest+' 件'):'全部やりきった！';
}
function wire(){
  var st=loadState();
  var boxes=document.querySelectorAll('#content input[type=checkbox]');
  for(var i=0;i<boxes.length;i++){
    (function(b){
      var id=b.getAttribute('data-id');
      if(st[id]){b.checked=true;}
      if(b.parentNode)b.parentNode.classList.toggle('done',b.checked);
      b.addEventListener('change',function(){
        var s=loadState(); s[id]=b.checked; saveState(s);
        if(b.parentNode)b.parentNode.classList.toggle('done',b.checked);
        refresh();
      });
    })(boxes[i]);
  }
  refresh();
}
async function unlock(){
  var err=document.getElementById('lockerr');
  err.textContent='復号中…';
  try{
    var e=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',e.encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
    var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(ENC.iv)},k,b2u(ENC.ct));
    document.getElementById('content').innerHTML=new TextDecoder().decode(pt);
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(x){ err.textContent='パスフレーズが違います'; }
}
document.getElementById('go').addEventListener('click',unlock);
document.getElementById('pw').addEventListener('keydown',function(ev){if(ev.key==='Enter')unlock();});
</script>
