<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#1f2430;--sub:#6b7280;--red:#dc2626;--redbg:#fef2f2;--org:#ea580c;--orgbg:#fff7ed;--grn:#16a34a;--yel:#ca8a04;--line:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;line-height:1.7;font-size:15px}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 60px}
header{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 50%,#db2777 100%);color:#fff;padding:26px 20px 22px;border-radius:0 0 20px 20px;box-shadow:0 6px 20px rgba(0,0,0,.14)}
header .date{font-size:13px;opacity:.9;letter-spacing:.06em}
header h1{margin:4px 0 14px;font-size:23px;letter-spacing:.02em}
.hp{background:rgba(255,255,255,.18);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.hprow{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
.hpbar{height:14px;background:rgba(0,0,0,.25);border-radius:8px;overflow:hidden}
.hpfill{height:100%;width:0;border-radius:8px;transition:width .4s ease}
.hpfill.ok{background:linear-gradient(90deg,#22c55e,#4ade80)}
.hpfill.warn{background:linear-gradient(90deg,#eab308,#fde047)}
.hpfill.bad{background:linear-gradient(90deg,#dc2626,#f87171)}
.hpnote{font-size:11px;opacity:.85;margin-top:6px}
.quote{background:rgba(255,255,255,.14);border-left:4px solid rgba(255,255,255,.7);border-radius:0 10px 10px 0;padding:10px 14px}
.quote .q{font-size:15px;font-weight:700}
.quote .s{font-size:12px;opacity:.88;margin-top:4px}
.card{background:var(--card);border-radius:16px;padding:18px 18px 14px;margin-top:18px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card h2{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
.card.self{border-left:6px solid var(--red);background:var(--redbg)}
.card.mem{border-left:6px solid var(--org);background:var(--orgbg)}
.card.boss{background:#2a0d12;color:#ffe4e6;border:2px solid #9f1239}
.card.boss h2{color:#fecdd3}
.card.boss .bosswrap{display:flex;align-items:center;gap:14px}
.bossemo{font-size:30px;line-height:1}
.card.boss .bname{font-size:17px;font-weight:800}
.card.boss .bmeta{font-size:13px;opacity:.85;margin-top:3px}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
ul.list li:last-child{border-bottom:none}
label{flex:1;display:flex;align-items:flex-start;gap:8px;cursor:pointer}
label input{margin-top:5px;width:17px;height:17px;flex:none;accent-color:#4f46e5}
.memo{font-size:24px;width:30px;text-align:center;flex:none;line-height:1.3}
.mtxt{flex:1}
.lv{display:inline-block;background:#111827;color:#fff;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:700;margin-right:6px;vertical-align:1px}
.over{color:var(--red);font-weight:800}
.sub{color:var(--sub);font-size:12.5px;display:block;margin-top:2px}
label.done .mtxt{text-decoration:line-through;opacity:.5}
label.done .memo{filter:grayscale(1);opacity:.35}
.nlink{flex:none;font-size:12px;color:#4f46e5;text-decoration:none;border:1px solid #c7d2fe;border-radius:8px;padding:2px 8px;background:#eef2ff;white-space:nowrap;align-self:center}
.pri{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:700;margin-right:6px;flex:none}
.p1{background:#fee2e2;color:#b91c1c}.p2{background:#fef3c7;color:#92400e}.p3{background:#dcfce7;color:#166534}
#prog{font-size:12.5px;color:var(--sub);margin-top:10px;font-weight:700}
.plain li{padding:5px 0;border-bottom:1px dashed var(--line);display:block}
.plain li:last-child{border-bottom:none}
.tag{display:inline-block;background:#eef2ff;color:#4338ca;border-radius:6px;padding:0 7px;font-size:11.5px;margin-right:6px}
.tag.gm{background:#fef2f2;color:#b91c1c}
.tag.cal{background:#ecfeff;color:#0e7490}
.card.note{background:#f0f9ff;border-left:6px solid #0284c7}
a{color:#4f46e5}
#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#312e81,#7c3aed);display:flex;align-items:center;justify-content:center;z-index:99}
.lockbox{background:#fff;border-radius:16px;padding:26px 24px;width:300px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.lockbox h3{margin:0 0 14px;font-size:16px}
.lockbox input{width:100%;padding:10px;font-size:15px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px}
.lockbox button{width:100%;padding:10px;font-size:15px;font-weight:700;border:none;border-radius:9px;background:#4f46e5;color:#fff;cursor:pointer}
#lockerr{color:var(--red);font-size:12.5px;margin-top:8px;min-height:18px}

</style>
</head>
<body>
<div id="content"></div>
<div id="lockgate">
  <div class="lockbox">
    <h3>🔒 朝ブリーフ</h3>
    <input type="password" id="pw" placeholder="パスフレーズ" autocomplete="off">
    <button id="go">開く</button>
    <div id="lockerr"></div>
  </div>
</div>

  var hp=100-self*10-mem*5; if(hp<0)hp=0; if(hp>100)hp=100;
  var f=document.getElementById('hpfill'),v=document.getElementById('hpval');
  if(f&&v){f.style.width=hp+'%';f.className='hpfill '+(hp>=80?'ok':(hp>=50?'warn':'bad'));v.textContent=hp+' / 100';}
  var p=document.getElementById('prog');
  if(p) p.textContent = left===0 ? '全部やりきった！' : ('残り '+left+' 件');
}
function wire(){
  var st=loadState();
  document.querySelectorAll('#content input[type=checkbox]').forEach(function(b){
    var id=b.getAttribute('data-id');
    if(st[id]) b.checked=true;
    b.addEventListener('change',function(){
      var s=loadState(); if(b.checked){s[id]=1}else{delete s[id]} saveState(s); refresh();
    });
  });
  refresh();
}
function b642buf(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
async function unlock(){
  var pw=document.getElementById('pw').value;
  var err=document.getElementById('lockerr');
  err.textContent='復号中…';
  try{
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b642buf(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b642buf(ENC.iv)},key,b642buf(ENC.ct));
    document.getElementById('content').innerHTML=new TextDecoder().decode(pt);
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){ err.textContent='パスフレーズが違います'; }
}
document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('go').addEventListener('click',unlock);
  document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')unlock();});
  document.getElementById('pw').focus();
});

</script>
