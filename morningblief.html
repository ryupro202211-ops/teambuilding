<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef1f6;color:#1f2430;
 font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
 line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 60px}
header{background:linear-gradient(135deg,#4a5fd0 0%,#7b4bd8 55%,#b8459c 100%);
 color:#fff;padding:26px 20px 22px;border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(60,40,120,.25)}
header .inner{max-width:820px;margin:0 auto}
.date{font-size:13px;opacity:.9;letter-spacing:.08em}
h1{margin:4px 0 16px;font-size:26px;letter-spacing:.02em}
.hpwrap{background:rgba(255,255,255,.16);border-radius:14px;padding:12px 14px}
.hprow{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;margin-bottom:6px}
.hpnum{font-size:20px;font-weight:700}
.hpbar{height:14px;background:rgba(0,0,0,.22);border-radius:9px;overflow:hidden}
.hpfill{height:100%;width:0;border-radius:9px;transition:width .35s ease,background .35s ease}
.hpfill.ok{background:linear-gradient(90deg,#4ade80,#22c55e)}
.hpfill.warn{background:linear-gradient(90deg,#fde047,#f59e0b)}
.hpfill.bad{background:linear-gradient(90deg,#fb7185,#e11d48)}
.hpmemo{font-size:11.5px;opacity:.85;margin-top:6px}
.quote{margin-top:14px;background:rgba(255,255,255,.14);border-left:4px solid rgba(255,255,255,.6);
 border-radius:0 12px 12px 0;padding:11px 14px}
.quote .q{font-size:15.5px;font-weight:600}
.quote .s{font-size:12px;opacity:.88;margin-top:5px}
.card{background:#fff;border-radius:16px;padding:16px 18px;margin-top:16px;box-shadow:0 2px 10px rgba(30,40,80,.08)}
.card h2{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:7px}
.card.boss{background:#2b1116;color:#ffe9ec;border:2px solid #7f1d2c;box-shadow:0 4px 18px rgba(120,10,30,.35)}
.card.boss h2{color:#ff9db0}
.card.fire{border-left:6px solid #e11d48}
.card.mem{border-left:6px solid #f97316}
.card.todo{border-left:6px solid #2563eb}
.card.today{border-left:6px solid #d97706}
.card.next{border-left:6px solid #0891b2}
.card.other{border-left:6px solid #94a3b8}
.card.advice{border-left:6px solid #7c3aed}
.card.src{border-left:6px solid #64748b}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-top:1px solid #eef0f5}
ul.list li:first-child{border-top:0}
.card.boss ul.list li{border-top-color:#4a1c25}
label{flex:1;display:flex;align-items:flex-start;gap:8px;cursor:pointer}
label input{margin-top:5px;width:17px;height:17px;flex:none;accent-color:#2563eb}
.memo{font-size:24px;width:30px;text-align:center;flex:none;line-height:1.2}
.bossemo{font-size:30px;margin-right:6px}
.mtxt{flex:1}
.lv{display:inline-block;font-size:12px;font-weight:700;background:#e11d48;color:#fff;
 border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.over{color:#e11d48;font-weight:700}
.card.boss .over{color:#ff8095}
.who{font-weight:700}
.sub{font-size:12.5px;color:#6b7280;display:block;margin-top:2px}
.card.boss .sub{color:#d7a8b2}
label.done .mtxt{text-decoration:line-through;opacity:.5}
label.done .memo{filter:grayscale(1);opacity:.35}
.nlink{font-size:12px;color:#2563eb;text-decoration:none;white-space:nowrap;flex:none;padding-top:6px}
.nlink:hover{text-decoration:underline}
.pri{display:inline-block;font-size:12px;border-radius:6px;padding:1px 7px;margin-right:6px;font-weight:700}
.p1{background:#fee2e2;color:#b91c1c}
.p2{background:#fef3c7;color:#a16207}
.p3{background:#dcfce7;color:#15803d}
.none{color:#64748b;font-size:14px;margin:2px 0}
#prog{font-size:13px;color:#2563eb;font-weight:700;margin-top:10px}
.card.src a{color:#2563eb;font-size:13px;word-break:break-all}
.card.src li{display:list-item;border:0;padding:3px 0}
.card.src ul{margin:0;padding-left:1.2em;font-size:13px}
.adv p{margin:0 0 9px;font-size:14.5px}
.adv p:last-child{margin-bottom:0}
#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#3b3f6b,#6b3f7a);
 display:flex;align-items:center;justify-content:center;z-index:99;padding:20px}
.lockbox{background:#fff;border-radius:18px;padding:26px 24px;width:100%;max-width:340px;text-align:center;
 box-shadow:0 12px 40px rgba(0,0,0,.3)}
.lockbox h2{margin:0 0 4px;font-size:20px}
#lockdate{font-size:13px;color:#6b7280;margin-bottom:16px}
.lockbox input{width:100%;padding:11px 12px;font-size:16px;border:1.5px solid #d1d5db;border-radius:10px;text-align:center}
.lockbox button{width:100%;margin-top:10px;padding:11px;font-size:15px;font-weight:700;color:#fff;border:0;
 border-radius:10px;background:linear-gradient(135deg,#4a5fd0,#8b45c8);cursor:pointer}
.lockbox button:disabled{opacity:.6}
#err{color:#e11d48;font-size:13px;min-height:19px;margin-top:8px}
</style>
</head>
<body>
<div id="lockgate"><div class="lockbox">
<h2>🔒 朝ブリーフ</h2>
<div id="lockdate">2026年8月31日（月）</div>
<input type="password" id="pw" placeholder="パスフレーズ" autocomplete="off">
<button id="go">開く</button>
<div id="err"></div>
</div></div>
<div id="content"></div>

    var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(ENC.salt), iterations:ENC.it, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.iv)}, key, b64(ENC.ct));
    document.getElementById('content').innerHTML = new TextDecoder().decode(pt);
    document.getElementById('lockgate').style.display = 'none';
    wire();
  } catch(e) {
    err.textContent = 'パスフレーズが違います';
    btn.disabled = false; btn.textContent = '開く';
  }
}
document.getElementById('go').addEventListener('click', unlock);
document.getElementById('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') unlock(); });
</script>
