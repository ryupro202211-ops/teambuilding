<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:0 0 40px;background:#f5f6fa;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:#1f2937;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
.hdr{background:linear-gradient(135deg,#4f46e5,#9333ea 55%,#db2777);color:#fff;padding:26px 18px 22px;border-radius:0 0 22px 22px;box-shadow:0 6px 22px rgba(79,70,229,.28)}
.hdr .d{font-size:13px;opacity:.9;letter-spacing:.04em}
.hdr h1{margin:4px 0 14px;font-size:22px;font-weight:900;letter-spacing:.02em}
.hpbox{background:rgba(255,255,255,.16);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.hprow{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800}
.hpbar{flex:1;height:14px;background:rgba(0,0,0,.22);border-radius:99px;overflow:hidden}
.hpfill{height:100%;border-radius:99px;transition:width .35s}
.hpfill.ok{background:linear-gradient(90deg,#34d399,#10b981)}
.hpfill.warn{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.hpfill.bad{background:linear-gradient(90deg,#f87171,#ef4444)}
.hpnote{font-size:11px;opacity:.85;margin-top:6px}
.quote{background:rgba(255,255,255,.14);border-left:4px solid #fde68a;border-radius:10px;padding:10px 14px;font-size:14px}
.quote .src{display:block;margin-top:6px;font-size:12px;opacity:.85;text-align:right}
.card{background:#fff;border-radius:16px;padding:16px 16px 14px;margin:16px 0;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card h2{margin:0 0 10px;font-size:16px;font-weight:900;letter-spacing:.02em}
.card.boss{background:linear-gradient(160deg,#3b0d17,#601827);color:#fee2e2;border:2px solid #b91c1c}
.card.boss h2{color:#fecaca}
.card.self{border-left:6px solid #ef4444}
.card.mem{border-left:6px solid #f59e0b}
ul.lst{list-style:none;margin:0;padding:0}
ul.lst li{display:flex;align-items:flex-start;gap:6px;padding:7px 0;border-bottom:1px dashed #e5e7eb}
ul.lst li:last-child{border-bottom:none}
label{flex:1;display:flex;align-items:flex-start;gap:8px;cursor:pointer}
label input{margin-top:5px;width:17px;height:17px;flex:none;accent-color:#6366f1}
.memo{font-size:24px;width:30px;text-align:center;flex:none;line-height:1.2}
.mtxt{flex:1;font-size:14px}
label.done .mtxt{text-decoration:line-through;opacity:.45}
label.done .memo{filter:grayscale(1);opacity:.35}
.lv{display:inline-block;background:#7f1d1d;color:#fff;font-size:12px;font-weight:900;border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:1px}
.card.boss .lv{background:#fecaca;color:#7f1d1d}
.over{color:#dc2626;font-weight:900}
.card.boss .over{color:#fca5a5}
.nlink{flex:none;font-size:11px;color:#4f46e5;text-decoration:none;background:#eef2ff;border:1px solid #e0e7ff;border-radius:8px;padding:3px 8px;white-space:nowrap;align-self:center}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 6px;border-bottom:1px solid #eceef2;text-align:left;vertical-align:top}
th{background:#f8fafc;font-size:12px;color:#64748b;font-weight:800}
.pri{font-weight:900;white-space:nowrap;font-size:12px}
.p1{color:#dc2626}.p2{color:#d97706}.p3{color:#059669}
.sub{font-size:12px;color:#6b7280}
.bossemo{font-size:30px;vertical-align:-4px;margin-right:6px}
.bosstitle{font-size:17px;font-weight:900;margin:2px 0 6px}
#prog{font-size:12px;font-weight:800;color:#4338ca;background:#eef2ff;border-radius:99px;padding:3px 12px;display:inline-block;margin-top:8px}
a{color:#4f46e5}
.srclist{font-size:12px;word-break:break-all}
.srclist li{padding:4px 0}
.cal{font-size:13.5px}
.cal li{padding:5px 0;border-bottom:1px dashed #e5e7eb;display:block}
.cal li:last-child{border-bottom:none}
.tm{font-weight:900;color:#4338ca;margin-right:8px}
</style>
<style>
#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#4f46e5,#9333ea 55%,#db2777);display:flex;align-items:center;justify-content:center;z-index:9999}
#lockbox{background:#fff;border-radius:18px;padding:28px 24px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3);width:min(340px,90vw)}
#lockbox h2{margin:0 0 8px;font-size:19px;font-weight:900;color:#1f2937}
#lockdate{display:inline-block;margin:0 0 12px;padding:5px 14px;border-radius:999px;background:linear-gradient(135deg,#eef2ff,#faf5ff);color:#4338ca;font-size:13px;font-weight:800;letter-spacing:.02em;border:1px solid #e0e7ff}
#pw{width:100%;padding:11px 12px;border:2px solid #e5e7eb;border-radius:10px;font-size:16px;margin-bottom:10px;box-sizing:border-box}
#pw:focus{outline:none;border-color:#6366f1}
#go{width:100%;padding:11px;border:none;border-radius:10px;background:linear-gradient(135deg,#4f46e5,#9333ea);color:#fff;font-size:15px;font-weight:900;cursor:pointer}
#err{color:#dc2626;font-size:13px;font-weight:700;margin-top:10px;min-height:18px}
</style>
</head>

<div id="content"></div>
<div id="lockgate"><div id="lockbox">

<input id="pw" type="password" placeholder="パスフレーズ" autocomplete="off">
<button id="go">開く</button>

const SKEY='brief-2026-08-25';
function b2a(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0));}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}');}catch(e){return {};}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s));}catch(e){}}
function refresh(){
  var b=document.querySelectorAll('#content input[type=checkbox]');
  var self=0,mem=0,todo=0,done=0;
  b.forEach(function(x){
    var id=x.dataset.id||'';
    if(x.checked){x.closest('label').classList.add('done');}else{x.closest('label').classList.remove('done');}
    if(id.indexOf('self-')===0&&!x.checked)self++;
    if(id.indexOf('mem-')===0&&!x.checked)mem++;
    if(id.indexOf('td-')===0){todo++;if(x.checked)done++;}
  });
  var hp=Math.max(0,Math.min(100,100-self*10-mem*5));
  var f=document.getElementById('hpfill'),v=document.getElementById('hpval');
  if(f){f.style.width=hp+'%';f.className='hpfill '+(hp>=80?'ok':(hp>=50?'warn':'bad'));}
  if(v)v.textContent=hp;
  var p=document.getElementById('prog');
  if(p){var r=todo-done;p.textContent=r>0?('残り '+r+' 件'):'全部やりきった！';}
}
function wire(){
  var s=loadState();
  document.querySelectorAll('#content input[type=checkbox]').forEach(function(x){
    if(s[x.dataset.id])x.checked=true;
    x.addEventListener('change',function(){
      var st=loadState();st[x.dataset.id]=x.checked;saveState(st);refresh();
    });
  });
  refresh();
}
async function unlock(){
  var pw=document.getElementById('pw').value,e=document.getElementById('err');
  e.textContent='復号中…';
  try{
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(ENC.iv)},k,b2a(ENC.ct));
    document.getElementById('content').innerHTML=new TextDecoder().decode(pt);
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(x){e.textContent='パスフレーズが違います';}
}
document.getElementById('go').addEventListener('click',unlock);
document.getElementById('pw').addEventListener('keydown',function(ev){if(ev.key==='Enter')unlock();});
