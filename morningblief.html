<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
:root{--bg:#0f1220;--card:#171a2b;--ink:#eef0f7;--sub:#aab0c6;--red:#ff5a5a;--org:#ff9f43;--grn:#39d98a;--yel:#ffd93d;}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#0f1220,#1b1f38);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.hdr{background:linear-gradient(135deg,#5b3df5,#b13bd6 55%,#ff7597);border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.date{font-size:13px;opacity:.9}
.title{font-size:24px;font-weight:800;margin:2px 0 12px}
.hpbox{background:rgba(0,0,0,.22);border-radius:14px;padding:12px}
.hplabel{font-weight:700;font-size:14px;margin-bottom:6px}
.hpbar{height:16px;background:rgba(255,255,255,.18);border-radius:10px;overflow:hidden}
.hpfill{height:100%;border-radius:10px;transition:width .4s}
.hpfill.ok{background:linear-gradient(90deg,#39d98a,#7bed9f)}
.hpfill.warn{background:linear-gradient(90deg,#ffd93d,#ff9f43)}
.hpfill.bad{background:linear-gradient(90deg,#ff5a5a,#ff2e63)}
.hpnote{font-size:11px;opacity:.85;margin-top:6px}
.quote{margin-top:14px;font-size:15px;font-weight:600;background:rgba(255,255,255,.12);padding:10px 12px;border-radius:12px}
.quote span{display:block;font-size:12px;opacity:.85;margin-top:4px;text-align:right}
.card{background:var(--card);border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.card h2{margin:0 0 10px;font-size:17px}
.card.danger{border:1px solid rgba(255,90,90,.5)}
.card.warncard{border:1px solid rgba(255,159,67,.5)}
.card.advice{background:linear-gradient(135deg,#1c2140,#232a52)}
ul.tlist{list-style:none;margin:0;padding:0}
ul.tlist li{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
ul.tlist li:last-child{border-bottom:none}
ul.tlist label{display:flex;align-items:flex-start;gap:8px;flex:1;cursor:pointer}
ul.tlist input{margin-top:5px;width:17px;height:17px;flex:none}
.memo{font-size:24px;width:30px;text-align:center;flex:none}
.mtxt{flex:1}
.lv{display:inline-block;background:#3a2140;color:#ffb3d1;font-size:11px;font-weight:700;padding:1px 7px;border-radius:8px;margin-left:4px}
.over{color:var(--red);font-weight:800}
label.done .mtxt{text-decoration:line-through;opacity:.5}
label.done .memo{filter:grayscale(1);opacity:.35}
.nlink{font-size:12px;color:#8ab4ff;text-decoration:none;white-space:nowrap;margin-top:6px}
.badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:8px;flex:none;margin-top:2px}
.badge.red{background:rgba(255,90,90,.2);color:#ff8f8f}
.badge.yellow{background:rgba(255,217,61,.18);color:#ffe27a}
.badge.green{background:rgba(57,217,138,.18);color:#7bed9f}
.plain{margin:0;padding-left:18px}
.plain li{padding:3px 0}
.none{color:var(--sub);font-size:14px;margin:4px 0}
.mini{font-size:11px;color:var(--sub);margin-top:6px}
.sched{margin-top:10px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px;font-size:13px}
.sched b{display:block;margin-bottom:4px}
a{color:#8ab4ff}
#lockgate{position:fixed;inset:0;background:linear-gradient(160deg,#0f1220,#1b1f38);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50;padding:20px;text-align:center}
#lockgate h1{font-size:20px;margin:0}
#lockgate input{font-size:16px;padding:10px 14px;border-radius:10px;border:1px solid #444;background:#11142a;color:#fff;width:min(320px,90vw)}
#lockgate button{font-size:15px;font-weight:700;padding:10px 22px;border-radius:10px;border:none;background:linear-gradient(135deg,#5b3df5,#ff7597);color:#fff;cursor:pointer}
#lockerr{color:#ff8f8f;font-size:13px;min-height:16px}
</style>
</head>
<body>
<div id="content"></div>
<div id="lockgate">
  <h1>🔒 朝ブリーフ</h1>
  <div>パスフレーズを入力してください</div>
  <input id="pw" type="password" placeholder="パスフレーズ" autofocus>
  <button id="openbtn">開く</button>
  <div id="lockerr"></div>
</div>

const SKEY="brief-2026-08-03";
function b2a(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0));}
async function decrypt(pass){
  const salt=b2a(ENC.salt),iv=b2a(ENC.iv),ct=b2a(ENC.ct);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return new TextDecoder().decode(pt);
}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){return{}}}
function saveState(s){localStorage.setItem(SKEY,JSON.stringify(s))}
function refresh(){
  const boxes=[...document.querySelectorAll('#content input[type=checkbox]')];
  let self=0,mem=0;
  boxes.forEach(b=>{const id=b.dataset.id||'';if(b.checked)return;if(id.startsWith('self-'))self++;else if(id.startsWith('mem-'))mem++;});
  let hp=100-self*10-mem*5;hp=Math.max(0,Math.min(100,hp));
  const fill=document.getElementById('hpfill'),val=document.getElementById('hpval');
  if(fill&&val){val.textContent=hp;fill.style.width=hp+'%';fill.className='hpfill '+(hp>=80?'ok':hp>=50?'warn':'bad');}
  const total=boxes.length,done=boxes.filter(b=>b.checked).length,left=total-done;
  const prog=document.getElementById('prog');
  if(prog)prog.textContent=left===0?'全部やりきった！':('残り '+left+' 件');
}
function wire(){
  const st=loadState();
  document.querySelectorAll('#content input[type=checkbox]').forEach(b=>{
    const id=b.dataset.id;
    if(st[id]){b.checked=true;b.closest('label').classList.add('done');}
    b.addEventListener('change',()=>{
      const s=loadState();s[id]=b.checked;saveState(s);
      b.closest('label').classList.toggle('done',b.checked);
      refresh();
    });
  });
  refresh();
}
async function tryOpen(){
  const pw=document.getElementById('pw').value;
  const err=document.getElementById('lockerr');err.textContent='解読中…';
  try{
    const htmlStr=await decrypt(pw);
    document.getElementById('content').innerHTML=htmlStr;
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){err.textContent='パスフレーズが違います';}
}
document.getElementById('openbtn').addEventListener('click',tryOpen);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryOpen();});
