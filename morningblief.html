<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
  :root{--red:#e5484d;--org:#f5a524;--grn:#30a46c;--ink:#1f2430;--bg:#f4f6fb;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;background:var(--bg);color:var(--ink);}
  .wrap{max-width:780px;margin:0 auto;padding:0 14px 60px;}
  .hd{background:linear-gradient(135deg,#5b7cfa 0%,#8a5bfa 55%,#c15bfa 100%);color:#fff;border-radius:0 0 22px 22px;padding:22px 20px 26px;box-shadow:0 6px 20px rgba(90,90,180,.25);}
  .hd .date{opacity:.9;font-size:14px;}
  .hd h1{margin:4px 0 14px;font-size:24px;}
  .hpbox{background:rgba(255,255,255,.16);border-radius:12px;padding:10px 12px;}
  .hplabel{font-weight:700;font-size:14px;margin-bottom:6px;}
  .hpbar{height:16px;background:rgba(0,0,0,.18);border-radius:9px;overflow:hidden;}
  .hpfill{height:100%;width:100%;border-radius:9px;transition:width .5s,background .5s;}
  .hpfill.ok{background:#30d158;}.hpfill.warn{background:#ffd60a;}.hpfill.bad{background:#ff453a;}
  .hpnote{font-size:11px;opacity:.85;margin-top:5px;}
  .quote{margin-top:16px;font-size:15px;line-height:1.6;font-weight:600;}
  .quote span{display:block;font-size:12px;opacity:.85;margin-top:4px;font-weight:400;}
  .card{background:#fff;border-radius:16px;padding:16px 18px;margin-top:16px;box-shadow:0 2px 10px rgba(40,50,90,.06);}
  .card h2{margin:0 0 12px;font-size:17px;}
  .card.danger{border-left:5px solid var(--red);}
  .card.warnc{border-left:5px solid var(--org);}
  .card.advice{background:#fffdf5;border-left:5px solid var(--org);}
  .tasklist{list-style:none;margin:0;padding:0;}
  .tasklist li{display:flex;align-items:flex-start;gap:6px;padding:8px 0;border-bottom:1px dashed #e6e8f0;}
  .tasklist li:last-child{border-bottom:none;}
  .tasklist label{flex:1;display:flex;align-items:flex-start;gap:8px;cursor:pointer;line-height:1.5;}
  .tasklist input{margin-top:3px;width:17px;height:17px;flex:none;}
  .memo{font-size:24px;width:30px;text-align:center;flex:none;line-height:1.2;}
  .mtxt{flex:1;font-size:14px;}
  .mtxt b{color:var(--red);}
  .lv{display:inline-block;background:#2b2f3a;color:#fff;font-size:12px;border-radius:6px;padding:1px 6px;margin:0 3px;vertical-align:middle;}
  .mtxt em{font-style:normal;font-size:11px;color:#8a90a2;margin-left:6px;}
  .pri{font-size:12px;font-weight:700;margin-right:5px;}
  .pri.red{color:var(--red);}.pri.yel{color:#c98600;}.pri.grn{color:var(--grn);}
  label.done .mtxt{text-decoration:line-through;opacity:.45;}
  label.done .memo{filter:grayscale(1);opacity:.35;}
  .nlink{font-size:12px;color:#5b7cfa;text-decoration:none;white-space:nowrap;margin-top:3px;}
  .nlink:hover{text-decoration:underline;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{border:1px solid #e6e8f0;padding:7px 8px;text-align:left;}
  th{background:#f2f4fa;}
  .plain{margin:0;padding-left:18px;line-height:1.7;font-size:14px;}
  .plain li{margin:3px 0;}
  .mini{font-size:12px;color:#8a90a2;margin:8px 0 0;}
  .prog{text-align:center;font-weight:700;color:#5b7cfa;margin-top:20px;font-size:14px;}
  #lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#5b7cfa,#8a5bfa);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;z-index:99;}
  #lockgate h2{margin:0;font-size:20px;}
  #lockgate input{padding:11px 14px;border-radius:10px;border:none;font-size:16px;width:220px;text-align:center;}
  #lockgate button{padding:11px 26px;border-radius:10px;border:none;background:#fff;color:#5b7cfa;font-weight:700;font-size:15px;cursor:pointer;}
  #lockerr{color:#ffd0d0;font-size:13px;min-height:18px;}
  </style>
</head>
<body>
<div id="content"></div>
<div id="lockgate">
  <h2>🔒 朝ブリーフ</h2>
  <input id="pass" type="password" placeholder="パスフレーズ" autocomplete="off">
  <button id="openbtn">開く</button>
  <div id="lockerr"></div>
</div>

const SKEY = "brief-2026-08-01";
function b2a(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0));}
async function decrypt(pass){
  const salt=b2a(ENC.salt), iv=b2a(ENC.iv), data=b2a(ENC.ct);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);
  return new TextDecoder().decode(pt);
}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}');}catch(e){return {};}}
function saveState(s){localStorage.setItem(SKEY,JSON.stringify(s));}
function refresh(){
  const boxes=[...document.querySelectorAll('#content input[type=checkbox]')];
  let selPen=0, memPen=0, remain=0;
  boxes.forEach(b=>{
    const id=b.dataset.id||'';
    if(b.checked){b.closest('label').classList.add('done');}
    else{b.closest('label').classList.remove('done'); remain++;}
    if(!b.checked){
      if(id.startsWith('self-')) selPen+=10;
      else if(id.startsWith('mem-')) memPen+=5;
    }
  });
  let hp=100-selPen-memPen; if(hp<0)hp=0; if(hp>100)hp=100;
  const fill=document.getElementById('hpfill'), val=document.getElementById('hpval');
  if(fill&&val){val.textContent=hp;fill.style.width=hp+'%';fill.className='hpfill '+(hp>=80?'ok':hp>=50?'warn':'bad');}
  const prog=document.getElementById('prog');
  if(prog){prog.textContent=remain>0?('残り '+remain+' 件'):'全部やりきった！🎉';}
}
function wire(){
  const st=loadState();
  document.querySelectorAll('#content input[type=checkbox]').forEach(b=>{
    const id=b.dataset.id;
    if(st[id]) b.checked=true;
    b.addEventListener('change',()=>{const s=loadState();s[b.dataset.id]=b.checked;saveState(s);refresh();});
  });
  refresh();
}
async function unlock(){
  const err=document.getElementById('lockerr');
  try{
    const html=await decrypt(document.getElementById('pass').value);
    document.getElementById('content').innerHTML=html;
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){err.textContent='パスフレーズが違います';}
}
document.getElementById('openbtn').addEventListener('click',unlock);
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
</script>
