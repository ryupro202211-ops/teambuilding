<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🔒 朝ブリーフ</title><style>
:root{--bg:#0f1220;--card:#171b2e;--ink:#e8ebf5;--mut:#9aa3c0;--red:#ff5d5d;--org:#ff9f43;--grn:#2ec26b;--yel:#ffd24a;}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#0f1220,#191d33);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.head{background:linear-gradient(135deg,#6a3ffb,#c341d8 55%,#ff6aa2);border-radius:18px;padding:18px 20px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.head h1{margin:0 0 2px;font-size:20px}
.head .d{opacity:.9;font-size:13px;margin-bottom:12px}
.hpwrap{margin-top:4px}
.hpbar{position:relative;height:26px;background:#0c0f1c;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.hpfill{height:100%;transition:width .5s}
.hpfill.ok{background:linear-gradient(90deg,#20c46b,#57e08b)}
.hpfill.warn{background:linear-gradient(90deg,#e0a72e,#ffd24a)}
.hpfill.bad{background:linear-gradient(90deg,#d43b3b,#ff7a7a)}
.hptext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.hpcalc{font-size:11px;color:rgba(255,255,255,.9);margin-top:6px}
.quote{margin-top:12px;background:rgba(0,0,0,.18);border-radius:12px;padding:10px 12px;font-size:14px}
.quote .qs{display:block;margin-top:4px;font-size:12px;opacity:.85}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-top:14px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.card.red{border-left:5px solid var(--red)}
.card.org{border-left:5px solid var(--org)}
.card.boss{background:linear-gradient(135deg,#2a0d12,#4a141c);border:1px solid #7a2230}
.cardh{font-weight:700;font-size:15px;margin-bottom:10px}
.boss-head{font-size:18px;font-weight:800;color:#ff8a8a}
.bossemo{font-size:30px;vertical-align:middle;margin-right:6px}
.boss-body{margin:8px 0;font-size:15px}
.boss-note{font-size:12px;color:var(--mut)}
.od{color:var(--red);font-weight:700}
ul.cl{list-style:none;margin:0;padding:0}
ul.cl li{display:flex;align-items:flex-start;gap:6px;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
ul.cl li label{flex:1;display:flex;align-items:flex-start;gap:7px;cursor:pointer}
.memo{font-size:24px;width:30px;text-align:center;flex:none}
.lv{font-size:12px;background:#2b2f4a;border-radius:8px;padding:2px 6px;flex:none;align-self:center}
.mtxt{flex:1}
.src{font-size:11px;color:var(--mut);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:1px 5px;margin-left:4px}
.nlink{font-size:11px;color:#7db4ff;white-space:nowrap;align-self:center;text-decoration:none}
.hint{font-size:12px;color:var(--org);margin-top:8px}
ul.cl2{margin:4px 0 0;padding-left:18px}
ul.cl2 li{padding:3px 0}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th,.tb td{border-bottom:1px solid rgba(255,255,255,.1);padding:7px 6px;text-align:left;vertical-align:top}
.tb th{color:var(--mut);font-weight:600}
.pri{font-size:12px;white-space:nowrap}
.p1{color:var(--red)} .p2{color:var(--yel)} .p3{color:var(--grn)}
.tb label{display:flex;gap:6px;cursor:pointer}
.cal{margin-bottom:8px}
.sanbo{font-size:13.5px}
label.done .mtxt,label.done b{text-decoration:line-through;opacity:.5}
label.done .memo{filter:grayscale(1);opacity:.35}
#lockgate{position:fixed;inset:0;background:#0f1220;display:flex;align-items:center;justify-content:center;z-index:99}
.gatebox{background:var(--card);padding:26px;border-radius:16px;text-align:center;max-width:320px;width:90%}
.gatebox h2{margin:0 0 14px;font-size:17px}
.gatebox input{width:100%;padding:10px;border-radius:10px;border:1px solid #333;background:#0c0f1c;color:#fff;font-size:15px}
.gatebox button{margin-top:12px;width:100%;padding:10px;border:0;border-radius:10px;background:linear-gradient(135deg,#6a3ffb,#c341d8);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.gerr{color:var(--red);font-size:12px;margin-top:8px;min-height:16px}
</style></head>

const SKEY="brief-2026-08-12";
function b2ab(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function decrypt(pass){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2ab(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2ab(ENC.iv)},key,b2ab(ENC.ct));
  return new TextDecoder().decode(pt);
}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){return {}}}
function saveState(s){localStorage.setItem(SKEY,JSON.stringify(s))}
function refresh(){
  let self=0,mem=0,left=0;
  document.querySelectorAll('#content input[type=checkbox]').forEach(c=>{
    const lab=c.closest('label');
    if(c.checked){lab&&lab.classList.add('done');}else{lab&&lab.classList.remove('done'); if(c.dataset.id.startsWith('self-')||c.dataset.id.startsWith('mem-'))left++;}
    if(!c.checked&&c.dataset.id.startsWith('self-'))self++;
    if(!c.checked&&c.dataset.id.startsWith('mem-'))mem++;
  });
  let hp=100-self*10-mem*5; if(hp<0)hp=0; if(hp>100)hp=100;
  const f=document.querySelector('.hpfill'); const t=document.getElementById('hpval');
  if(f){f.style.width=hp+'%'; f.className='hpfill '+(hp>=80?'ok':(hp>=50?'warn':'bad'));}
  if(t)t.textContent='HP '+hp+'/100';
  const p=document.getElementById('prog'); if(p)p.textContent = left>0?('残り '+left+' 件'):'全部やりきった！';
}
function wire(){
  const st=loadState();
  document.querySelectorAll('#content input[type=checkbox]').forEach(c=>{
    if(st[c.dataset.id])c.checked=true;
    c.addEventListener('change',()=>{const s=loadState();s[c.dataset.id]=c.checked;saveState(s);refresh();});
  });
  refresh();
}
async function open(){
  const pw=document.getElementById('pw').value;
  try{
    const html=await decrypt(pw);
    document.getElementById('content').innerHTML=html;
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){document.getElementById('ge').textContent='パスフレーズが違います';}
}
document.getElementById('opb').addEventListener('click',open);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')open();});
</script>
