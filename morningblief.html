<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🔒 朝ブリーフ</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#222;--sub:#666;--red:#e5484d;--org:#f59e0b;--grn:#16a34a;--ylw:#eab308;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.hd{background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#db2777);color:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 24px rgba(79,70,229,.25)}
.hd .date{font-size:13px;opacity:.9}.hd h1{margin:4px 0 14px;font-size:22px}
.hpwrap{background:rgba(255,255,255,.18);border-radius:12px;padding:12px}
.hpbar{height:18px;border-radius:9px;background:rgba(0,0,0,.18);overflow:hidden}
.hpfill{height:100%;border-radius:9px;transition:width .5s}.hpfill.ok{background:#22c55e}.hpfill.warn{background:#eab308}.hpfill.bad{background:#ef4444}
.hprow{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px}.hpcalc{font-size:11px;opacity:.85;margin-top:6px}
.quote{margin-top:14px;background:rgba(255,255,255,.15);border-left:4px solid #fff;border-radius:8px;padding:10px 12px;font-size:14px}
.card{background:var(--card);border-radius:16px;padding:16px 18px;margin-top:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.card h2{margin:0 0 10px;font-size:16px}
.card.boss{background:#2a0e12;color:#ffd7d7;border:1px solid #7f1d1d}
.sec-self{border-left:5px solid var(--red)}.sec-mem{border-left:5px solid var(--org)}
ul.ck{list-style:none;padding:0;margin:0}
ul.ck li{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
ul.ck li:last-child{border-bottom:none}
ul.ck label{flex:1;display:flex;align-items:flex-start;gap:8px;cursor:pointer}
label.done .mtxt{text-decoration:line-through;color:#aaa}
label.done .memo{filter:grayscale(1);opacity:.35}
.memo{font-size:24px;width:30px;text-align:center;flex:none}
.lv{display:inline-block;background:#ef4444;color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:4px}
.bossemo{font-size:30px}
.mtxt{flex:1}.sub{color:var(--sub);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid var(--line);padding:7px 8px;text-align:left}th{background:#f8fafc}
.pri{font-weight:700;border-radius:6px;padding:1px 7px;color:#fff;font-size:12px}.p1{background:var(--red)}.p2{background:var(--ylw)}.p3{background:var(--grn)}
.nlink{font-size:12px;color:#4f46e5;text-decoration:none;white-space:nowrap;margin-left:8px}
. over{color:var(--red);font-weight:700}
a{color:#4f46e5}.src li{margin:3px 0;font-size:13px}
#prog{font-size:13px;color:var(--sub);margin-top:8px}
</style>
<style>
#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#4f46e5,#db2777);display:flex;align-items:center;justify-content:center;z-index:99}
#lockbox{background:#fff;border-radius:16px;padding:28px;text-align:center;max-width:320px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#lockbox h3{margin:0 0 14px;font-size:18px}
#pw{width:100%;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
#go{margin-top:12px;width:100%;padding:10px;font-size:15px;background:#4f46e5;color:#fff;border:none;border-radius:8px;cursor:pointer}
#err{color:#e5484d;font-size:13px;margin-top:10px;min-height:16px}
</style></head><body>
<div id="content"></div>
<div id="lockgate"><div id="lockbox"><h3>🔒 朝ブリーフ</h3>
<input id="pw" type="password" placeholder="パスフレーズ" autofocus>
<button id="go">開く</button><div id="err"></div></div></div>

const SKEY='brief-2026-07-27';
function b2a(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0));}
async function decrypt(pass){
 const enc=new TextEncoder();
 const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(ENC.iv)},key,b2a(ENC.ct));
 return new TextDecoder().decode(pt);
}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){return {}}}
function saveState(s){localStorage.setItem(SKEY,JSON.stringify(s))}
function refresh(){
 let self=0,mem=0;
 document.querySelectorAll('input[type=checkbox]').forEach(cb=>{
  const id=cb.dataset.id||'';const lab=cb.closest('label');
  if(cb.checked){lab&&lab.classList.add('done')}else{lab&&lab.classList.remove('done');
   if(id.startsWith('self-'))self++;if(id.startsWith('mem-'))mem++;}
 });
 let hp=100-self*10-mem*5;hp=Math.max(0,Math.min(100,hp));
 const f=document.getElementById('hpfill'),v=document.getElementById('hpval');
 if(f&&v){f.style.width=hp+'%';v.textContent=hp+' / 100';f.className='hpfill '+(hp>=80?'ok':hp>=50?'warn':'bad');}
 const todo=[...document.querySelectorAll('input[data-id^=td-]')];
 const left=todo.filter(c=>!c.checked).length;
 const p=document.getElementById('prog');if(p)p.textContent=left===0?'🎉 全部やりきった！':('残り '+left+' 件');
}
function wire(){
 const st=loadState();
 document.querySelectorAll('input[type=checkbox]').forEach(cb=>{
  const id=cb.dataset.id;if(id&&st[id])cb.checked=true;
  cb.addEventListener('change',()=>{const s=loadState();s[cb.dataset.id]=cb.checked;saveState(s);refresh();});
 });
 refresh();
}
async function unlock(){
 const err=document.getElementById('err');err.textContent='';
 try{const h=await decrypt(document.getElementById('pw').value);
  document.getElementById('content').innerHTML=h;
  document.getElementById('lockgate').style.display='none';
  wire();
 }catch(e){err.textContent='パスフレーズが違います';}
}
document.getElementById('go').addEventListener('click',unlock);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
