<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔒 朝ブリーフ</title>
<style>
:root{--red:#e8384f;--org:#f38b2b;--grn:#22b07d;--yel:#f2c037;--ink:#20242c;--sub:#6b7280;--card:#ffffff;--bg:#eef1f6;}
*{box-sizing:border-box;}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;}
.wrap{max-width:760px;margin:0 auto;padding:16px;}
.header{background:linear-gradient(135deg,#5b6cf0 0%,#8b5cf6 55%,#d946a6 100%);color:#fff;border-radius:20px;padding:22px 22px 26px;box-shadow:0 8px 24px rgba(91,108,240,.28);}
.header .date{font-size:13px;opacity:.9;letter-spacing:.05em;}
.header h1{margin:4px 0 14px;font-size:22px;font-weight:800;}
.hpbox{background:rgba(255,255,255,.16);border-radius:14px;padding:12px 14px;}
.hplabel{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700;margin-bottom:6px;}
.hpbar{height:16px;background:rgba(0,0,0,.18);border-radius:10px;overflow:hidden;}
.hpfill{height:100%;border-radius:10px;transition:width .6s ease,background .3s;}
.hpfill.ok{background:#2ee6a0;} .hpfill.warn{background:#ffd152;} .hpfill.bad{background:#ff6b81;}
.hpcalc{font-size:11px;opacity:.9;margin-top:6px;}
.quote{margin-top:14px;background:rgba(255,255,255,.12);border-left:4px solid #fff;border-radius:8px;padding:10px 14px;font-size:14px;}
.quote .src{display:block;margin-top:6px;font-size:12px;opacity:.85;text-align:right;}
.card{background:var(--card);border-radius:16px;padding:16px 18px;margin:14px 0;box-shadow:0 3px 12px rgba(20,36,64,.06);}
.card h2{margin:0 0 12px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;}
.card.boss{background:#3a1418;color:#ffd9de;}
.alert-self{border-left:6px solid var(--red);}
.alert-mem{border-left:6px solid var(--org);}
ul.rows{list-style:none;margin:0;padding:0;}
ul.rows li{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed #e5e7eb;}
ul.rows li:last-child{border-bottom:none;}
label{display:flex;align-items:flex-start;gap:8px;flex:1;cursor:pointer;}
label input{margin-top:4px;width:17px;height:17px;flex:none;}
.memo{font-size:24px;width:30px;text-align:center;flex:none;line-height:1.2;}
.bossemo{font-size:30px;}
.lv{display:inline-block;background:#eef;color:#4338ca;font-size:12px;font-weight:800;border-radius:6px;padding:1px 6px;margin-right:6px;flex:none;}
.card.boss .lv{background:#7f1d24;color:#ffd9de;}
.mtxt{flex:1;}
.mtxt .due{color:var(--red);font-weight:800;}
label.done .mtxt{text-decoration:line-through;color:var(--sub);}
label.done .memo{filter:grayscale(1);opacity:.35;}
.nlink{font-size:12px;color:#4338ca;text-decoration:none;white-space:nowrap;align-self:center;border:1px solid #c7d2fe;border-radius:8px;padding:3px 8px;}
.nlink:hover{background:#eef2ff;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #eef1f6;vertical-align:top;}
th{font-size:12px;color:var(--sub);}
.badge{font-weight:800;font-size:12px;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.b-red{background:#fde8ec;color:var(--red);} .b-yel{background:#fdf3d6;color:#b9860b;} .b-grn{background:#dff5ec;color:var(--grn);}
.li2{list-style:none;margin:0;padding:0;}
.li2 li{padding:6px 0;border-bottom:1px dashed #eef1f6;font-size:14px;}
.li2 li:last-child{border-bottom:none;}
.muted{color:var(--sub);font-size:13px;}
.note{font-size:12.5px;color:var(--sub);margin-top:8px;}
.prog{font-size:13px;font-weight:700;color:#4338ca;margin-top:10px;}
a.src{color:#4338ca;}
.foot{text-align:center;font-size:11px;color:var(--sub);margin:18px 0;}
</style>
<style>
#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#5b6cf0,#8b5cf6 55%,#d946a6);display:flex;align-items:center;justify-content:center;z-index:99;}
#lockcard{background:#fff;border-radius:18px;padding:28px 26px;width:300px;max-width:88vw;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;}
#lockcard h2{margin:0 0 4px;font-size:19px;color:#20242c;}
#lockcard p{margin:0 0 16px;font-size:12.5px;color:#6b7280;}
#pw{width:100%;padding:11px 12px;font-size:15px;border:1.5px solid #d1d5db;border-radius:10px;box-sizing:border-box;}
#openbtn{margin-top:12px;width:100%;padding:11px;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(135deg,#5b6cf0,#8b5cf6);border:none;border-radius:10px;cursor:pointer;}
#err{color:#e8384f;font-size:12.5px;margin-top:10px;min-height:16px;font-weight:700;}
</style>
</head>
<body>
<div id="content"></div>
<div id="lockgate">
  <div id="lockcard">
    <h2>🔒 朝ブリーフ</h2>
    <p>パスフレーズを入力してください</p>
    <input id="pw" type="password" placeholder="パスフレーズ" autocomplete="off">
    <button id="openbtn">開く</button>
    <div id="err"></div>
  </div>
</div>

const SKEY = "brief-2026-08-10";
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function decrypt(pass){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
  return new TextDecoder().decode(pt);
}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}');}catch(e){return {};}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s));}catch(e){}}
function refresh(){
  const boxes=[...document.querySelectorAll('#content input[type=checkbox]')];
  let hp=100, remain=0;
  boxes.forEach(b=>{
    const id=b.dataset.id||'';
    if(!b.checked){
      remain++;
      if(id.startsWith('self-'))hp-=10;
      else if(id.startsWith('mem-'))hp-=5;
    }
  });
  if(hp<0)hp=0; if(hp>100)hp=100;
  const fill=document.getElementById('hpfill');
  const val=document.getElementById('hpval');
  if(fill){fill.style.width=hp+'%';fill.className='hpfill '+(hp>=80?'ok':hp>=50?'warn':'bad');}
  if(val)val.textContent=hp+' / 100';
  const prog=document.getElementById('prog');
  if(prog)prog.textContent=remain===0?'全部やりきった！🎉':('残り '+remain+' 件');
}
function wire(){
  const state=loadState();
  document.querySelectorAll('#content input[type=checkbox]').forEach(b=>{
    const id=b.dataset.id;
    if(state[id])b.checked=true;
    const lab=b.closest('label');
    if(lab)lab.classList.toggle('done',b.checked);
    b.addEventListener('change',()=>{
      const st=loadState();st[id]=b.checked;saveState(st);
      if(lab)lab.classList.toggle('done',b.checked);
      refresh();
    });
  });
  refresh();
}
async function unlock(){
  const err=document.getElementById('err');
  try{
    const html=await decrypt(document.getElementById('pw').value);
    document.getElementById('content').innerHTML=html;
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){err.textContent='パスフレーズが違います';}
}
document.getElementById('openbtn').addEventListener('click',unlock);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
document.getElementById('pw').focus();
</script>
