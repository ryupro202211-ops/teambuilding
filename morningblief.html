<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1f2a44;--sub:#6b7280;--line:#e5e8f0;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.hd{background:linear-gradient(135deg,#4f6ef7,#8b5cf6);color:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(79,110,247,.25)}
.hd .date{font-size:13px;opacity:.9}
.hd h1{margin:4px 0 12px;font-size:22px}
.hpwrap{background:rgba(255,255,255,.25);border-radius:12px;padding:10px 12px}
.hpbar{height:16px;border-radius:9px;background:rgba(0,0,0,.15);overflow:hidden}
.hpfill{height:100%;border-radius:9px;transition:width .4s,background .4s}
.hpfill.ok{background:#38d39f}.hpfill.warn{background:#f7c948}.hpfill.bad{background:#ef5b5b}
.hpmeta{font-size:12px;margin-top:6px;opacity:.95}
.quote-in{background:rgba(255,255,255,.2);border-radius:12px;padding:12px;margin-top:12px;font-size:14px}
.quote-in b{font-size:16px}.qsrc{font-size:12px;opacity:.9}
.card{background:var(--card);border-radius:16px;padding:16px 18px;margin-top:14px;box-shadow:0 4px 14px rgba(31,42,68,.06)}
.card h2{margin:0 0 12px;font-size:17px}
.card.boss{background:#2a0e12;color:#ffd7d7}
.alert{border-radius:12px;padding:12px;margin-bottom:10px}
.alert.self{background:#fff0f0;border:1px solid #ffd0d0}
.alert.mem{background:#fff7ec;border:1px solid #ffe0b8}
.alerthd{font-weight:700;margin-bottom:8px}
ul.cl{list-style:none;margin:0;padding:0}
ul.cl li{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px dashed var(--line)}
ul.cl li:first-child{border-top:none}
ul.cl label{flex:1;display:flex;align-items:center;gap:8px;cursor:pointer}
.memo{font-size:24px;width:30px;text-align:center}
.lv{font-size:12px;font-weight:700;background:#33415522;border-radius:6px;padding:2px 6px;white-space:nowrap}
.mtxt{flex:1}
.od{color:#e11d48;font-weight:700}
label.done{opacity:.5}label.done .mtxt{text-decoration:line-through}
label.done .memo{filter:grayscale(1);opacity:.35}
.nlink{font-size:12px;color:#4f6ef7;text-decoration:none;white-space:nowrap;margin-left:6px}
.note{font-size:12px;color:var(--sub);margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--sub)}
.p{font-size:12px;font-weight:700;white-space:nowrap}
.til{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.til.done span{text-decoration:line-through;opacity:.5}
ul.plain{margin:0;padding-left:18px;font-size:14px}
ul.plain li{margin:4px 0}
.cal{margin-top:10px;background:#f0f3ff;border-radius:10px;padding:10px;font-size:13px}
.src a{color:#4f6ef7}
.verify{margin-top:8px;font-size:12px;color:var(--sub)}
.prog{font-size:13px;margin-top:8px;color:var(--sub)}
</style></head>
<body>
<div class="wrap">
  <div class="hd">
    <div class="date">2026年8月5日（水）</div>
    <h1>🐉 りゅうちゃん 朝ブリーフ</h1>
    <div class="hpwrap">
      <div class="hpbar"><div id="hpfill" class="hpfill" style="width:0%"></div></div>
      <div class="hpmeta"><span id="hpval">HP --</span> ／ <span id="hpbreak"></span></div>
    </div>
  </div>
  <div id="content"></div>
  <div class="card"><div id="prog" class="prog"></div></div>
</div>

<div id="lockgate" style="position:fixed;inset:0;background:#1f2a44;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:9999">
  <div style="color:#fff;font-family:sans-serif;font-size:16px">🔒 パスフレーズを入力</div>
  <input id="pass" type="password" style="padding:10px 14px;border-radius:8px;border:none;font-size:15px;width:220px">
  <button id="open" style="padding:10px 22px;border-radius:8px;border:none;background:#4f6ef7;color:#fff;font-size:15px;cursor:pointer">開く</button>
  <div id="err" style="color:#ff9b9b;font-family:sans-serif;font-size:13px;height:16px"></div>
</div>

const SKEY = "brief-2026-08-05";
const SELF_PEN=10, MEM_PEN=5;
function b2a(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0));}
async function decrypt(pass){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pass),{name:'PBKDF2'},false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(ENC.iv)},key,b2a(ENC.ct));
  return new TextDecoder().decode(pt);
}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){return {}}}
function saveState(s){localStorage.setItem(SKEY,JSON.stringify(s))}
function refresh(){
  const boxes=[...document.querySelectorAll('#content input[type=checkbox]')];
  let self=0,mem=0,selfDone=0,memDone=0,tot=0,done=0;
  boxes.forEach(b=>{
    const id=b.dataset.id||'';
    if(id.startsWith('self-')){self++; if(b.checked)selfDone++;}
    if(id.startsWith('mem-')){mem++; if(b.checked)memDone++;}
    tot++; if(b.checked)done++;
  });
  let hp=100-(self-selfDone)*SELF_PEN-(mem-memDone)*MEM_PEN;
  hp=Math.max(0,Math.min(100,hp));
  const f=document.getElementById('hpfill');
  f.style.width=hp+'%';
  f.className='hpfill '+(hp>=80?'ok':hp>=50?'warn':'bad');
  document.getElementById('hpval').textContent='HP '+hp;
  document.getElementById('hpbreak').textContent='自分の期限切れ '+(self-selfDone)+'件 ×-'+SELF_PEN+' ／ メンバー切れ '+(mem-memDone)+'件 ×-'+MEM_PEN+' ／ 毎朝100にリセット';
  const rem=tot-done;
  document.getElementById('prog').textContent=rem===0?'🎉 全部やりきった！':('残り '+rem+' 件');
}
function wire(){
  const st=loadState();
  document.querySelectorAll('#content input[type=checkbox]').forEach(b=>{
    const id=b.dataset.id;
    if(st[id]){b.checked=true; const l=b.closest('label'); if(l)l.classList.add('done');}
    b.addEventListener('change',()=>{
      const s=loadState(); s[b.dataset.id]=b.checked; saveState(s);
      const l=b.closest('label'); if(l)l.classList.toggle('done',b.checked);
      refresh();
    });
  });
  refresh();
}
async function open(){
  const p=document.getElementById('pass').value;
  try{
    const html=await decrypt(p);
    document.getElementById('content').innerHTML=html;
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){document.getElementById('err').textContent='パスフレーズが違います';}
}
document.getElementById('open').addEventListener('click',open);
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')open();});
</script>
