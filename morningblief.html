<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef1f6;color:#1c2431;
 font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",YuGothic,Meiryo,sans-serif;
 line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header{background:linear-gradient(135deg,#4a5fd0 0%,#7b3fa8 55%,#b83a76 100%);color:#fff;padding:26px 0 30px;box-shadow:0 3px 14px rgba(0,0,0,.18)}
.hd-date{font-size:13px;opacity:.9;letter-spacing:.06em}
header h1{margin:4px 0 16px;font-size:25px;font-weight:800;letter-spacing:.02em}
.hpbox{background:rgba(255,255,255,.16);border-radius:12px;padding:12px 14px}
.hplabel{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
.hplabel .ok{color:#b8ffcf}.hplabel .warn{color:#ffe9a8}.hplabel .bad{color:#ffc2c2}
.hpbar{height:14px;background:rgba(0,0,0,.28);border-radius:8px;overflow:hidden}
.hpbar div{height:100%;transition:width .35s}
.hpbar .ok{background:linear-gradient(90deg,#37d67a,#8ef0b4)}
.hpbar .warn{background:linear-gradient(90deg,#e8a712,#ffd977)}
.hpbar .bad{background:linear-gradient(90deg,#d63a3a,#ff8a8a)}
.hpnote{font-size:11.5px;opacity:.88;margin-top:6px}
.quote{margin-top:16px;font-size:16px;font-weight:700;border-left:4px solid rgba(255,255,255,.65);padding-left:12px}
.qsrc{display:block;font-size:12px;font-weight:400;opacity:.85;margin-top:3px}
.card{background:#fff;border-radius:14px;padding:18px 18px 20px;margin:18px 0;box-shadow:0 2px 10px rgba(30,40,70,.09)}
.card h2{margin:0 0 12px;font-size:17px;font-weight:800;border-bottom:2px solid #eef1f6;padding-bottom:9px}
.card h3.sub{font-size:14px;margin:18px 0 8px;font-weight:800}
h3.sub.self{color:#c0272d}h3.sub.mem{color:#c8630f}
.card.danger{border-left:6px solid #d63a3a}
.card.boss{background:#2a1116;color:#ffe6e6;border-left:6px solid #ff5f5f}
.card.boss h2{border-bottom-color:rgba(255,255,255,.18)}
.bossrow{display:flex;gap:14px;align-items:center}
.bossemo{font-size:30px;line-height:1}
.bossname{font-size:19px;font-weight:800;color:#ff9b9b}
.bosstxt{font-size:14px}
.bossmsg{font-size:13px;opacity:.85;margin:12px 0 0}
.card.advice{border-left:6px solid #4a5fd0}
.card.advice p{font-size:14.5px;margin:0 0 12px}
.card.advice p:last-child{margin-bottom:0}
.hot{background:#ffe9e9;color:#b3232a;font-weight:800;padding:1px 6px;border-radius:5px}
ul.chk{list-style:none;margin:0;padding:0}
ul.chk li{display:flex;align-items:flex-start;gap:8px;border-bottom:1px dashed #e3e7ef;padding:9px 0}
ul.chk li:last-child{border-bottom:none}
ul.chk label{flex:1;display:flex;align-items:flex-start;gap:9px;cursor:pointer}
ul.chk input{margin-top:5px;width:17px;height:17px;flex:none;cursor:pointer}
.memo{font-size:24px;width:30px;text-align:center;flex:none;line-height:1.2}
.mtxt{flex:1;font-size:14px}
.due{font-size:12.5px;color:#c0272d}
.due b{font-weight:800}
.lv{flex:none;font-size:12px;font-weight:800;background:#3a4358;color:#fff;border-radius:9px;padding:1px 8px;height:19px;line-height:17px;margin-top:4px}
label.done .mtxt,label.done .due{text-decoration:line-through;opacity:.45}
label.done .memo{filter:grayscale(1);opacity:.35}
.nlink{flex:none;font-size:11.5px;color:#4a5fd0;text-decoration:none;border:1px solid #ccd4ee;border-radius:8px;padding:3px 8px;align-self:center;white-space:nowrap}
.nlink:hover{background:#eef1ff}
.prog{float:right;font-size:12px;font-weight:700;color:#4a5fd0}
ul.plain{margin:0;padding-left:1.25em;font-size:14px}
ul.plain li{margin:5px 0}
ul.plain ul{padding-left:1.1em;margin:3px 0}
ul.cal li{margin:9px 0}
.none{font-size:14px;color:#5a6478;margin:0;background:#f5f7fb;border-radius:9px;padding:11px 13px}
.src a{color:#4a5fd0}
code{background:#f0f2f8;border-radius:4px;padding:1px 5px;font-size:12.5px}
@media(max-width:560px){header h1{font-size:21px}.lv{display:none}.nlink{font-size:11px}}

#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#4a5fd0,#7b3fa8 55%,#b83a76);display:flex;align-items:center;justify-content:center;z-index:99}
#lockbox{background:#fff;border-radius:16px;padding:28px 26px;width:min(340px,88vw);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#lockbox h2{margin:0 0 4px;font-size:19px}
#lockdate{font-size:13px;color:#5a6478;margin-bottom:16px}
#pw{width:100%;padding:11px 12px;font-size:16px;border:1px solid #ccd4ee;border-radius:9px;text-align:center}
#go{margin-top:12px;width:100%;padding:11px;font-size:15px;font-weight:800;color:#fff;background:#4a5fd0;border:none;border-radius:9px;cursor:pointer}
#go:disabled{opacity:.6;cursor:wait}
#err{color:#c0272d;font-size:13px;min-height:19px;margin-top:9px}
</style>
</head>
<body>
<div id="content"></div>
<div id="lockgate">
  <div id="lockbox">
    <h2>🔒 朝ブリーフ</h2>
    <div id="lockdate">2026年8月29日（土）</div>
    <input id="pw" type="password" placeholder="パスフレーズ" autocomplete="off">
    <button id="go">開く</button>
    <div id="err"></div>
  </div>
</div>

const SKEY='brief-2026-08-29';
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){return {}}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s))}catch(e){}}
function refresh(){
  var boxes=[].slice.call(document.querySelectorAll('#content input[type=checkbox]'));
  var self=0,mem=0,todoAll=0,todoDone=0;
  boxes.forEach(function(b){
    var id=b.getAttribute('data-id')||'';
    if(id.indexOf('self-')===0&&!b.checked)self++;
    if(id.indexOf('mem-')===0&&!b.checked)mem++;
    if(id.indexOf('td-')===0){todoAll++;if(b.checked)todoDone++;}
  });
  var hp=Math.max(0,Math.min(100,100-self*10-mem*5));
  var cls=hp>=80?'ok':(hp>=50?'warn':'bad');
  var v=document.getElementById('hpval'),f=document.getElementById('hpfill'),n=document.getElementById('hpnote');
  if(v){v.textContent=hp+' / 100';v.className=cls;}
  if(f){f.style.width=hp+'%';f.className=cls;}
  if(n){n.textContent='自分の期限切れ '+self+'件 ×-10 ／ メンバー切れ '+mem+'件 ×-5 ／ 毎朝100にリセット';}
  var p=document.getElementById('prog');
  if(p){var r=todoAll-todoDone;p.textContent=r===0?'全部やりきった！':'残り '+r+' 件';}
}
function wire(){
  var st=loadState();
  [].slice.call(document.querySelectorAll('#content input[type=checkbox]')).forEach(function(b){
    var id=b.getAttribute('data-id');
    if(st[id]){b.checked=true;b.closest('label').classList.add('done');}
    b.addEventListener('change',function(){
      b.closest('label').classList.toggle('done',b.checked);
      var s=loadState();if(b.checked)s[id]=1;else delete s[id];saveState(s);
      refresh();
    });
  });
  refresh();
}
function b64(s){var x=atob(s),a=new Uint8Array(x.length);for(var i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a;}
async function open_(){
  var btn=document.getElementById('go'),err=document.getElementById('err');
  err.textContent='';btn.disabled=true;btn.textContent='復号中…';
  try{
    var pw=document.getElementById('pw').value;
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
    document.getElementById('content').innerHTML=new TextDecoder().decode(pt);
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){
    err.textContent='パスフレーズが違います';
    btn.disabled=false;btn.textContent='開く';
  }
}
document.getElementById('go').addEventListener('click',open_);
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')open_();});
document.getElementById('pw').focus();
</script>
