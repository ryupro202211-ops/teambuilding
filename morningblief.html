<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🔒 朝ブリーフ</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;background:#eef1f6;color:#1f2733;line-height:1.6;padding:16px;max-width:860px;margin:0 auto}
.header{background:linear-gradient(135deg,#4f6df5,#7b3ff2);color:#fff;border-radius:18px;padding:22px 22px 26px;box-shadow:0 8px 24px rgba(79,109,245,.28)}
.header .date{font-size:14px;opacity:.9}
.header h1{font-size:22px;margin:2px 0 14px}
.hpwrap{background:rgba(255,255,255,.18);border-radius:12px;padding:12px 14px}
.hprow{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px}
.hpbar{height:16px;border-radius:8px;background:rgba(0,0,0,.18);overflow:hidden}
.hpfill{height:100%;border-radius:8px;transition:width .4s,background .4s}
.hpfill.ok{background:#37d67a}.hpfill.warn{background:#ffc542}.hpfill.bad{background:#ff5b5b}
.hpbreak{font-size:11px;opacity:.85;margin-top:6px}
.quote{margin-top:14px;background:rgba(255,255,255,.14);border-left:4px solid #fff;border-radius:8px;padding:10px 14px;font-size:14px}
.quote .src{display:block;font-size:12px;opacity:.85;margin-top:4px;text-align:right}
.card{background:#fff;border-radius:16px;padding:18px 20px;margin-top:16px;box-shadow:0 3px 12px rgba(31,39,51,.06)}
.card h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card.boss{background:#3a0d12;color:#ffd9dd}
.alert-self{border:2px solid #ff5b5b}
.alert-mem{border:2px solid #ff9f43}
.sec-self h2{color:#e23b3b}.sec-mem h2{color:#e07b1a}
ul.tl{list-style:none}
ul.tl li{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid #eef1f6}
ul.tl li:last-child{border-bottom:none}
ul.tl li label{flex:1;display:flex;align-items:flex-start;gap:8px;cursor:pointer}
ul.tl li input[type=checkbox]{margin-top:4px;width:16px;height:16px;flex:none}
.memo{font-size:24px;width:30px;text-align:center;flex:none}
.bossemo{font-size:30px}
.lv{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:#e23b3b;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.lv.mem{background:#e07b1a}
.mtxt{flex:1}
.mtxt .due{color:#e23b3b;font-weight:700;font-size:13px}
.mtxt .sub{font-size:12px;color:#6b7480}
label.done .mtxt{text-decoration:line-through;opacity:.5}
label.done .memo{filter:grayscale(1);opacity:.35}
.nlink{font-size:12px;color:#4f6df5;text-decoration:none;white-space:nowrap;margin-top:4px}
.nlink:hover{text-decoration:underline}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #eef1f6;vertical-align:top}
th{color:#6b7480;font-weight:600;font-size:12px}
.pri{font-weight:700;white-space:nowrap}
.warnbox{background:#fff6e5;border:1px solid #ffd98a;border-radius:10px;padding:10px 12px;font-size:13px;color:#9a6a12}
.note{font-size:13px;color:#42505f}
.sched li{padding:6px 0;border-bottom:1px dashed #e3e8f0;font-size:13px;list-style:none}
.sched{list-style:none}
.src-list{font-size:12px;word-break:break-all}
.src-list a{color:#4f6df5}
.muted{color:#8a94a0;font-size:13px}
#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#4f6df5,#7b3ff2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:99;color:#fff}
#lockgate h2{font-size:20px}
#lockgate input{padding:10px 14px;border-radius:10px;border:none;font-size:16px;width:220px;text-align:center}
#lockgate button{padding:10px 22px;border-radius:10px;border:none;background:#fff;color:#4f6df5;font-weight:700;font-size:15px;cursor:pointer}
#lockerr{color:#ffd9dd;font-size:13px;min-height:18px}
</style></head><body>

const SKEY = 'brief-2026-07-30';
function b64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}');}catch(e){return {};}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s));}catch(e){}}
function refresh(){
  const boxes=[...document.querySelectorAll('#content input[type=checkbox]')];
  let uncheckedSelf=0,uncheckedMem=0,remain=0;
  boxes.forEach(b=>{const id=b.getAttribute('data-id')||'';const lab=b.closest('label');
    if(b.checked){lab&&lab.classList.add('done');}else{lab&&lab.classList.remove('done');remain++;
      if(id.indexOf('self-')===0)uncheckedSelf++;if(id.indexOf('mem-')===0)uncheckedMem++;}});
  let hp=100-uncheckedSelf*10-uncheckedMem*5;hp=Math.max(0,Math.min(100,hp));
  const fill=document.getElementById('hpfill'),val=document.getElementById('hpval');
  if(fill){fill.style.width=hp+'%';fill.className='hpfill '+(hp>=80?'ok':(hp>=50?'warn':'bad'));}
  if(val)val.textContent=hp+' / 100';
  const prog=document.getElementById('prog');
  if(prog)prog.textContent=remain>0?('残り '+remain+' 件'):'全部やりきった！';
}
function wire(){
  const st=loadState();
  document.querySelectorAll('#content input[type=checkbox]').forEach(b=>{
    const id=b.getAttribute('data-id');
    if(id&&st[id])b.checked=true;
    b.addEventListener('change',()=>{const s=loadState();const i=b.getAttribute('data-id');if(i){s[i]=b.checked;saveState(s);}refresh();});
  });
  refresh();
}
async function unlock(){
  const pw=document.getElementById('pw').value;const errEl=document.getElementById('lockerr');
  try{
    const baseKey=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),{name:'PBKDF2'},false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.it,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
    document.getElementById('content').innerHTML=new TextDecoder().decode(plain);
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){errEl.textContent='パスフレーズが違います';}
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('openbtn').addEventListener('click',unlock);
  document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
});
</script>
