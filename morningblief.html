 padding:4px 11px;border-radius:999px;backdrop-filter:blur(6px)}
.hdin h1{margin:12px 0 20px;font-size:29px;line-height:1.3;letter-spacing:.02em;
 font-weight:800;text-shadow:0 2px 20px rgba(10,6,30,.45)}
.hdin h1 .sm{display:block;font-size:14px;font-weight:600;opacity:.86;letter-spacing:.1em;margin-top:5px}

.glass{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);
 border-radius:15px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hpbox{padding:14px 16px;margin-bottom:12px}
.hprow{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.hprow .lbl{font-size:11px;font-weight:700;letter-spacing:.16em;opacity:.85}
.hprow b{font-size:30px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.hprow .max{font-size:12px;opacity:.7}
.hpbar{height:9px;border-radius:999px;background:rgba(0,0,0,.32);overflow:hidden;
 box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.hpfill{height:100%;border-radius:999px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.hpfill.ok{background:linear-gradient(90deg,#3ddc97,#12b76a);box-shadow:0 0 14px rgba(61,220,151,.6)}
.hpfill.warn{background:linear-gradient(90deg,#ffd166,#f5a524);box-shadow:0 0 14px rgba(245,165,36,.55)}
.hpfill.bad{background:linear-gradient(90deg,#ff9a8b,#e5484d);box-shadow:0 0 14px rgba(229,72,77,.55)}
.hpnote{font-size:11px;opacity:.82;margin-top:8px;letter-spacing:.02em}

.quote{padding:16px 18px;position:relative}
.quote::before{content:"”";position:absolute;top:2px;right:16px;font-size:56px;line-height:1;
 opacity:.2;font-family:Georgia,serif}
.quote .q{font-size:18px;font-weight:600;line-height:1.65;letter-spacing:.03em;
 font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
.quote .s{font-size:11.5px;opacity:.82;margin-top:9px;letter-spacing:.06em}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:18px;padding:18px 20px;margin-bottom:15px;
 box-shadow:var(--sh);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.card.self::before{background:linear-gradient(180deg,#ff8787,var(--red))}
.card.mem::before{background:linear-gradient(180deg,#ffa94d,var(--orange))}
.card.today::before{background:linear-gradient(180deg,#74c0fc,var(--blue))}
.card.next::before{background:linear-gradient(180deg,#8ce99a,var(--green))}
.card.todo::before{background:linear-gradient(180deg,#9aa0ff,var(--indigo))}
.card h2{margin:0 0 14px;font-size:16px;font-weight:800;letter-spacing:.03em;
 display:flex;align-items:center;gap:9px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.card h2 .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--sub);
 background:var(--paper);border-radius:999px;padding:2px 10px;letter-spacing:.04em}
.card.self h2{color:var(--red)} .card.mem h2{color:var(--orange)}
.card.today h2{color:var(--blue)} .card.next h2{color:var(--green)}

/* ---------- boss ---------- */
.card.boss{background:radial-gradient(120% 140% at 80% 0%,#4a1420 0%,#240d18 55%,#160810 100%);
 color:#ffe9ec;box-shadow:0 0 0 1px rgba(255,120,130,.22),0 14px 40px rgba(60,6,20,.4)}
.card.boss::before{background:linear-gradient(180deg,#ff6b6b,#8b1a2b)}
.card.boss h2{color:#ff9b9b;border-bottom-color:rgba(255,120,130,.2)}
.card.boss h2 .cnt{background:rgba(255,255,255,.09);color:#ffc9c9}
.bossrow{display:flex;align-items:center;gap:15px}
.bossemo{font-size:38px;line-height:1;filter:drop-shadow(0 0 14px rgba(255,90,110,.55))}
.bossname{font-size:17px;font-weight:800;letter-spacing:.02em}
.card.boss .sub{color:#e5b3ba}
.card.boss .over{color:#ff8f9a}

/* ---------- lists ---------- */
ul.tl{list-style:none;margin:0;padding:0}
ul.tl li{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
ul.tl li:last-child{border-bottom:none}
label{display:flex;align-items:flex-start;gap:9px;flex:1;cursor:pointer;min-width:0}
label input{margin-top:5px;width:17px;height:17px;flex:none;accent-color:var(--indigo);cursor:pointer}
.memo{font-size:24px;width:32px;text-align:center;flex:none;line-height:1.25;
 transition:filter .3s,opacity .3s}
.mtxt{flex:1;min-width:0}
.lv{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;background:var(--red);
 border-radius:5px;padding:1.5px 7px;margin-right:7px;vertical-align:2px;letter-spacing:.04em;
 font-variant-numeric:tabular-nums}
.lv.s{background:#f08c00}
.card.boss .lv{background:#ff6b6b;color:#2b0a11}
label.done .mtxt{text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.4}
label.done .memo{filter:grayscale(1);opacity:.3}
.over{color:var(--red);font-weight:800}
.due{color:var(--blue);font-weight:800}
.sub{font-size:12px;color:var(--sub);display:block;margin-top:3px;line-height:1.6}
.pri{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;
 border-radius:7px;padding:2px 8px;margin-top:3px;flex:none;letter-spacing:.02em}
.p1{background:#ffe8e8;color:#c92a2a} .p2{background:#fff4d6;color:#a06a00} .p3{background:#dcf7e1;color:#2b8a3e}
.nlink{font-size:10.5px;color:var(--indigo);text-decoration:none;border:1px solid #d5d8f7;
 border-radius:7px;padding:3px 9px;flex:none;white-space:nowrap;align-self:center;
 font-weight:700;transition:background .15s,border-color .15s}
.nlink:hover{background:#eef0ff;border-color:var(--indigo)}
.prog{font-size:12px;color:var(--sub);margin-top:13px;padding-top:11px;border-top:1px solid var(--line);
 font-weight:700;letter-spacing:.03em}

/* ---------- misc ---------- */
.cal{list-style:none;margin:0;padding:0;font-size:14px}
.cal li{display:flex;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.cal li:last-child{border-bottom:none}
.cal .t{font-weight:800;color:var(--indigo);flex:none;font-variant-numeric:tabular-nums;
 font-size:13px;letter-spacing:.02em}
.sanbo{font-size:14px;line-height:1.85}
.sanbo p{margin:0 0 13px;padding-left:15px;border-left:2px solid #dfe3f5}
.sanbo p:last-child{margin:0}
.sanbo b{background:linear-gradient(transparent 62%,#ffe9a8 62%);font-weight:800}
.src{font-size:12px;color:var(--sub);list-style:none;margin:0;padding:0}
.src li{padding:5px 0 5px 15px;position:relative;line-height:1.6}
.src li::before{content:"";position:absolute;left:0;top:12px;width:5px;height:5px;
 border-radius:50%;background:#c3c8da}
.src a{color:var(--indigo);text-decoration:none;border-bottom:1px solid #d5d8f7}
.empty{margin:0;font-size:14px;color:var(--sub)}
.foot{text-align:center;font-size:11px;color:#a7adc0;margin-top:22px;letter-spacing:.06em}

@media(max-width:520px){
  .hdin h1{font-size:23px}
  .hprow b{font-size:26px}
  .card{padding:16px 15px;border-radius:16px}
  .quote .q{font-size:16px}
  .bossemo{font-size:32px}
}

const SKEY='brief-2026-09-05';
function b642u8(s){const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s))}catch(e){}}
function refresh(){
  const boxes=[...document.querySelectorAll('#content input[type=checkbox]')];
  let selfLeft=0,memLeft=0,left=0;
  boxes.forEach(b=>{
    const id=b.dataset.id||'';
    if(!b.checked){left++;if(id.startsWith('self-'))selfLeft++;else if(id.startsWith('mem-'))memLeft++;}
    const lab=b.closest('label'); if(lab) lab.classList.toggle('done',b.checked);
  });
  let hp=100-selfLeft*10-memLeft*5;
  hp=Math.max(0,Math.min(100,hp));
  const v=document.getElementById('hpval'); if(v) v.textContent=hp;
  const f=document.getElementById('hpfill');
  if(f){f.style.width=hp+'%';f.className='hpfill '+(hp>=80?'ok':hp>=50?'warn':'bad');}
  const n=document.getElementById('hpnote');
  if(n) n.textContent='自分の期限切れ '+selfLeft+'件 ×-10 ／ メンバー切れ '+memLeft+'件 ×-5 ／ 毎朝100にリセット';
  const p=document.getElementById('prog');
  if(p) p.textContent = left===0 ? '🎉 全部やりきった！' : ('残り '+left+' 件');
}
function wire(){
  const st=loadState();
  document.querySelectorAll('#content input[type=checkbox]').forEach(b=>{
    const id=b.dataset.id; if(id&&st[id])b.checked=true;
    b.addEventListener('change',()=>{
      const s=loadState();
      if(b.checked)s[b.dataset.id]=1;else delete s[b.dataset.id];
      saveState(s); refresh();
    });
  });
  refresh();
}
async function unlock(){
  const btn=document.getElementById('go'), err=document.getElementById('err');
  const pass=document.getElementById('pw').value;
  btn.disabled=true; err.textContent='復号中…';
  try{
    const enc=new TextEncoder();
    const bk=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b642u8(ENC.salt),iterations:ENC.it,hash:'SHA-256'},
      bk,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b642u8(ENC.iv)},key,b642u8(ENC.ct));
    document.getElementById('content').innerHTML=new TextDecoder().decode(pt);
    document.getElementById('lockgate').style.display='none';
    err.textContent='';
    wire();
  }catch(e){
    err.textContent='パスフレーズが違います';
    btn.disabled=false;
  }
}
document.getElementById('go').addEventListener('click',unlock);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
document.getElementById('pw').focus();
</script>
