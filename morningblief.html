<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:0 0 40px;background:#f4f6fa;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;color:#22262e;line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}
header.hd{background:linear-gradient(135deg,#4a5fd4 0%,#7b46c9 55%,#b8409a 100%);color:#fff;padding:26px 0 30px;margin-bottom:20px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
header.hd .wrap{padding:0 20px}
.dt{font-size:13px;opacity:.9;letter-spacing:.08em}
h1{margin:4px 0 16px;font-size:26px;font-weight:800;letter-spacing:.02em}
.hpbox{background:rgba(255,255,255,.16);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.hprow{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.hpbar{flex:1;height:16px;background:rgba(0,0,0,.25);border-radius:9px;overflow:hidden}
.hpfill{height:100%;border-radius:9px;transition:width .35s ease,background .35s ease}
.hpfill.ok{background:linear-gradient(90deg,#38d17a,#8ef0b0)}
.hpfill.warn{background:linear-gradient(90deg,#f5b731,#ffe08a)}
.hpfill.bad{background:linear-gradient(90deg,#ef4444,#ff9a8a)}
.hpcalc{font-size:11px;opacity:.85;margin-top:6px;line-height:1.5}
.quote{background:rgba(255,255,255,.14);border-left:4px solid rgba(255,255,255,.75);border-radius:0 10px 10px 0;padding:12px 16px}
.quote .qt{font-size:16px;font-weight:700}
.quote .qs{font-size:12px;opacity:.88;margin-top:6px}
.card{background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 10px rgba(30,40,80,.07)}
.card h2{margin:0 0 12px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.card.self{border-left:6px solid #e23b3b}
.card.mem{border-left:6px solid #f08a2c}
.card.boss{background:#2a1216;color:#ffe9e9;border-left:6px solid #ff3b3b}
.card.today{border-left:6px solid #2f7de1}
.card.soon{border-left:6px solid #8b8f9a}
.card.none{border-left:6px solid #b0b6c2}
.card.adv{border-left:6px solid #7b46c9;background:#faf7ff}
ul.lst{list-style:none;margin:0;padding:0}
ul.lst li{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px dashed #e6e9f0}
ul.lst li:last-child{border-bottom:none}
label{flex:1;display:flex;align-items:flex-start;gap:8px;cursor:pointer}
label input{margin-top:5px;width:17px;height:17px;flex:none;accent-color:#4a5fd4;cursor:pointer}
.memo{font-size:24px;width:30px;text-align:center;flex:none;line-height:1.2}
.mtxt{flex:1;font-size:14px}
label.done .mtxt{text-decoration:line-through;opacity:.45}
label.done .memo{filter:grayscale(1);opacity:.35}
.lv{display:inline-block;background:#e23b3b;color:#fff;font-size:11px;font-weight:800;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.over{color:#d61f1f;font-weight:800}
.sub{display:block;font-size:12px;color:#6b7280;margin-top:2px}
.nlink{font-size:11px;color:#4a5fd4;text-decoration:none;border:1px solid #cdd5f0;border-radius:6px;padding:2px 7px;white-space:nowrap;align-self:center;flex:none}
.nlink:hover{background:#eef1fd}
table{width:100%;border-collapse:collapse;font-size:14px}
table th{background:#f1f3f9;text-align:left;padding:8px 10px;font-size:12px;color:#4b5162;border-bottom:2px solid #e2e6ef}
table td{padding:0;border-bottom:1px solid #eef0f6;vertical-align:top}
table td.pri{padding:8px 10px;white-space:nowrap;font-weight:700;font-size:12px;width:1%}
table td.act{padding:8px 10px;font-size:13px;color:#4b5162}
.p1{color:#d61f1f}.p2{color:#c98a00}.p3{color:#2c9c5c}
#prog{font-size:12px;color:#555;margin-top:10px;font-weight:700}
.srcs a{display:block;font-size:12px;color:#4a5fd4;word-break:break-all;padding:3px 0;text-decoration:none}
.srcs a:hover{text-decoration:underline}
.note{font-size:12px;color:#6b7280;margin-top:8px}
#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#3a4bb0,#7b46c9);display:flex;align-items:center;justify-content:center;z-index:999}
#lockgate .box{background:#fff;border-radius:16px;padding:30px 26px;width:min(360px,88vw);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#lockgate h3{margin:0 0 6px;font-size:19px}
#lockgate p{margin:0 0 16px;font-size:12px;color:#6b7280}
#lockgate input{width:100%;padding:11px 12px;font-size:16px;border:2px solid #d8dcea;border-radius:9px;margin-bottom:10px}
#lockgate button{width:100%;padding:11px;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(135deg,#4a5fd4,#7b46c9);border:none;border-radius:9px;cursor:pointer}
#lkerr{color:#d61f1f;font-size:12px;min-height:18px;margin-top:8px}


.bossemo{font-size:30px;width:auto;text-align:center;flex:none;line-height:1.2}
.card.boss h2{color:#ffd9d9}
.card.boss .mtxt{color:#ffe9e9}
.card.boss .sub{color:#ffb0b0}
.card.boss ul.lst li{border-bottom-color:#4a2226}
</style>
</head><body>
<div id="content"></div>
<div id="lockgate"><div class="box">
<h3>🔒 朝ブリーフ</h3>
<p>パスフレーズを入力してください</p>
<input type="password" id="pw" autocomplete="off" placeholder="パスフレーズ">
<button id="go">開く</button>
<div id="lkerr"></div>
</div></div>

const SKEY='brief-2026-08-17';
function b2a(b){return Uint8Array.from(atob(b),c=>c.charCodeAt(0));}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}');}catch(e){return {};}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s));}catch(e){}}
function refresh(){
  var boxes=document.querySelectorAll('#content input[type=checkbox]');
  var self=0,mem=0,td=0,tdd=0;
  boxes.forEach(function(b){
    var id=b.dataset.id||'';
    if(id.indexOf('self-')===0){if(!b.checked)self++;}
    else if(id.indexOf('mem-')===0&&id!=='mem-boss'){if(!b.checked)mem++;}
    else if(id.indexOf('td-')===0){td++;if(!b.checked)tdd++;}
  });
  var hp=Math.max(0,Math.min(100,100-self*10-mem*5));
  var f=document.getElementById('hpfill'),v=document.getElementById('hpval');
  if(f){f.style.width=hp+'%';f.className='hpfill '+(hp>=80?'ok':(hp>=50?'warn':'bad'));}
  if(v)v.textContent=hp+' / 100';
  var p=document.getElementById('prog');
  if(p)p.textContent=tdd===0?'🎉 全部やりきった！':('残り '+tdd+' 件 / 全'+td+'件');
}
function wire(){
  var st=loadState();
  document.querySelectorAll('#content input[type=checkbox]').forEach(function(b){
    var id=b.dataset.id; if(!id)return;
    if(st[id]){b.checked=true;}
    var lab=b.closest('label');
    if(lab)lab.classList.toggle('done',b.checked);
    b.addEventListener('change',function(){
      var s=loadState(); s[id]=b.checked; saveState(s);
      var l=b.closest('label'); if(l)l.classList.toggle('done',b.checked);
      refresh();
    });
  });
  refresh();
}
async function unlock(){
  var pw=document.getElementById('pw').value;
  var er=document.getElementById('lkerr');
  er.textContent='復号中...';
  try{
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(ENC.iv)},k,b2a(ENC.ct));
    document.getElementById('content').innerHTML=new TextDecoder().decode(pt);
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){ er.textContent='パスフレーズが違います'; }
}
document.getElementById('go').addEventListener('click',unlock);
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')unlock();});
</script>
