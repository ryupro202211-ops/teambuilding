<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:0 0 40px;background:#f4f6fa;color:#222;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding:0 14px}
header{background:linear-gradient(135deg,#4a6cf7 0%,#8b5cf6 55%,#ec4899 100%);color:#fff;padding:26px 0 30px;margin-bottom:18px;box-shadow:0 4px 18px rgba(0,0,0,.15)}
header .wrap{padding:0 20px}
h1{margin:0 0 4px;font-size:26px;letter-spacing:.04em}
.date{opacity:.92;font-size:14px;margin-bottom:16px}
.hpbox{background:rgba(255,255,255,.16);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.hprow{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:bold}
.hpbar{flex:1;height:16px;background:rgba(0,0,0,.25);border-radius:9px;overflow:hidden}
.hpfill{height:100%;width:0;border-radius:9px;transition:width .35s ease,background .35s ease}
.hpfill.ok{background:linear-gradient(90deg,#34d399,#10b981)}
.hpfill.warn{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.hpfill.bad{background:linear-gradient(90deg,#f87171,#dc2626)}
.hpnote{font-size:11px;opacity:.85;margin-top:6px}
.quote{background:rgba(255,255,255,.16);border-left:4px solid #fff;border-radius:8px;padding:12px 14px;font-size:15px}
.quote .src{display:block;margin-top:6px;font-size:12px;opacity:.9;text-align:right}
.card{background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.card h2{margin:0 0 12px;font-size:18px;border-bottom:2px solid #eef0f6;padding-bottom:8px}
.card.boss{background:#2b0b12;color:#ffe4e6;border:2px solid #dc2626;box-shadow:0 0 24px rgba(220,38,38,.35)}
.card.boss h2{color:#fecaca;border-bottom-color:#7f1d1d}
.card.self{border-left:6px solid #dc2626}
.card.self h2{color:#b91c1c}
.card.mem{border-left:6px solid #f97316}
.card.mem h2{color:#c2410c}
ul.tl{list-style:none;margin:0;padding:0}
ul.tl li{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px dashed #e6e8ef}
ul.tl li:last-child{border-bottom:none}
label{flex:1;display:flex;align-items:flex-start;gap:8px;cursor:pointer}
label input{margin-top:5px;width:17px;height:17px;flex:none;cursor:pointer}
.memo{font-size:24px;width:30px;text-align:center;flex:none;line-height:1.2}
.bossemo{font-size:30px}
.mtxt{flex:1;font-size:14px}
label.done .mtxt{text-decoration:line-through;opacity:.45}
label.done .memo{filter:grayscale(1);opacity:.35}
.lv{display:inline-block;background:#dc2626;color:#fff;font-size:12px;font-weight:bold;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.card.boss .lv{background:#fca5a5;color:#450a0a}
.over{color:#dc2626;font-weight:bold}
.due{color:#b45309;font-weight:bold}
.pri{display:inline-block;font-size:11px;font-weight:bold;border-radius:5px;padding:1px 7px;margin-right:6px;white-space:nowrap}
.p1{background:#fee2e2;color:#b91c1c}
.p2{background:#fef3c7;color:#92400e}
.p3{background:#dcfce7;color:#15803d}
.nlink{flex:none;font-size:12px;color:#4a6cf7;text-decoration:none;white-space:nowrap;align-self:center}
.nlink:hover{text-decoration:underline}
.prog{font-size:13px;color:#555;margin-bottom:10px;font-weight:bold}
.sub{font-size:12px;color:#777}
.card p{margin:6px 0;font-size:14px}
.card ul.plain{margin:6px 0;padding-left:20px;font-size:14px}
.card ul.plain li{margin:4px 0}
a{color:#4a6cf7}
#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#4a6cf7,#8b5cf6,#ec4899);display:flex;align-items:center;justify-content:center;z-index:999}
#lockbox{background:#fff;border-radius:16px;padding:28px 26px;width:300px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#lockbox h3{margin:0 0 14px;font-size:17px}
#pw{width:100%;padding:10px;font-size:15px;border:1px solid #ccc;border-radius:8px;margin-bottom:10px}
#go{width:100%;padding:10px;font-size:15px;font-weight:bold;color:#fff;background:#4a6cf7;border:none;border-radius:8px;cursor:pointer}
#err{color:#dc2626;font-size:13px;margin-top:8px;min-height:18px}

</style>
</head>

<div id="lockgate"><div id="lockbox">

const SKEY = 'brief-2026-08-21';
function b64(s){const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}');}catch(e){return {};}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s));}catch(e){}}
function refresh(){
  const boxes=[...document.querySelectorAll('#content input[type=checkbox]')];
  let hp=100, remain=0;
  boxes.forEach(b=>{
    const id=b.dataset.id||'';
    if(!b.checked){
      if(id.indexOf('self-')===0) hp-=10;
      else if(id.indexOf('mem-')===0) hp-=5;
      remain++;
    }
  });
  hp=Math.max(0,Math.min(100,hp));
  const f=document.getElementById('hpfill'), v=document.getElementById('hpval');
  if(f){f.style.width=hp+'%';f.className='hpfill '+(hp>=80?'ok':(hp>=50?'warn':'bad'));}
  if(v)v.textContent=hp+' / 100';
  const p=document.getElementById('prog');
  if(p)p.textContent = remain===0 ? '🎉 全部やりきった！' : ('残り '+remain+' 件');
}
function wire(){
  const st=loadState();
  document.querySelectorAll('#content input[type=checkbox]').forEach(b=>{
    const id=b.dataset.id;
    if(st[id]){b.checked=true;b.closest('label').classList.add('done');}
    b.addEventListener('change',()=>{
      b.closest('label').classList.toggle('done',b.checked);
      const s=loadState(); if(b.checked)s[id]=1; else delete s[id]; saveState(s);
      refresh();
    });
  });
  refresh();
}
async function unlock(){
  const err=document.getElementById('err');
  err.textContent='復号中…';
  try{
    const pw=document.getElementById('pw').value;
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),{name:'PBKDF2'},false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
    document.getElementById('content').innerHTML=new TextDecoder().decode(pt);
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){ err.textContent='パスフレーズが違います'; }
}
document.getElementById('go').addEventListener('click',unlock);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
</script>
