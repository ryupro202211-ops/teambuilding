<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1f2430;--sub:#6b7280;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%;}
#content{max-width:760px;margin:0 auto;padding:16px;}
.hdr{background:linear-gradient(135deg,#5b6cf0,#8a5bf0);color:#fff;border-radius:20px;padding:22px 20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(90,80,240,.25);}
.hdr .date{opacity:.9;font-size:14px;}
.hdr h1{margin:4px 0 14px;font-size:22px;}
.hpwrap{margin-bottom:12px;}
.hpbar{height:16px;background:rgba(255,255,255,.3);border-radius:10px;overflow:hidden;}
.hpfill{height:100%;width:45%;border-radius:10px;transition:width .4s,background .4s;}
.hpfill.ok{background:#39d98a;}.hpfill.warn{background:#ffcf5c;}.hpfill.bad{background:#ff5c72;}
.hpline{font-size:13px;margin-top:6px;font-weight:700;}
.hpnote{font-size:11px;opacity:.85;}
.prog{font-size:12px;margin-top:4px;font-weight:700;}
.quote{margin-top:12px;background:rgba(255,255,255,.15);border-radius:12px;padding:12px 14px;font-size:15px;}
.quote .qs{display:block;text-align:right;font-size:12px;opacity:.9;margin-top:4px;}
.card{background:var(--card);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(20,20,50,.06);}
.card h2{margin:0 0 12px;font-size:17px;}
.card.danger{border-left:6px solid #ff5c72;}
.card.warn2{border-left:6px solid #ff9f45;}
.card.comment{background:#fff7e8;}
.card.src{background:#f0f3ff;}
.tlist{list-style:none;margin:0;padding:0;}
.tlist li{display:flex;align-items:center;gap:2px;padding:8px 0;border-bottom:1px solid #f0f0f4;}
.tlist li:last-child{border-bottom:none;}
.tlist label{display:flex;align-items:center;gap:8px;flex:1;cursor:pointer;}
.memo{font-size:24px;width:30px;text-align:center;flex:none;}
.lv{font-size:12px;font-weight:700;background:#eef;border-radius:6px;padding:2px 6px;color:#5b6cf0;flex:none;}
.mtxt{font-size:14px;}
.over{color:#e01e3c;font-weight:700;}
label.done .mtxt{text-decoration:line-through;color:var(--sub);}
label.done .memo{filter:grayscale(1);opacity:.35;}
.nlink{font-size:12px;color:#5b6cf0;text-decoration:none;white-space:nowrap;flex:none;margin-left:6px;}
.hint{font-size:12px;color:var(--sub);margin-top:10px;background:#fff4ec;border-radius:8px;padding:8px 10px;}
.todo{width:100%;border-collapse:collapse;font-size:14px;}
.todo th,.todo td{border-bottom:1px solid #eef;padding:8px 6px;text-align:left;vertical-align:top;}
.todo th{font-size:12px;color:var(--sub);}
.pri{font-weight:700;white-space:nowrap;font-size:13px;}
.pri.red{color:#e01e3c;}.pri.yellow{color:#c98a00;}.pri.green{color:#1a9e57;}
.todo label{display:flex;gap:6px;align-items:flex-start;cursor:pointer;}
.plain{margin:0;padding-left:18px;font-size:14px;}
.plain li{margin:4px 0;}
#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#5b6cf0,#8a5bf0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;z-index:99;}
#lockgate h2{font-size:20px;margin:0;}
#lockgate input{padding:12px 14px;border-radius:10px;border:none;font-size:16px;width:220px;text-align:center;}
#lockgate button{padding:12px 22px;border-radius:10px;border:none;background:#fff;color:#5b6cf0;font-weight:700;font-size:15px;cursor:pointer;}
#lockerr{color:#ffe0e0;font-size:13px;height:16px;}
</style>
</head>
<body>
<div id="content"></div>
<div id="lockgate">
  <h2>🔒 朝ブリーフ</h2>
  <input id="pass" type="password" placeholder="パスフレーズ" autofocus>
  <button id="openbtn">開く</button>
  <div id="lockerr"></div>
</div>

var SKEY="brief-2026-08-09";
function b2ab(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a.buffer;}
async function decrypt(pass){
  var salt=b2ab(ENC.salt),iv=b2ab(ENC.iv),data=b2ab(ENC.ct);
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ENC.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,data);
  return new TextDecoder().decode(pt);
}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}');}catch(e){return {};}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s));}catch(e){}}
function refresh(){
  var boxes=document.querySelectorAll('#content input[type=checkbox]');
  var self=0,mem=0,td=0,tddone=0;
  boxes.forEach(function(b){
    var id=b.getAttribute('data-id');
    if(id.indexOf('td-')===0){td++;if(b.checked)tddone++;}
    if(b.checked)return;
    if(id.indexOf('self-')===0)self++;
    else if(id.indexOf('mem-')===0)mem++;
  });
  var hp=100-self*10-mem*5;if(hp<0)hp=0;if(hp>100)hp=100;
  var fill=document.getElementById('hpfill'),val=document.getElementById('hpval');
  if(fill){fill.style.width=hp+'%';fill.className='hpfill '+(hp>=80?'ok':(hp>=50?'warn':'bad'));}
  if(val)val.textContent=hp;
  var rem=td-tddone;
  var p=document.getElementById('prog');
  if(p)p.textContent=rem>0?('今日のToDo 残り '+rem+' 件'):'今日のToDo 全部やりきった！🎉';
}
function wire(){
  var st=loadState();
  var boxes=document.querySelectorAll('#content input[type=checkbox]');
  boxes.forEach(function(b){
    var id=b.getAttribute('data-id');
    if(st[id]){b.checked=true;var l=b.closest('label');if(l)l.classList.add('done');}
    b.addEventListener('change',function(){
      var l=b.closest('label');if(l)l.classList.toggle('done',b.checked);
      var s=loadState();s[id]=b.checked;saveState(s);refresh();
    });
  });
  refresh();
}
async function openBrief(){
  var pass=document.getElementById('pass').value;
  try{
    var html=await decrypt(pass);
    document.getElementById('content').innerHTML=html;
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){document.getElementById('lockerr').textContent='パスフレーズが違います';}
}
window.addEventListener('DOMContentLoaded',function(){
  document.getElementById('openbtn').addEventListener('click',openBrief);
  document.getElementById('pass').addEventListener('keydown',function(e){if(e.key==='Enter')openBrief();});
});
</script>
