<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
:root{--bg:#0f1420;--card:#161c2b;--ink:#e8edf6;--sub:#9fb0c8;--line:#26304a;}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#0f1420,#131a2b);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.hd{background:linear-gradient(135deg,#3b2f7a,#7a3b6b 55%,#b8465f);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.hd-top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
.date{font-size:14px;opacity:.9}
.title{font-size:22px;font-weight:800}
.hpbox{margin:14px 0 10px}
.hplabel{font-size:13px;font-weight:700;margin-bottom:4px}
.hpbar{height:16px;background:#0c1020;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.hpfill{height:100%;transition:width .5s}
.hpfill.ok{background:linear-gradient(90deg,#2ecc71,#27ae60)}
.hpfill.warn{background:linear-gradient(90deg,#f1c40f,#e67e22)}
.hpfill.bad{background:linear-gradient(90deg,#e74c3c,#c0392b)}
.hpnote{font-size:11px;opacity:.85;margin-top:5px}
.prog{font-size:12px;margin-top:4px;font-weight:700;color:#ffe6a1}
.quote{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18);font-size:16px;font-weight:700;text-align:center}
.qsrc{font-size:12px;opacity:.85;font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:16px}
.card.boss{background:linear-gradient(135deg,#3a0d12,#5a1620);border-color:#7a2230}
.bossrow{display:flex;gap:12px;align-items:center}
.bossemo{font-size:30px;width:40px;text-align:center}
.bossname{font-weight:800;font-size:17px}
.bosssub{font-size:13px;color:#ffd9d9}
.bosssub2{font-size:12px;color:#ffb3b3;margin-top:2px}
.card.danger{border-color:#7a2230;background:#1e1418}
.card.warn2{border-color:#7a5223;background:#1e1a12}
.chk{list-style:none;margin:0;padding:0}
.chk li{display:flex;align-items:flex-start;gap:6px;padding:7px 0;border-bottom:1px dashed var(--line)}
.chk li:last-child{border-bottom:none}
.chk label{flex:1;display:flex;align-items:flex-start;gap:8px;cursor:pointer}
.chk input{margin-top:4px;transform:scale(1.2)}
.memo{font-size:24px;width:30px;text-align:center;flex:none}
.mtxt{flex:1}
.lv{display:inline-block;background:#2a3350;color:#cdd8f0;font-size:12px;padding:1px 7px;border-radius:8px;margin-left:4px}
.od{color:#ff6b6b}
label.done .mtxt{text-decoration:line-through;opacity:.5}
label.done .memo{filter:grayscale(1);opacity:.35}
.nlink{font-size:12px;color:#8fb7ff;text-decoration:none;white-space:nowrap;margin-top:6px;flex:none}
.note{font-size:11px;color:var(--sub);margin-top:8px}
.todo .pri{font-size:12px;font-weight:700;margin-right:6px;white-space:nowrap}
.p-red{color:#ff7b7b}.p-yel{color:#ffd24a}.p-grn{color:#7bd88f}
.src{font-size:11px;color:var(--sub);margin-left:6px;border:1px solid var(--line);padding:0 5px;border-radius:6px}
.plain{margin:0;padding-left:18px}
.plain li{padding:3px 0}
.cal .calday{margin-bottom:8px}
.cal .calday>b{color:#bcd0ff}
.advice p{margin:0;font-size:14px}
a{color:#8fb7ff}
</style>
</head>

<div id="lockgate" style="position:fixed;inset:0;background:#0f1420;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:99;font-family:sans-serif;color:#e8edf6">
  <div style="font-size:20px">🔒 朝ブリーフ</div>

  <button id="openbtn" style="padding:10px 22px;border-radius:10px;border:none;background:#7a3b6b;color:#fff;font-size:15px;cursor:pointer">開く</button>
  <div id="err" style="color:#ff6b6b;font-size:13px;height:16px"></div>
</div>

const SKEY="brief-2026-08-14";
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function decrypt(pass){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pass),{name:'PBKDF2'},false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
  return new TextDecoder().decode(pt);
}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){return {}}}
function saveState(s){localStorage.setItem(SKEY,JSON.stringify(s))}
function refresh(){
  let self=0,mem=0;
  document.querySelectorAll('#content input[type=checkbox]').forEach(c=>{
    const id=c.getAttribute('data-id');
    if(c.checked){if(id&&id.indexOf('self-')===0)self++;if(id&&id.indexOf('mem-')===0)mem++;}
  });
  const selfTot=document.querySelectorAll('#content input[data-id^=self-]').length;
  const memTot=document.querySelectorAll('#content input[data-id^=mem-]').length;
  let hp=100-(selfTot-self)*10-(memTot-mem)*5;
  if(hp<0)hp=0;if(hp>100)hp=100;
  const f=document.getElementById('hpfill'),v=document.getElementById('hpval');
  if(v)v.textContent=hp;
  if(f){f.style.width=hp+'%';f.className='hpfill '+(hp>=80?'ok':(hp>=50?'warn':'bad'));}
  let remain=0;
  document.querySelectorAll('#content input[type=checkbox]').forEach(c=>{if(!c.checked)remain++;});
  const p=document.getElementById('prog');
  if(p)p.textContent=remain===0?'全部やりきった！🎉':('残り '+remain+' 件');
}
function wire(){
  const st=loadState();
  document.querySelectorAll('#content input[type=checkbox]').forEach(c=>{
    const id=c.getAttribute('data-id');
    if(st[id])c.checked=true;
    const lab=c.closest('label');
    if(lab)lab.classList.toggle('done',c.checked);
    c.addEventListener('change',()=>{
      const s=loadState();s[id]=c.checked;saveState(s);
      if(lab)lab.classList.toggle('done',c.checked);
      refresh();
    });
  });
  refresh();
}
async function tryOpen(){
  const pw=document.getElementById('pw').value;
  try{
    const html=await decrypt(pw);
    document.getElementById('content').innerHTML=html;
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){document.getElementById('err').textContent='パスフレーズが違います';}
}
document.getElementById('openbtn').addEventListener('click',tryOpen);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryOpen();});
</script>
