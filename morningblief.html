<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:0 0 40px;background:#f2f4f8;color:#1c2333;
 font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;line-height:1.7;
 -webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}
header.hd{background:linear-gradient(135deg,#3b4bd8 0%,#7b3fd4 55%,#c2379b 100%);
 color:#fff;padding:26px 0 30px;margin-bottom:18px;box-shadow:0 4px 18px rgba(40,40,90,.25)}
.hd .date{font-size:13px;opacity:.9;letter-spacing:.08em}
.hd h1{margin:4px 0 16px;font-size:26px;letter-spacing:.04em}
.hpbox{background:rgba(255,255,255,.16);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.hprow{display:flex;align-items:baseline;gap:8px;font-size:13px;margin-bottom:6px}
.hprow b{font-size:20px}
.hpbar{height:14px;border-radius:8px;background:rgba(0,0,0,.25);overflow:hidden}
.hpfill{height:100%;border-radius:8px;transition:width .35s ease}
.hpfill.ok{background:linear-gradient(90deg,#39d98a,#12b76a)}
.hpfill.warn{background:linear-gradient(90deg,#ffd166,#f5a524)}
.hpfill.bad{background:linear-gradient(90deg,#ff8a8a,#e5484d)}
.hpnote{font-size:11px;opacity:.85;margin-top:6px}
.quote{background:rgba(255,255,255,.16);border-radius:12px;padding:14px 16px}
.quote .q{font-size:16px;font-weight:700;letter-spacing:.02em}
.quote .s{font-size:12px;opacity:.9;margin-top:6px}
.card{background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:14px;
 box-shadow:0 2px 10px rgba(30,40,80,.07)}
.card h2{margin:0 0 12px;font-size:17px;letter-spacing:.02em;
 border-bottom:2px solid #eef0f6;padding-bottom:8px}
.card.boss{background:#2b1013;color:#ffe9e9;border:1px solid #6b1f26}
.card.boss h2{border-bottom-color:#6b1f26;color:#ff9b9b}
.card.self h2{color:#c92a2a}
.card.mem h2{color:#d9480f}
.card.today h2{color:#1971c2}
.card.next h2{color:#2f9e44}
ul.tl{list-style:none;margin:0;padding:0}
ul.tl li{display:flex;align-items:flex-start;gap:6px;padding:7px 0;border-bottom:1px dashed #e8ebf2}
ul.tl li:last-child{border-bottom:none}
label{display:flex;align-items:flex-start;gap:8px;flex:1;cursor:pointer}
label input{margin-top:5px;width:17px;height:17px;flex:none;accent-color:#3b4bd8}
.memo{font-size:24px;width:30px;text-align:center;flex:none;line-height:1.2}
.mtxt{flex:1}
.lv{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:#c92a2a;
 border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:2px}
.lv.s{background:#f08c00}
label.done .mtxt{text-decoration:line-through;opacity:.45}
label.done .memo{filter:grayscale(1);opacity:.35}
.over{color:#c92a2a;font-weight:700}
.due{color:#1971c2;font-weight:700}
.sub{font-size:12px;color:#6b7280;display:block;margin-top:2px}
.card.boss .sub{color:#d9a7a7}
.pri{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;
 padding:1px 8px;margin-right:6px;flex:none}
.p1{background:#ffe3e3;color:#c92a2a}
.p2{background:#fff3bf;color:#a06a00}
.p3{background:#d3f9d8;color:#2b8a3e}
.nlink{font-size:11px;color:#3b4bd8;text-decoration:none;border:1px solid #ccd3f5;
 border-radius:6px;padding:2px 7px;flex:none;white-space:nowrap;align-self:center}
.nlink:hover{background:#eef1ff}
.prog{font-size:12px;color:#6b7280;margin-top:10px}
.cal{list-style:none;margin:0;padding:0;font-size:14px}
.cal li{padding:5px 0;border-bottom:1px dashed #e8ebf2}
.cal li:last-child{border-bottom:none}
.cal b{color:#3b4bd8}
.sanbo{background:#f8f9ff;border-left:4px solid #3b4bd8;border-radius:8px;padding:12px 14px;font-size:14px}
.sanbo p{margin:0 0 10px}
.sanbo p:last-child{margin:0}
.src{font-size:12px;color:#6b7280}
.src a{color:#3b4bd8}
.src li{padding:3px 0}
@media(max-width:520px){.hd h1{font-size:21px}.card{padding:14px}}
</style>
<style>
#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#3b4bd8 0%,#7b3fd4 55%,#c2379b 100%);
 color:#fff;display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
#lockcard{background:rgba(255,255,255,.14);border-radius:16px;padding:28px 26px;max-width:360px;width:100%;text-align:center;
 backdrop-filter:blur(4px)}
#lockcard h2{margin:0 0 4px;font-size:22px}
#lockdate{font-size:13px;opacity:.9;margin-bottom:18px;letter-spacing:.06em}
#pw{width:100%;padding:11px 12px;border-radius:9px;border:none;font-size:16px;margin-bottom:10px;
 font-family:inherit;text-align:center}
#go{width:100%;padding:11px;border-radius:9px;border:none;background:#1c2333;color:#fff;
 font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
#go:disabled{opacity:.6;cursor:default}
#err{font-size:13px;margin-top:10px;min-height:18px;color:#ffd6d6}
</style>
</head>
<body>
<div id="content"></div>
<div id="lockgate"><div id="lockcard">
  <h2>🔒 朝ブリーフ</h2>
  <div id="lockdate">2026年9月2日（水）</div>
  <input id="pw" type="password" autocomplete="off" placeholder="パスフレーズ">
  <button id="go">開く</button>
  <div id="err"></div>
</div></div>

const SKEY='brief-2026-09-02';
function b642u8(s){const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s))}catch(e){}}
function refresh(){
  const boxes=[...document.querySelectorAll('#content input[type=checkbox]')];
  let selfLeft=0,memLeft=0,left=0;
  boxes.forEach(b=>{
    const id=b.dataset.id||'';
    if(!b.checked){left++;if(id.startsWith('self-'))selfLeft++;else if(id.startsWith('mem-'))memLeft++;}
    const lab=b.closest('label'); if(lab) lab.classList.toggle('done',b.checked);
  });
  let hp=100-selfLeft*10-memLeft*5;
  hp=Math.max(0,Math.min(100,hp));
  const v=document.getElementById('hpval'); if(v) v.textContent=hp;
  const f=document.getElementById('hpfill');
  if(f){f.style.width=hp+'%';f.className='hpfill '+(hp>=80?'ok':hp>=50?'warn':'bad');}
  const n=document.getElementById('hpnote');
  if(n) n.textContent='自分の期限切れ '+selfLeft+'件 ×-10 ／ メンバー切れ '+memLeft+'件 ×-5 ／ 毎朝100にリセット';
  const p=document.getElementById('prog');
  if(p) p.textContent = left===0 ? '🎉 全部やりきった！' : ('残り '+left+' 件');
}
function wire(){
  const st=loadState();
  document.querySelectorAll('#content input[type=checkbox]').forEach(b=>{
    const id=b.dataset.id; if(id&&st[id])b.checked=true;
    b.addEventListener('change',()=>{
      const s=loadState();
      if(b.checked)s[b.dataset.id]=1;else delete s[b.dataset.id];
      saveState(s); refresh();
    });
  });
  refresh();
}
async function unlock(){
  const btn=document.getElementById('go'), err=document.getElementById('err');
  const pass=document.getElementById('pw').value;
  btn.disabled=true; err.textContent='復号中…';
  try{
    const enc=new TextEncoder();
    const bk=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b642u8(ENC.salt),iterations:ENC.it,hash:'SHA-256'},
      bk,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b642u8(ENC.iv)},key,b642u8(ENC.ct));
    document.getElementById('content').innerHTML=new TextDecoder().decode(pt);
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){
    err.textContent='パスフレーズが違います';
    btn.disabled=false;
  }
}
document.getElementById('go').addEventListener('click',unlock);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
document.getElementById('pw').focus();
</script>
