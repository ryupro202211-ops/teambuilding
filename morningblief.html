<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:0 0 40px;background:#eef1f6;color:#1e2430;
 font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
 line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}
header{background:linear-gradient(135deg,#3b4b7a 0%,#6a4b8f 55%,#a4487a 100%);
 color:#fff;padding:26px 0 22px;margin-bottom:18px;box-shadow:0 3px 14px rgba(0,0,0,.18)}
header .wrap{padding:0 18px}
.hdate{font-size:13px;opacity:.85;letter-spacing:.08em}
h1{margin:4px 0 16px;font-size:25px;letter-spacing:.02em}
.hp{background:rgba(255,255,255,.14);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.hprow{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.hplabel{font-size:13px;font-weight:700;letter-spacing:.06em}
.hpnum{margin-left:auto;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.hptrack{height:14px;background:rgba(0,0,0,.28);border-radius:8px;overflow:hidden}
.hpfill{height:100%;width:0;border-radius:8px;transition:width .35s ease,background .35s ease}
.hpfill.ok{background:linear-gradient(90deg,#3ddc84,#19b465)}
.hpfill.warn{background:linear-gradient(90deg,#ffd452,#f0a020)}
.hpfill.bad{background:linear-gradient(90deg,#ff7a7a,#e03131)}
.hpdetail{margin-top:7px;font-size:11.5px;opacity:.82}
.quote{background:rgba(255,255,255,.12);border-left:4px solid rgba(255,255,255,.6);
 border-radius:0 10px 10px 0;padding:11px 14px}
.quote .qt{font-size:15.5px;font-weight:700}
.quote .qs{font-size:12px;opacity:.85;margin-top:5px}
.quote .qn{font-size:12px;opacity:.8;margin-top:6px;line-height:1.6}
.card{background:#fff;border-radius:14px;padding:17px 18px;margin-bottom:15px;
 box-shadow:0 2px 8px rgba(30,36,48,.08)}
.card h2{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h2 .cnt{font-size:12px;font-weight:400;color:#7a8299;margin-left:auto}
.card.boss{background:#3a1620;color:#ffe9ec;box-shadow:0 3px 14px rgba(90,10,25,.35)}
.card.boss h2{color:#ff9aa8}
.bossbody{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bossemo{font-size:30px;line-height:1}
.bossname{font-size:17px;font-weight:700}
.bossmeta{font-size:12.5px;opacity:.86;margin-top:3px}
.sub{font-weight:700;font-size:14px;margin:14px 0 8px;padding-left:9px;border-left:4px solid #ccc}
.sub.self{border-color:#e03131;color:#c92a2a}
.sub.mem{border-color:#f08c00;color:#d9480f}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid #f0f2f6}
li:last-child{border-bottom:none}
label{flex:1;display:flex;align-items:flex-start;gap:9px;cursor:pointer}
label input{margin-top:5px;width:17px;height:17px;flex:0 0 auto;cursor:pointer}
.memo{font-size:24px;width:30px;text-align:center;flex:0 0 auto;line-height:1.2}
.mtxt{flex:1;min-width:0}
.lv{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:#868e96;
 border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.lv.l1{background:#74b816}.lv.l3{background:#f59f00}
.lv.l5{background:#f76707}.lv.l7{background:#e8590c}.lv.l9{background:#c2255c}
.over{color:#c92a2a;font-weight:700}
.meta{font-size:12px;color:#7a8299;margin-top:2px;display:block}
label.done .mtxt{text-decoration:line-through;opacity:.45}
label.done .memo{filter:grayscale(1);opacity:.35}
.nlink{flex:0 0 auto;font-size:11.5px;color:#5c7cfa;text-decoration:none;
 border:1px solid #dbe4ff;border-radius:6px;padding:2px 7px;margin-top:3px;white-space:nowrap}
.nlink:hover{background:#edf2ff}
.pri{display:inline-block;font-size:11px;border-radius:5px;padding:1px 7px;margin-right:6px;
 font-weight:700;vertical-align:1px}
.pri.p1{background:#ffe3e3;color:#c92a2a}
.pri.p2{background:#fff3bf;color:#a37200}
.pri.p3{background:#d3f9d8;color:#2b8a3e}
.prog{font-size:12.5px;color:#5c6479;margin-top:11px;padding-top:9px;border-top:1px dashed #dde2ec}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid #f0f2f6;vertical-align:top}
th{font-size:12px;color:#7a8299;font-weight:700;white-space:nowrap}
td.d{white-space:nowrap;color:#495057;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;background:#f1f3f5;color:#495057;
 border-radius:4px;padding:1px 6px;margin:1px 4px 1px 0}
.tag.me{background:#e7f5ff;color:#1864ab;font-weight:700}
.advice p{margin:0 0 11px;font-size:14.5px}
.advice p:last-child{margin-bottom:0}
.advice strong{color:#c92a2a}
.advice .num{color:#3b4b7a;font-weight:700}
.src{font-size:13px}
.src li{display:block;padding:5px 0}
.src a{color:#3b5bdb;word-break:break-all}
.src code{background:#f1f3f5;border-radius:4px;padding:1px 5px;font-size:12px}
.empty{color:#868e96;font-size:13.5px}
#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#2b3556,#5a3a6e);
 display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.lockbox{background:#fff;border-radius:16px;padding:30px 26px;max-width:340px;width:100%;
 text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.lockbox h2{margin:0 0 4px;font-size:20px}
#lockdate{font-size:13px;color:#7a8299;margin-bottom:18px}
.lockbox input{width:100%;padding:11px 13px;font-size:16px;border:1.5px solid #ced4da;
 border-radius:9px;margin-bottom:11px;font-family:inherit}
.lockbox button{width:100%;padding:11px;font-size:15px;font-weight:700;color:#fff;
 background:linear-gradient(135deg,#3b4b7a,#a4487a);border:none;border-radius:9px;cursor:pointer;
 font-family:inherit}
#lockerr{color:#c92a2a;font-size:13px;margin-top:10px;min-height:19px}
@media(max-width:520px){h1{font-size:21px}.card{padding:14px 13px}.memo{font-size:21px;width:26px}}
</style>
</head>
<body>
<div id="content"></div>
<div id="lockgate">
 <div class="lockbox">
  <h2>🔒 朝ブリーフ</h2>
  <div id="lockdate">2026年8月28日（金）</div>
  <input type="password" id="pw" placeholder="パスフレーズ" autocomplete="off">
  <button id="go">開く</button>
  <div id="lockerr"></div>
 </div>
</div>

const SKEY = 'brief-2026-08-28';
const SELF_PENALTY = 10, MEM_PENALTY = 5;
function loadState(){
  try { return JSON.parse(localStorage.getItem(SKEY) || '{}'); } catch(e){ return {}; }
}
function saveState(s){
  try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch(e){}
}
function refresh(){
  var boxes = Array.prototype.slice.call(document.querySelectorAll('#content input[type=checkbox]'));
  var hp = 100, left = 0;
  boxes.forEach(function(b){
    var id = b.getAttribute('data-id') || '';
    var lab = b.closest('label');
    if (b.checked) { if (lab) lab.classList.add('done'); }
    else {
      if (lab) lab.classList.remove('done');
      left++;
      if (id.indexOf('self-') === 0) hp -= SELF_PENALTY;
      else if (id.indexOf('mem-') === 0) hp -= MEM_PENALTY;
    }
  });
  hp = Math.max(0, Math.min(100, hp));
  var v = document.getElementById('hpval');
  var bar = document.getElementById('hpbar');
  if (v) v.textContent = hp;
  if (bar) {
    bar.style.width = hp + '%';
    bar.className = 'hpfill ' + (hp >= 80 ? 'ok' : hp >= 50 ? 'warn' : 'bad');
  }
  var su = boxes.filter(function(b){ return (b.getAttribute('data-id')||'').indexOf('self-')===0 && !b.checked; }).length;
  var mu = boxes.filter(function(b){ return (b.getAttribute('data-id')||'').indexOf('mem-')===0 && !b.checked; }).length;
  var d = document.getElementById('hpdetail');
  if (d) d.textContent = '自分の期限切れ ' + su + '件 \u00d7-' + SELF_PENALTY + ' ／ メンバー切れ ' + mu + '件 \u00d7-' + MEM_PENALTY + ' ／ 毎朝100にリセット';
  var p = document.getElementById('prog');
  if (p) p.textContent = left === 0 ? '🎉 全部やりきった！' : '残り ' + left + ' 件';
}
function wire(){
  var st = loadState();
  var boxes = document.querySelectorAll('#content input[type=checkbox]');
  Array.prototype.forEach.call(boxes, function(b){
    var id = b.getAttribute('data-id');
    if (st[id]) b.checked = true;
    b.addEventListener('change', function(){
      var s = loadState();
      if (b.checked) s[id] = 1; else delete s[id];
      saveState(s);
      refresh();
    });
  });
  refresh();
}
function b64(s){
  var bin = atob(s); var a = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i);
  return a;
}
async function unlock(){
  var err = document.getElementById('lockerr');
  var pass = document.getElementById('pw').value;
  err.textContent = '解錠中…';
  try {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64(ENC.salt), iterations:ENC.it, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(ENC.iv) }, key, b64(ENC.ct));
    document.getElementById('content').innerHTML = new TextDecoder().decode(pt);
    document.getElementById('lockgate').style.display = 'none';
    wire();
  } catch(e) {
    err.textContent = 'パスフレーズが違います';
  }
}
document.getElementById('go').addEventListener('click', unlock);
document.getElementById('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') unlock(); });
