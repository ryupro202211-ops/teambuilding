<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔒 朝ブリーフ</title>
<style>
:root{--red:#e74c3c;--org:#e67e22;--grn:#27ae60;--ylw:#f1c40f;--ink:#2c3e50;--bg:#f4f6f8;--card:#fff;}
*{box-sizing:border-box;}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;}
.wrap{max-width:820px;margin:0 auto;padding:16px;}
header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-radius:18px;padding:22px;box-shadow:0 6px 20px rgba(0,0,0,.15);}
header h1{margin:0 0 4px;font-size:20px;}
header .date{font-size:14px;opacity:.9;}
.hpwrap{margin:14px 0 6px;}
.hpbar{height:22px;background:rgba(255,255,255,.25);border-radius:12px;overflow:hidden;}
.hpfill{height:100%;border-radius:12px;transition:width .5s;}
.hpfill.ok{background:#2ecc71;}.hpfill.warn{background:#f1c40f;}.hpfill.bad{background:#e74c3c;}
.hpmeta{font-size:12px;opacity:.9;margin-top:4px;}
.quote{margin-top:14px;background:rgba(255,255,255,.15);border-left:4px solid #fff;padding:10px 14px;border-radius:8px;font-size:15px;}
.quote small{display:block;opacity:.85;margin-top:4px;font-size:12px;}
.card{background:var(--card);border-radius:16px;padding:18px;margin-top:16px;box-shadow:0 3px 10px rgba(0,0,0,.06);}
.card h2{margin:0 0 12px;font-size:16px;border-bottom:2px solid #eee;padding-bottom:8px;}
.card.selfbox{border-left:6px solid var(--red);}
.card.membox{border-left:6px solid var(--org);}
ul.chk{list-style:none;margin:0;padding:0;}
ul.chk li{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed #eee;}
ul.chk li label{flex:1;display:flex;align-items:flex-start;gap:8px;cursor:pointer;}
ul.chk li label.done .mtxt{text-decoration:line-through;color:#aaa;}
ul.chk li label.done .memo{filter:grayscale(1);opacity:.35;}
.lv{display:inline-block;background:#34495e;color:#fff;font-size:11px;padding:1px 6px;border-radius:8px;margin-left:4px;vertical-align:middle;}
.memo{font-size:24px;width:30px;text-align:center;flex-shrink:0;}
.over{color:var(--red);font-weight:bold;}
.nlink{font-size:12px;color:#667eea;text-decoration:none;white-space:nowrap;align-self:center;}
.nlink:hover{text-decoration:underline;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th,td{border:1px solid #eee;padding:8px;text-align:left;}
th{background:#f8f9fb;}
.pri{display:inline-block;padding:1px 8px;border-radius:8px;font-size:12px;color:#fff;}
.p1{background:var(--red);}.p2{background:var(--ylw);color:#333;}.p3{background:var(--grn);}
.prog{font-size:13px;color:#667eea;margin-top:8px;font-weight:bold;}
.muted{color:#888;font-size:13px;}
a{color:#667eea;}
.boss{background:#2b0d0d;color:#ffdada;border-left:6px solid #c0392b;}
.bossemo{font-size:30px;}
</style>
<style>
#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:#fff;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;}
#lockgate h1{font-size:20px;margin-bottom:16px;}
#lockgate input{padding:10px 14px;font-size:16px;border:none;border-radius:10px;width:220px;text-align:center;}
#lockgate button{margin-top:12px;padding:10px 24px;font-size:15px;border:none;border-radius:10px;background:#2c3e50;color:#fff;cursor:pointer;}
#lgerr{margin-top:10px;color:#ffd0d0;font-size:13px;min-height:18px;}
</style>
</head>
<body>
<div id="lockgate">
<h1>🔒 朝ブリーフ</h1>
<input id="pw" type="password" placeholder="パスフレーズ" autofocus>
<button id="openbtn">開く</button>
<div id="lgerr"></div>
</div>
<div id="content"></div>

const SKEY="brief-2026-08-02";
function b642u8(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function decrypt(pass){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b642u8(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b642u8(ENC.iv)},key,b642u8(ENC.ct));
  return new TextDecoder().decode(pt);
}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}');}catch(e){return {};}}
function saveState(s){localStorage.setItem(SKEY,JSON.stringify(s));}
function refresh(){
  let self=0,mem=0;
  document.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    const id=cb.dataset.id||'';
    const lab=cb.closest('label');
    if(cb.checked){lab&&lab.classList.add('done');}else{lab&&lab.classList.remove('done');}
    if(!cb.checked){if(id.startsWith('self-'))self++;if(id.startsWith('mem-'))mem++;}
  });
  let hp=100-self*10-mem*5;hp=Math.max(0,Math.min(100,hp));
  const f=document.getElementById('hpfill'),v=document.getElementById('hpval');
  if(f){f.style.width=hp+'%';f.className='hpfill '+(hp>=80?'ok':hp>=50?'warn':'bad');}
  if(v)v.textContent=hp;
  const tds=[...document.querySelectorAll('input[data-id^="td-"]')];
  const left=tds.filter(c=>!c.checked).length;
  const p=document.getElementById('prog');
  if(p)p.textContent=left===0?'全部やりきった！':('残り '+left+' 件');
}
function wire(){
  const st=loadState();
  document.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    const id=cb.dataset.id;
    if(id&&st[id])cb.checked=true;
    cb.addEventListener('change',()=>{const s=loadState();s[cb.dataset.id]=cb.checked;saveState(s);refresh();});
  });
  refresh();
}
async function open(){
  const pw=document.getElementById('pw').value;
  try{
    const html=await decrypt(pw);
    document.getElementById('content').innerHTML=html;
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){document.getElementById('lgerr').textContent='パスフレーズが違います';}
}
document.getElementById('openbtn').addEventListener('click',open);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')open();});
</script>
