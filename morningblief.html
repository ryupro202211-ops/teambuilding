<title>🔒 朝ブリーフ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef1f6;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,sans-serif;color:#1d2433;line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:16px}
header{background:linear-gradient(135deg,#4a6cf7 0%,#8b5cf6 55%,#ec4899 100%);color:#fff;border-radius:18px;padding:22px 24px;box-shadow:0 8px 24px rgba(74,108,247,.28)}
header .date{font-size:13px;opacity:.9;letter-spacing:.05em}
header h1{margin:4px 0 14px;font-size:24px;font-weight:800}
.hpbox{background:rgba(255,255,255,.16);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.hprow{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.hpbar{flex:1;height:14px;background:rgba(0,0,0,.22);border-radius:99px;overflow:hidden}
.hpfill{height:100%;border-radius:99px;transition:width .35s ease,background .35s ease}
.hpfill.ok{background:linear-gradient(90deg,#34d399,#10b981)}
.hpfill.warn{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.hpfill.bad{background:linear-gradient(90deg,#f87171,#ef4444)}
.hpnote{font-size:11px;opacity:.85;margin-top:6px}
.quote{background:rgba(255,255,255,.16);border-radius:12px;padding:12px 14px}
.quote .q{font-size:15px;font-weight:700}
.quote .s{font-size:12px;opacity:.88;margin-top:5px;text-align:right}
.card{background:#fff;border-radius:16px;padding:18px 20px;margin-top:14px;box-shadow:0 2px 10px rgba(29,36,51,.07)}
.card h2{margin:0 0 12px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.card.boss{background:#2b0f14;color:#ffe4e6;border:2px solid #9f1239}
.card.boss h2{color:#fecdd3}
.card.self{border-left:6px solid #ef4444}
.card.mem{border-left:6px solid #f97316}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed #e3e8f0}
li:last-child{border-bottom:none}
label{flex:1;display:flex;align-items:flex-start;gap:8px;cursor:pointer}
input[type=checkbox]{margin-top:5px;width:17px;height:17px;flex:none;accent-color:#4a6cf7;cursor:pointer}
.memo{font-size:24px;width:30px;text-align:center;flex:none;line-height:1.2}
.mtxt{flex:1}
.lv{display:inline-block;background:#9f1239;color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.over{color:#dc2626;font-weight:800}
.sub{display:block;font-size:12px;color:#64748b;margin-top:2px}
.card.boss .sub{color:#fda4af}
label.done .mtxt{text-decoration:line-through;opacity:.45}
label.done .memo{filter:grayscale(1);opacity:.35}
.nlink{flex:none;font-size:11px;color:#4a6cf7;text-decoration:none;border:1px solid #c7d2fe;border-radius:6px;padding:2px 7px;white-space:nowrap;align-self:center}
.nlink:hover{background:#eef2ff}
.pr{font-size:15px;flex:none;width:24px;text-align:center}
.bossemo{font-size:30px}
.empty{color:#059669;font-weight:700;font-size:14px}
.cal li{display:block;padding:7px 0}
.cal .tm{display:inline-block;background:#eef2ff;color:#4338ca;font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px;margin-right:8px}
.tag{display:inline-block;font-size:11px;border-radius:5px;padding:1px 6px;margin-right:6px;background:#f1f5f9;color:#64748b;flex:none}
#prog{font-size:13px;color:#4a6cf7;font-weight:700;margin-top:10px}
.src a{color:#4a6cf7;font-size:13px;word-break:break-all}
.src li{display:block;padding:5px 0}
.adv{background:#fffbeb;border-left:6px solid #f59e0b}
.adv p{margin:0 0 10px;font-size:14px}
.adv p:last-child{margin-bottom:0}
#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#4a6cf7,#8b5cf6,#ec4899);display:flex;align-items:center;justify-content:center;z-index:99}
.lockbox{background:#fff;border-radius:18px;padding:30px 34px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3);max-width:330px}
.lockbox h2{margin:0 0 4px;font-size:20px}
#lockdate{font-size:13px;color:#64748b;margin-bottom:16px}
.lockbox input{width:100%;padding:11px 13px;font-size:15px;border:2px solid #dbe1ea;border-radius:10px;margin-bottom:10px;text-align:center}
.lockbox button{width:100%;padding:11px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,#4a6cf7,#8b5cf6);border:0;border-radius:10px;cursor:pointer}
#lockerr{color:#dc2626;font-size:13px;margin-top:9px;min-height:18px}
</style>

const SKEY='brief-2026-09-01';
const D=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY))||{}}catch(e){return {}}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s))}catch(e){}}
function refresh(){
 var boxes=document.querySelectorAll('#content input[type=checkbox]');
 var left=0,s2=0,m2=0;
 boxes.forEach(function(b){
  var id=b.getAttribute('data-id')||'';
  if(b.checked){b.closest('label').classList.add('done')}else{b.closest('label').classList.remove('done');left++}
 });
 var seen={};
 boxes.forEach(function(b){var id=b.getAttribute('data-id')||'';if(seen[id])return;seen[id]=1;
  if(!b.checked){if(id.indexOf('self-')===0)s2++;if(id.indexOf('mem-')===0)m2++;}});
 var hp=Math.max(0,Math.min(100,100-s2*10-m2*5));
 var f=document.getElementById('hpfill'),v=document.getElementById('hpval');
 if(f){f.style.width=hp+'%';f.className='hpfill '+(hp>=80?'ok':hp>=50?'warn':'bad')}
 if(v)v.textContent=hp;
 var p=document.getElementById('prog');
 if(p)p.textContent=left>0?('残り '+left+' 件'):'🎉 全部やりきった！';
}
function wire(){
 var st=loadState();
 document.querySelectorAll('#content input[type=checkbox]').forEach(function(b){
  var id=b.getAttribute('data-id');
  if(st[id])b.checked=true;
  b.addEventListener('change',function(){var s=loadState();s[id]=b.checked;saveState(s);refresh()});
 });
 refresh();
}
async function open_(){
 var pw=document.getElementById('pw').value;
 var err=document.getElementById('lockerr');
 err.textContent='復号中…';
 try{
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:D(ENC.salt),iterations:ENC.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:D(ENC.iv)},key,D(ENC.ct));
  document.getElementById('content').innerHTML=new TextDecoder().decode(pt);
  document.getElementById('lockgate').style.display='none';
  wire();
 }catch(e){err.textContent='パスフレーズが違います'}
}
document.getElementById('go').addEventListener('click',open_);
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')open_()});</script>
