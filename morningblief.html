<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:0 0 40px;background:#f2f4f8;color:#1f2937;
 font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}
.hd{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 50%,#db2777 100%);color:#fff;
 border-radius:0 0 22px 22px;padding:26px 22px 22px;margin:0 -14px 20px;box-shadow:0 6px 20px rgba(79,70,229,.28)}
.hd .date{font-size:13px;opacity:.9;letter-spacing:.05em}
.hd h1{margin:4px 0 16px;font-size:24px;font-weight:800;letter-spacing:.02em}
.hpbox{background:rgba(255,255,255,.16);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.hplabel{font-size:15px;font-weight:700;margin-bottom:6px}
.hpbar{height:14px;background:rgba(0,0,0,.25);border-radius:8px;overflow:hidden}
.hpbar>div{height:100%;border-radius:8px;transition:width .3s}
.hpbar>div.ok{background:linear-gradient(90deg,#34d399,#10b981)}
.hpbar>div.warn{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.hpbar>div.bad{background:linear-gradient(90deg,#f87171,#ef4444)}
.hpnote{font-size:11px;opacity:.88;margin-top:5px}
.quote{background:rgba(255,255,255,.14);border-left:4px solid rgba(255,255,255,.7);
 border-radius:8px;padding:12px 14px;font-size:15px;font-weight:600}
.qsrc{font-size:12px;font-weight:400;opacity:.85}
.card{background:#fff;border-radius:16px;padding:18px 20px;margin-bottom:16px;
 box-shadow:0 2px 10px rgba(15,23,42,.07)}
.card h2{margin:0 0 12px;font-size:17px;font-weight:800;letter-spacing:.02em}
.card.red{background:#fff5f5;border:2px solid #fecaca}
.card.red h2{color:#b91c1c}
.card.orange{background:#fff8f1;border:2px solid #fed7aa}
.card.orange h2{color:#c2410c}
.card.yellow{background:#fffbeb;border:2px solid #fde68a}
.card.yellow h2{color:#a16207}
.card.blue{background:#f0f7ff;border:2px solid #bfdbfe}
.card.blue h2{color:#1d4ed8}
.card.boss{background:#2a0d12;border:2px solid #7f1d1d;color:#fee2e2}
.card.boss h2{color:#fca5a5}
ul.chk{list-style:none;margin:0;padding:0}
ul.chk>li{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px dashed #e5e7eb}
ul.chk>li:last-child{border-bottom:none}
ul.chk label{flex:1;display:flex;align-items:flex-start;gap:8px;cursor:pointer}
ul.chk input{margin-top:5px;width:17px;height:17px;flex:none;cursor:pointer}
.memo{font-size:24px;width:30px;text-align:center;flex:none;line-height:1.2}
.pri{font-size:17px;width:26px;text-align:center;flex:none;line-height:1.5}
.mtxt{flex:1;font-size:14px}
.lv{display:inline-block;background:#1f2937;color:#fff;font-size:11px;font-weight:700;
 border-radius:5px;padding:1px 6px;margin-right:5px;vertical-align:1px}
.over{color:#dc2626}
.src{display:inline-block;background:#eef2ff;color:#4338ca;font-size:10px;
 border-radius:4px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.act{font-size:12.5px;color:#6b7280}
label.done .mtxt{text-decoration:line-through;opacity:.45}
label.done .memo{filter:grayscale(1);opacity:.35}
.nlink{flex:none;font-size:11.5px;color:#4338ca;text-decoration:none;
 border:1px solid #c7d2fe;border-radius:6px;padding:2px 8px;white-space:nowrap;align-self:center}
.nlink:hover{background:#eef2ff}
.nlink.inline{align-self:auto;display:inline-block;margin-left:6px}
ul.plain{margin:0;padding-left:20px;font-size:14px}
ul.plain>li{margin-bottom:6px}
ul.plain.small{font-size:12.5px}
.note{font-size:12.5px;color:#6b7280;margin:10px 0 0}
.card p{font-size:14px;margin:0 0 10px}
.card p:last-child{margin-bottom:0}
a{color:#4338ca}
code{background:#f3f4f6;border-radius:4px;padding:1px 5px;font-size:11.5px}
#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#db2777);
 display:flex;align-items:center;justify-content:center;z-index:99}
#lockbox{background:#fff;border-radius:18px;padding:30px 26px;width:min(340px,88vw);text-align:center;
 box-shadow:0 12px 40px rgba(0,0,0,.3)}
#lockbox h2{margin:0 0 6px;font-size:19px;color:#1f2937}
#lockbox p{font-size:12.5px;color:#6b7280;margin:0 0 16px}
#pw{width:100%;padding:11px 12px;font-size:15px;border:2px solid #ddd6fe;border-radius:9px;outline:none}
#pw:focus{border-color:#7c3aed}
#go{width:100%;margin-top:11px;padding:11px;font-size:15px;font-weight:700;color:#fff;border:none;
 border-radius:9px;background:linear-gradient(135deg,#4f46e5,#7c3aed);cursor:pointer}
#err{color:#dc2626;font-size:12.5px;margin-top:9px;min-height:18px}

</style>
</head><body>

const SKEY='brief-2026-08-18';
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s))}catch(e){}}
function refresh(){
  var st=loadState(),hp=100,left=0;
  document.querySelectorAll('#content input[type=checkbox]').forEach(function(b){
    var id=b.dataset.id,done=!!st[id];
    b.checked=done;
    b.closest('label').classList.toggle('done',done);
    if(!done){
      left++;
      if(id.indexOf('self-')===0)hp-=10;
      else if(id.indexOf('mem-')===0)hp-=5;
    }
  });
  hp=Math.max(0,Math.min(100,hp));
  var v=document.getElementById('hpval'),f=document.getElementById('hpfill'),p=document.getElementById('prog');
  if(v)v.textContent=hp;
  if(f){f.style.width=hp+'%';f.className=hp>=80?'ok':(hp>=50?'warn':'bad');}
  if(p)p.textContent=left===0?'全部やりきった！':('残り '+left+' 件');
}
function wire(){
  document.querySelectorAll('#content input[type=checkbox]').forEach(function(b){
    b.addEventListener('change',function(){
      var st=loadState();
      if(b.checked)st[b.dataset.id]=1;else delete st[b.dataset.id];
      saveState(st);refresh();
    });
  });
  refresh();
}
function b64(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
async function unlock(){
  var pw=document.getElementById('pw').value,err=document.getElementById('err');
  err.textContent='復号中…';
  try{
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.it,hash:'SHA-256'},
          km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},k,b64(ENC.ct));
    document.getElementById('content').innerHTML=new TextDecoder().decode(pt);
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){err.textContent='パスフレーズが違います';}
}
document.getElementById('go').addEventListener('click',unlock);
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')unlock();});

</script>
