<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
:root{--bg:#0f1220;--card:#1a1e33;--ink:#e8ebff;--sub:#9aa3c7;--red:#ff5470;--org:#ff9f43;--grn:#2ec77d;--yel:#ffd23f;--acc:#6c7bff;}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#0b0e1a,#151a30);color:var(--ink);font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;line-height:1.6;padding:16px;}
.hdr{background:linear-gradient(135deg,#5b6bff,#9b4dff);border-radius:20px;padding:22px 20px;box-shadow:0 10px 30px rgba(90,80,255,.35);margin-bottom:16px;}
.hdr .date{font-size:13px;opacity:.9}
.hdr h1{margin:4px 0 14px;font-size:24px}
.hpwrap{margin:10px 0}
.hplabel{font-size:14px;font-weight:700;margin-bottom:4px}
.hpbar{height:16px;background:rgba(0,0,0,.28);border-radius:10px;overflow:hidden}
.hpfill{height:100%;width:85%;border-radius:10px;transition:width .5s,background .5s}
.hpnote{font-size:11px;opacity:.85;margin-top:5px}
.quote{margin-top:14px;font-size:15px;font-style:italic;background:rgba(255,255,255,.12);padding:10px 14px;border-radius:12px}
.qsrc{display:block;font-size:12px;opacity:.85;font-style:normal;margin-top:4px;text-align:right}
.prog{margin-top:10px;font-size:13px;font-weight:700}
.card{background:var(--card);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.card h2{margin:0 0 12px;font-size:17px}
.alert .box{border-radius:12px;padding:12px 14px;margin-bottom:10px}
.box.self{background:rgba(255,84,112,.12);border:1px solid rgba(255,84,112,.4)}
.box.mem{background:rgba(255,159,67,.12);border:1px solid rgba(255,159,67,.4)}
.boxhead{font-weight:800;margin-bottom:8px}
.box.self .boxhead{color:var(--red)}
.box.mem .boxhead{color:var(--org)}
ul.tlist,ul.todo,ul.plain{list-style:none;margin:0;padding:0}
ul.tlist li,ul.todo li{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
ul.tlist li label,ul.todo li label{display:flex;align-items:flex-start;gap:8px;flex:1;cursor:pointer}
input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--acc);flex:none}
.memo{font-size:24px;width:30px;text-align:center;flex:none;line-height:1.1}
.lv{font-size:12px;font-weight:800;background:rgba(255,255,255,.15);border-radius:6px;padding:1px 6px;flex:none;margin-top:3px}
.mtxt{flex:1}
.mtxt b{color:var(--red)}
.sub{font-size:12px;color:var(--sub)}
.sub2{font-size:13px;font-weight:700;color:var(--acc);margin:10px 0 4px}
.pri{font-size:12px;font-weight:800;flex:none;margin-top:2px}
.p-red .pri{color:var(--red)}
.p-yel .pri{color:var(--yel)}
.p-grn .pri{color:var(--grn)}
.nlink{font-size:12px;color:#9fb2ff;text-decoration:none;white-space:nowrap;margin-top:3px}
.nlink:hover{text-decoration:underline}
ul.plain li{padding:4px 0;font-size:14px}
.warn{color:var(--org);font-weight:600}
label.done .mtxt{text-decoration:line-through;opacity:.5}
label.done .memo{filter:grayscale(1);opacity:.35}
.comment p{font-size:14px}
.src{opacity:.9}
#lockgate{position:fixed;inset:0;background:linear-gradient(160deg,#0b0e1a,#1a1030);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:99;padding:20px}
#lockgate h2{font-size:20px;margin:0}
#lockgate input{padding:12px 14px;border-radius:10px;border:1px solid #444;background:#141830;color:#fff;font-size:16px;width:min(320px,80vw)}
#lockgate button{padding:11px 26px;border:0;border-radius:10px;background:linear-gradient(135deg,#5b6bff,#9b4dff);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
#lockerr{color:#ff6b81;font-size:13px;min-height:16px}
</style>
</head>
<body>
<div id="lockgate">
  <h2>🔒 朝ブリーフ</h2>
  <input id="pass" type="password" placeholder="パスフレーズを入力" autocomplete="off">
  <button id="open">開く</button>
  <div id="lockerr"></div>
</div>
<div id="app"></div>

const SKEY = "brief-2026-08-04";
function b64ToBuf(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function decrypt(pass){
  const enc=new TextEncoder();
  const keyMat=await crypto.subtle.importKey('raw',enc.encode(pass),{name:'PBKDF2'},false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64ToBuf(ENC.salt),iterations:ENC.it,hash:'SHA-256'},keyMat,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBuf(ENC.iv)},key,b64ToBuf(ENC.ct));
  return new TextDecoder().decode(pt);
}
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){return {}}}
function saveState(s){localStorage.setItem(SKEY,JSON.stringify(s))}
function refresh(){
  const boxes=[...document.querySelectorAll('#content input[type=checkbox]')];
  let unSelf=0,unMem=0,done=0;
  boxes.forEach(b=>{
    const id=b.getAttribute('data-id');
    if(b.checked){done++;b.closest('label').classList.add('done');}
    else{b.closest('label').classList.remove('done');
      if(id&&id.indexOf('self-')===0)unSelf++;
      if(id&&id.indexOf('mem-')===0)unMem++;
    }
  });
  let hp=100-unSelf*10-unMem*5; if(hp<0)hp=0; if(hp>100)hp=100;
  const fill=document.getElementById('hpfill');const val=document.getElementById('hpval');
  if(fill){fill.style.width=hp+'%';fill.style.background=hp>=80?'var(--grn)':(hp>=50?'var(--yel)':'var(--red)');}
  if(val)val.textContent=hp;
  const rem=boxes.length-done;
  const prog=document.getElementById('prog');
  if(prog)prog.textContent=rem===0?'🎉 全部やりきった！':('残り '+rem+' 件');
}
function wire(){
  const st=loadState();
  const boxes=[...document.querySelectorAll('#content input[type=checkbox]')];
  boxes.forEach(b=>{
    const id=b.getAttribute('data-id');
    if(st[id])b.checked=true;
    b.addEventListener('change',()=>{const s=loadState();s[id]=b.checked;saveState(s);refresh();});
  });
  refresh();
}
document.getElementById('open').addEventListener('click',async()=>{
  const p=document.getElementById('pass').value;
  try{
    const html=await decrypt(p);
    document.getElementById('app').innerHTML=html;
    document.getElementById('lockgate').style.display='none';
    wire();
  }catch(e){document.getElementById('lockerr').textContent='パスフレーズが違います';}
});
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('open').click();});
</script>
