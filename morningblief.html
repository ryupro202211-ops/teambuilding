<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔒 朝ブリーフ</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:0 0 40px;background:#eef1f6;color:#1f2430;
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}
header.hd{background:linear-gradient(135deg,#4c6ef5 0%,#7048e8 55%,#c2255c 100%);
  color:#fff;padding:26px 18px 22px;border-radius:0 0 22px 22px;box-shadow:0 6px 22px rgba(76,110,245,.28)}
header.hd .date{font-size:13px;opacity:.9;letter-spacing:.06em}
header.hd h1{margin:4px 0 16px;font-size:24px;font-weight:800;letter-spacing:.02em}
.hpbox{background:rgba(255,255,255,.16);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.hprow{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:7px}
.hpnum{font-size:20px;font-weight:800}
.hpbar{height:14px;border-radius:9px;background:rgba(0,0,0,.22);overflow:hidden}
.hpfill{height:100%;border-radius:9px;transition:width .35s ease,background .35s ease}
.hpfill.ok{background:linear-gradient(90deg,#37b24d,#69db7c)}
.hpfill.warn{background:linear-gradient(90deg,#f59f00,#ffd43b)}
.hpfill.bad{background:linear-gradient(90deg,#e03131,#ff8787)}
.hpcalc{font-size:11px;opacity:.88;margin-top:7px;line-height:1.5}
.quote{background:rgba(255,255,255,.16);border-radius:14px;padding:13px 15px}
.quote .qt{font-size:16px;font-weight:700;line-height:1.65}
.quote .qs{font-size:12px;opacity:.9;margin-top:6px;text-align:right}
.card{background:#fff;border-radius:16px;padding:16px 16px 14px;margin:16px 0;
  box-shadow:0 2px 10px rgba(31,36,48,.07)}
.card h2{margin:0 0 12px;font-size:16px;font-weight:800;letter-spacing:.01em}
.card.boss{background:#2b1114;color:#ffe3e3;border:1px solid #7a2230}
.card.boss h2{color:#ff8787}
.card.self{border-left:6px solid #e03131}
.card.self h2{color:#c92a2a}
.card.mem{border-left:6px solid #f76707}
.card.mem h2{color:#d9480f}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-top:1px solid #eceef3}
ul.list li:first-child{border-top:0}
label.it{flex:1;display:flex;align-items:flex-start;gap:8px;cursor:pointer;min-width:0}
label.it input{margin:5px 0 0;width:17px;height:17px;flex:0 0 auto;cursor:pointer}
.memo{font-size:24px;width:30px;text-align:center;flex:0 0 30px;line-height:1.2}
.mtxt{flex:1;min-width:0;font-size:14px}
.mtxt .nm{font-weight:700}
.mtxt .sb{display:block;font-size:12px;color:#69707d;margin-top:2px}
.lv{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:#e03131;
  border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.lv.s{background:#f76707}
.over{color:#c92a2a;font-weight:800}
label.it.done .mtxt{text-decoration:line-through;color:#a2a8b4}
label.it.done .memo{filter:grayscale(1);opacity:.35}
label.it.done .lv{background:#adb5bd}
.nlink{flex:0 0 auto;font-size:11px;color:#4c6ef5;text-decoration:none;
  border:1px solid #dbe4ff;border-radius:7px;padding:3px 7px;white-space:nowrap;align-self:center}
.nlink:hover{background:#edf2ff}
.pri{display:inline-block;font-size:12px;margin-right:5px}
.bosswrap{display:flex;align-items:center;gap:12px}
.bossemo{font-size:30px;flex:0 0 auto}
.bossname{font-size:15px;font-weight:800;line-height:1.5}
.bossmeta{font-size:12px;color:#ffa8a8;margin-top:4px}
table.tt{width:100%;border-collapse:collapse;font-size:13px}
table.tt th,table.tt td{text-align:left;padding:7px 6px;border-bottom:1px solid #eceef3;vertical-align:top}
table.tt th{font-size:12px;color:#69707d;font-weight:700;white-space:nowrap}
table.tt td.d{white-space:nowrap;color:#495057;font-variant-numeric:tabular-nums}
.plain{font-size:14px}
.plain p{margin:0 0 11px}
.plain p:last-child{margin-bottom:0}
.plain strong{color:#c92a2a}
.src{font-size:12.5px;color:#495057}
.src ul{margin:0;padding-left:18px}
.src li{margin:4px 0}
.src a{color:#4c6ef5}
.prog{font-size:12px;color:#69707d;margin-top:10px;text-align:right}
.sched{background:#f8f9fb;border-radius:11px;padding:10px 12px;margin-top:12px;font-size:13px}
.sched b{font-size:12px;color:#69707d;display:block;margin-bottom:5px}
.sched div{padding:2px 0}
.none{font-size:13.5px;color:#69707d}
/* lock gate */
#lockgate{position:fixed;inset:0;z-index:99;background:linear-gradient(135deg,#4c6ef5,#7048e8 55%,#c2255c);
  display:flex;align-items:center;justify-content:center;padding:20px}
#lockgate .box{background:#fff;border-radius:18px;padding:28px 24px;width:100%;max-width:340px;text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,.28)}
#lockgate h2{margin:0 0 6px;font-size:19px;font-weight:800}
#lockdate{font-size:13px;color:#69707d;margin-bottom:18px}
#lockgate input{width:100%;padding:11px 12px;font-size:16px;border:1.5px solid #dee2e6;border-radius:10px;
  margin-bottom:11px;font-family:inherit}
#lockgate input:focus{outline:0;border-color:#4c6ef5}
#lockgate button{width:100%;padding:11px;font-size:15px;font-weight:800;color:#fff;background:#4c6ef5;
  border:0;border-radius:10px;cursor:pointer;font-family:inherit}
#lockgate button:hover{background:#3b5bdb}
#lockerr{color:#e03131;font-size:12.5px;margin-top:10px;min-height:18px;font-weight:700}
</style>
</head>
<body>

<div id="lockgate">
  <div class="box">
    <h2>🔒 朝ブリーフ</h2>
    <div id="lockdate">2026年8月25日（火）</div>
    <input type="password" id="pw" placeholder="パスフレーズ" autocomplete="off">
    <button id="go">開く</button>
    <div id="lockerr"></div>
  </div>
</div>

<div id="content"></div>

const SKEY = 'brief-2026-08-25';

function loadState(){ try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch(e){ return {}; } }
function saveState(s){ try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch(e){} }

function refresh(){
  const boxes = document.querySelectorAll('#content input[type=checkbox]');
  let hp = 100, left = 0;
  let selfOpen = 0, memOpen = 0;
  boxes.forEach(b => {
    const id = b.dataset.id || '';
    if (!b.checked) {
      left++;
      if (id.indexOf('self-') === 0) { hp -= 10; selfOpen++; }
      else if (id.indexOf('mem-') === 0) { hp -= 5; memOpen++; }
    }
    const lb = b.closest('label.it');
    if (lb) lb.classList.toggle('done', b.checked);
  });
  hp = Math.max(0, Math.min(100, hp));
  const v = document.getElementById('hpval'), f = document.getElementById('hpfill'),
        c = document.getElementById('hpcalc'), p = document.getElementById('prog');
  if (v) v.textContent = hp;
  if (f) {
    f.style.width = hp + '%';
    f.className = 'hpfill ' + (hp >= 80 ? 'ok' : (hp >= 50 ? 'warn' : 'bad'));
  }
  if (c) c.textContent = '自分の期限切れ ' + selfOpen + '件 ×-10 ／ メンバー切れ ' + memOpen + '件 ×-5 ／ 毎朝100にリセット';
  if (p) p.textContent = left > 0 ? ('残り ' + left + ' 件') : '全部やりきった！';
}

function wire(){
  const st = loadState();
  document.querySelectorAll('#content input[type=checkbox]').forEach(b => {
    const id = b.dataset.id;
    if (st[id]) b.checked = true;
    b.addEventListener('change', () => {
      const s = loadState();
      if (b.checked) s[id] = 1; else delete s[id];
      saveState(s);
      refresh();
    });
  });
  refresh();
}

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(){
  const err = document.getElementById('lockerr');
  const pw = document.getElementById('pw').value;
  err.textContent = '解錠中…';
  try {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt: b64d(ENC.salt), iterations: ENC.it, hash:'SHA-256' },
      km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const buf = await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64d(ENC.iv) }, key, b64d(ENC.ct));
    document.getElementById('content').innerHTML = new TextDecoder().decode(buf);
    document.getElementById('lockgate').style.display = 'none';
    wire();
  } catch(e) {
    err.textContent = 'パスフレーズが違います';
  }
}

document.getElementById('go').addEventListener('click', unlock);
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
