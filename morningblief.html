<title>🔒 朝ブリーフ</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:0 0 40px;background:#eef1f6;color:#1c2430;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,sans-serif;line-height:1.7}
#content{max-width:880px;margin:0 auto;padding:0 14px}
.hd{background:linear-gradient(135deg,#4a6fd4 0%,#7b52c4 55%,#c0479a 100%);color:#fff;border-radius:0 0 20px 20px;padding:22px 20px 20px;margin:0 -14px 18px;box-shadow:0 6px 18px rgba(60,70,120,.25)}
.hd-date{font-size:13px;opacity:.9;letter-spacing:.08em}
.hd h1{margin:4px 0 14px;font-size:24px;letter-spacing:.02em}
.hpbox{background:rgba(255,255,255,.16);border-radius:12px;padding:12px 14px}
.hplabel{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
#hpval{font-size:18px}
.hpbar{height:14px;background:rgba(0,0,0,.22);border-radius:8px;overflow:hidden}
.hpfill{height:100%;border-radius:8px;transition:width .35s ease,background .35s ease}
.hpfill.ok{background:linear-gradient(90deg,#2fd07a,#7ff0b0)}
.hpfill.warn{background:linear-gradient(90deg,#f0b429,#ffd97a)}
.hpfill.bad{background:linear-gradient(90deg,#e0453c,#ff8b80)}
.hpmemo{font-size:11px;opacity:.9;margin-top:6px}
.quote{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.3);font-size:15px;font-weight:600}
.qsrc{display:block;font-size:12px;font-weight:400;opacity:.85;margin-top:4px}
.card{background:#fff;border-radius:14px;padding:16px 18px;margin:0 0 16px;box-shadow:0 2px 8px rgba(40,50,90,.08)}
.card h2{margin:0 0 12px;font-size:17px;border-bottom:2px solid #eaeef5;padding-bottom:8px}
.card.danger{border-left:5px solid #e0453c}
.card.boss{background:#2b1114;color:#ffdede;border:1px solid #6d1f24}
.card.boss h2{border-bottom-color:#5a2027;color:#ff9a92}
.card.advice{border-left:5px solid #4a6fd4}
.card.advice p{margin:0 0 10px;font-size:14px}
.bossrow{display:flex;gap:12px;align-items:flex-start}
.bossemo{font-size:30px;line-height:1.2}
.bossname{font-size:16px;font-weight:700;color:#ffb3ac}
.bosstxt{font-size:13px;margin-top:2px}
.card.boss .note{color:#e4a7a7}
.sub{font-size:14px;margin:14px 0 8px;padding:5px 10px;border-radius:6px}
.sub.self{background:#fdecea;color:#a3241c}
.sub.mem{background:#fff2e0;color:#9a5a10}
ul.chk{list-style:none;margin:0;padding:0}
ul.chk li{display:flex;align-items:flex-start;gap:8px;padding:8px 4px;border-bottom:1px dashed #e6eaf1}
ul.chk li:last-child{border-bottom:none}
ul.chk label{flex:1;display:flex;align-items:flex-start;gap:8px;cursor:pointer}
ul.chk input{margin-top:5px;width:17px;height:17px;flex:none;cursor:pointer}
.memo{font-size:24px;width:30px;text-align:center;flex:none;line-height:1.3}
.mtxt{flex:1;font-size:14px}
.lv{display:inline-block;font-size:12px;background:#38424f;color:#fff;border-radius:9px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.due{font-size:12px;color:#7a8494}
.due b{color:#d0342c}
label.done .mtxt{text-decoration:line-through;opacity:.45}
label.done .memo{filter:grayscale(1);opacity:.35}
.nlink{flex:none;font-size:12px;color:#4a6fd4;text-decoration:none;border:1px solid #cfd9f0;border-radius:6px;padding:2px 8px;align-self:center;white-space:nowrap}
.nlink:hover{background:#eef2fd}
.note{font-size:11px;color:#8b94a3;margin:10px 0 0}
.none{font-size:14px;color:#5c6675;margin:0}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{background:#f2f5fa;text-align:left;padding:7px 9px;font-size:12px;color:#5c6675}
.tb td{padding:7px 9px;border-top:1px solid #eef1f6;vertical-align:top}
.nw{white-space:nowrap;font-weight:600}
.src ul{margin:0;padding-left:18px;font-size:13px}
.src li{margin-bottom:6px}
.src code{background:#f2f5fa;border-radius:4px;padding:1px 5px;font-size:12px}
a{color:#4a6fd4}
#lockgate{position:fixed;inset:0;background:linear-gradient(135deg,#3b5bbf,#7b52c4);display:flex;align-items:center;justify-content:center;z-index:99}
.lockbox{background:#fff;border-radius:16px;padding:28px 26px;width:min(340px,88vw);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.lockbox h2{margin:0 0 4px;font-size:19px}
#lockdate{font-size:13px;color:#6b7484;margin-bottom:16px}
#pw{width:100%;padding:11px;font-size:16px;border:1px solid #ccd4e2;border-radius:8px;text-align:center}
#go{width:100%;margin-top:10px;padding:11px;font-size:15px;font-weight:700;color:#fff;border:none;border-radius:8px;background:linear-gradient(135deg,#4a6fd4,#7b52c4);cursor:pointer}
#err{color:#d0342c;font-size:13px;height:18px;margin-top:8px}
</style>

var SKEY="brief-2026-08-31";
function loadState(){try{return JSON.parse(localStorage.getItem(SKEY)||"{}")}catch(e){return{}}}
function saveState(s){try{localStorage.setItem(SKEY,JSON.stringify(s))}catch(e){}}
function refresh(){
  var hp=100,rem=0;
  document.querySelectorAll("#content input[type=checkbox]").forEach(function(cb){
    var id=cb.getAttribute("data-id")||"";
    if(cb.checked){cb.parentElement.classList.add("done");}
    else{
      cb.parentElement.classList.remove("done");
      if(id.indexOf("self-")===0)hp-=10; else if(id.indexOf("mem-")===0)hp-=5;
      rem++;
    }
  });
  hp=Math.max(0,Math.min(100,hp));
  var f=document.getElementById("hpfill"),v=document.getElementById("hpval"),p=document.getElementById("prog");
  if(v)v.textContent=hp;
  if(f){f.style.width=hp+"%";f.className="hpfill "+(hp>=80?"ok":(hp>=50?"warn":"bad"));}
  if(p)p.textContent=rem?("残り "+rem+" 件"):"全部やりきった！";
}
function wire(){
  var st=loadState();
  document.querySelectorAll("#content input[type=checkbox]").forEach(function(cb){
    var id=cb.getAttribute("data-id");
    if(st[id])cb.checked=true;
    cb.addEventListener("change",function(){var s=loadState();s[id]=cb.checked;saveState(s);refresh();});
  });
  refresh();
}
function b64(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
async function open_(){
  var err=document.getElementById("err");
  err.textContent="復号中…";
  try{
    var pw=document.getElementById("pw").value;
    var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.salt),iterations:ENC.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},k,b64(ENC.ct));
    document.getElementById("content").innerHTML=new TextDecoder().decode(pt);
    document.getElementById("lockgate").style.display="none";
    wire();
  }catch(e){ err.textContent="パスフレーズが違います"; }
}
document.getElementById("go").addEventListener("click",open_);
document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")open_();});
</script>
