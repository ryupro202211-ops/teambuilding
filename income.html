<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>事業計画シミュレーター</title>
<style>
  :root{
    --ink:#1c2b24;
    --paper:#f6f4ee;
    --line:#d9d4c6;
    --accent:#2f5d4e;
    --accent-soft:#e4ede8;
    --gold:#a9782f;
    --mono: "SF Mono","JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Yu Gothic",sans-serif;
    padding:32px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  header{margin-bottom:22px;}
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    color:var(--accent);
    text-transform:uppercase;
    margin:0 0 6px;
  }
  h1{
    font-size:22px;
    margin:0 0 6px;
    letter-spacing:.02em;
  }
  .sub{color:#6b7268;font-size:13px;margin:0;}

  .tabs{
    display:flex;
    gap:6px;
    margin:22px 0 20px;
    background:#ece8dc;
    border-radius:9px;
    padding:4px;
  }
  .tab-btn{
    flex:1;
    border:0;
    background:transparent;
    padding:10px 14px;
    font-size:13.5px;
    font-family:inherit;
    font-weight:600;
    color:#6b7268;
    border-radius:6px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .tab-btn.active{
    background:#fff;
    color:var(--accent);
    box-shadow:0 1px 2px rgba(0,0,0,.06);
  }

  .panel{display:none;}
  .panel.active{display:block;}

  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:22px 22px 8px;
    margin-bottom:20px;
  }
  .card h2{
    font-size:13px;
    font-family:var(--mono);
    letter-spacing:.06em;
    color:var(--accent);
    margin:0 0 16px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h2::before{
    content:"";
    width:6px;height:6px;
    border-radius:50%;
    background:var(--gold);
    display:inline-block;
  }

  .field{margin-bottom:16px;}
  label{
    display:block;
    font-size:12.5px;
    color:#4a534d;
    margin-bottom:6px;
  }
  .input-row{
    display:flex;
    align-items:center;
    border:1px solid var(--line);
    border-radius:7px;
    overflow:hidden;
    background:#fcfbf8;
  }
  .input-row input{
    flex:1;
    border:0;
    background:transparent;
    padding:10px 12px;
    font-size:16px;
    font-family:var(--mono);
    color:var(--ink);
    min-width:0;
  }
  .input-row input:focus{outline:none;}
  .unit{
    padding:0 12px;
    font-size:12px;
    color:#8a8f86;
    border-left:1px solid var(--line);
    white-space:nowrap;
  }

  .flow{
    font-family:var(--mono);
    font-size:12.5px;
    color:#6b7268;
    background:var(--accent-soft);
    border-radius:7px;
    padding:12px 14px;
    line-height:1.9;
  }
  .flow .val{color:var(--accent);font-weight:600;}
  .flow .cap{color:var(--gold);}

  .split{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:4px;
  }
  .split-item{
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 10px;
    text-align:center;
    background:#fcfbf8;
  }
  .split-item .role{
    font-size:11px;
    color:#6b7268;
    margin-bottom:6px;
    font-family:var(--mono);
    letter-spacing:.05em;
  }
  .split-item .pct{
    font-size:10.5px;
    color:#a9a490;
    margin-bottom:2px;
  }
  .split-item .amt{
    font-size:17px;
    font-weight:700;
    color:var(--ink);
    font-family:var(--mono);
  }

  .total-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:14px 4px 6px;
    border-top:1px dashed var(--line);
    margin-top:14px;
  }
  .total-row .label{font-size:13px;color:#4a534d;}
  .total-row .amt{
    font-family:var(--mono);
    font-size:20px;
    font-weight:700;
    color:var(--accent);
  }

  .note{
    font-size:11px;
    color:#9a9c93;
    margin-top:14px;
    line-height:1.7;
  }

  .decision-box{
    display:flex;
    gap:14px;
    align-items:baseline;
    font-family:var(--mono);
    font-size:13px;
    color:#4a534d;
  }
  .decision-box .big{
    font-size:22px;
    font-weight:700;
    color:var(--accent);
  }

#lockgate{position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:99;padding:24px;text-align:center;}
#lockgate .eyebrow{margin:0;}
#lockgate h2{margin:0 0 4px;font-size:19px;letter-spacing:.02em;}
#lockgate .lead{margin:0 0 6px;font-size:13px;color:#6b7268;}
#lockgate input{padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:16px;font-family:var(--mono);width:min(260px,80vw);text-align:center;letter-spacing:.3em;}
#lockgate input:focus{outline:none;border-color:var(--accent);}
#lockgate button{padding:11px 28px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;}
#lockgate button:disabled{opacity:.55;cursor:default;}
#lockerr{color:#a2453c;min-height:20px;font-size:13px;}
</style>
</head>
<body>
<div id="lockgate">
  <p class="eyebrow">Career up College — 報酬試算</p>
  <h2>事業計画シミュレーター</h2>
  <p class="lead">パスワードを入力してください。</p>
  <input id="pass" type="password" inputmode="numeric" autocomplete="off" autofocus>
  <button id="openbtn">開く</button>
  <div id="lockerr"></div>
</div>
<div id="content"></div>

function b2u(b){ return Uint8Array.from(atob(b), c => c.charCodeAt(0)); }
async function decrypt(pass){
  const salt = b2u(ENC.salt), iv = b2u(ENC.iv), data = b2u(ENC.ct);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:ENC.it, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
  return JSON.parse(new TextDecoder().decode(pt));
}

  btn.disabled = true;
  err.textContent = '確認中…';
  try {
    const body = await decrypt(pass);
    document.getElementById('content').innerHTML = body.html;
    // innerHTML で差し込んだ <script> は実行されないため、要素として作り直す
    const s = document.createElement('script');
    s.textContent = body.js;
    document.body.appendChild(s);
    document.getElementById('lockgate').remove();
  } catch(e) {
    err.textContent = 'パスワードが違います。';
    btn.disabled = false;
    const p = document.getElementById('pass');
    p.value = '';
    p.focus();
  }
}
document.getElementById('openbtn').addEventListener('click', tryOpen);
document.getElementById('pass').addEventListener('keydown', e => { if (e.key === 'Enter') tryOpen(); });
</script>
</body>
</html>
